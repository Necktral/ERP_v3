name: erp_crm_prod

services:
  db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.prod
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Defina DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?Defina DJANGO_CORS_ALLOWED_ORIGINS}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Defina AUDIT_HMAC_KEY}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      AUTH_TOKEN_TRANSPORT: cookie
      AUTH_ALLOW_TRANSPORT_OVERRIDE: "0"
      AUTH_COOKIE_SECURE: "1"
      AUTH_COOKIE_REQUIRE_HTTPS: "1"
      POS_EDGE_CONNECTOR_SHARED_SECRET: ${POS_EDGE_CONNECTOR_SHARED_SECRET:?Defina POS_EDGE_CONNECTOR_SHARED_SECRET}
      SENTRY_ENVIRONMENT: production
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/auth/bootstrap/status/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  dash_analytics:
    build:
      context: .
      dockerfile: docker/dash.Dockerfile
    restart: unless-stopped
    environment:
      DASH_BACKEND_BASE_URL: http://backend:8000/api
      DASH_URL_PREFIX: /analytics
      DASH_SESSION_SECRET: ${DASH_SESSION_SECRET:?Defina DASH_SESSION_SECRET}
      DASH_INTERNAL_PORT: "8050"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/analytics/health', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      dash_analytics:
        condition: service_healthy
    ports:
      - "${ERP_HTTP_BIND:-127.0.0.1}:${ERP_HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata_prod:
