name: erpv3_forensic

# Stack mínimo y aislado para la auditoría. No publica puertos ni reutiliza
# container_name/volúmenes del entorno de demostración.
services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - forensic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: erp_crm-backend:latest
    working_dir: /app/backend
    env_file:
      - ../ERP_v3/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PYTHONPATH: /app/backend/src
      USE_GUNICORN: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  forensic_pgdata:
