S» en la fila y escribir el motivo (queda auditado)."]}],"business_rules":["La elección por período se determina así: primero un override manual del período; si no hay, la afiliación fechada del trabajador vigente al inicio del período.","«Resolver» crea la elección por afiliación para cada trabajador con línea en el período, sin pisar overrides existentes.","«Clasificar» fija el indicador de INSS de cada línea y, si la planilla destino no coincide, mueve la línea a la hoja hermana (la crea si no existe: misma planilla con sufijo «CON INSS»/«SIN INSS»).","El override de período se registra como fuente OVERRIDE y queda auditado con su motivo.","Cambiar la afiliación maestra desde el perfil exige el permiso nomina.inss.manage."],"permissions":["nomina.inss.read","nomina.inss.manage"],"routes":[{"path":"/nomina/periodos/:id/inss","name":"Régimen INSS","purpose":"Resolver y clasificar quién cotiza INSS en el período"}],"faqs":[{"q":"Tengo trabajadores que un mes cotizan INSS y otro no, ¿debo moverlos a mano?","a":"No. En el período entrá a «INSS», tocá «Resolver» y luego «Clasificar»: el sistema acomoda cada uno en la planilla CON o SIN INSS correcta y recalcula."},{"q":"¿Cómo hago una excepción para un solo trabajador en un período?","a":"En la tabla de INSS del período, usá «Poner/Quitar INSS» en su fila y escribí el motivo. Queda como override auditado de ese período."},{"q":"¿De dónde sale si un trabajador cotiza o no?","a":"De su afiliación INSS fechada, que se define con el interruptor «Cotiza INSS» en su perfil. El período toma lo vigente a su fecha de inicio, salvo que haya un override."}]},{"id":"nomina_complemento","name":"Complemento de salario","icon":"💜","one_liner":"Planilla aparte para el pago bruto pactado por convenio personal, sin INSS ni IR, con recibo imprimible y aprobación por funciones separadas.","what_it_does":"Maneja el complemento de salario: un pago bruto pactado con el trabajador, totalmente separado de la planilla legal (no genera INSS ni IR; el neto es igual al bruto). Lo opera el encargado de nómina (arma y envía) y un aprobador distinto (autoriza). Por período se crea una hoja de complemento que se siembra automáticamente con todos los trabajadores activos que tienen el complemento habilitado en su perfil, tomando el monto base de cada uno (ajustable por línea mientras la hoja está en borrador). La hoja pasa por un flujo de armar/enviar y aprobar, y genera un recibo imprimible «COMPLEMENTO DE SALARIO». Cada línea se puede marcar como recibida (pago en mano firmado).","key_features":["Hoja de complemento por período sembrada desde los perfiles con complemento habilitado","Monto base tomado del perfil, ajustable por línea solo en borrador","Neto = bruto (sin deducciones de ley)","Flujo con separación de funciones: quien envía no puede aprobar","Recibo imprimible en PDF por hoja","Marca de «Recibí» por línea (registro del pago en mano)"],"flows":[{"title":"Procesar el complemento de un período","steps":["Abrir el período → botón «Complemento».","Tocar «Nueva»: se crea la hoja con todos los trabajadores que tienen complemento en su perfil.","Ajustar montos por línea si hace falta (solo en borrador).","Tocar «Enviar» (lo hace el encargado).","Otra persona (no quien envió) toca «Aprobar».","Imprimir el recibo y marcar «Recibí» cuando se entregue el pago."]}],"business_rules":["El complemento NUNCA crea línea de planilla legal ni toca la base de INSS/IR: neto = bruto.","La hoja se siembra con los trabajadores activos que tienen salary_complement_enabled, usando salary_complement_base_nio como monto.","El monto por línea solo se edita mientras la hoja está en BORRADOR; no puede ser negativo.","Separación de funciones: quien envía la hoja no puede aprobarla; aprobar exige el permiso nomina.complement.approve.","El «Recibí» solo se registra sobre una hoja aprobada (pago en mano firmado)."],"permissions":["nomina.complement.read","nomina.complement.manage","nomina.complement.approve"],"routes":[{"path":"/nomina/periodos/:id/complemento","name":"Complemento de salario","purpose":"Hojas de complemento, montos, aprobación y recibo"}],"faqs":[{"q":"¿Qué es el complemento de salario?","a":"Un pago bruto pactado con el trabajador, aparte de la planilla legal: no lleva INSS ni IR, el neto es igual al bruto y se entrega con su propio recibo."},{"q":"¿Cómo aparece un trabajador en la hoja de complemento?","a":"Hay que activar «Complemento de salario» en su perfil y ponerle el monto base. Al crear la hoja, todos los que lo tengan habilitado se siembran solos."},{"q":"¿Puedo aprobar yo la hoja que armé?","a":"No. Por separación de funciones, quien envía la hoja no puede aprobarla: lo hace otra persona con permiso de aprobación."}]},{"id":"sala_de_pago","name":"Sala de pago (Cobrador-Pagador)","icon":"💵","one_liner":"Pantalla del pagador para entregar el neto al trabajador y cobrar sus deudas internas, con funcionamiento sin conexión.","what_it_does":"Es la pantalla del cobrador-pagador. Para un período aprobado o pagado, muestra a cada trabajador con todo lo que el pagador necesita de un vistazo: en qué planillas legales está (CON/SIN INSS), su complemento si tiene, el desglose de deducciones (INSS, IR, préstamo personal y crédito de comisariato), cuánto se le ha pagado y el neto que falta entregar. Registra el pago del neto de cada planilla (efectivo, transferencia o cheque) y permite imprimir un recibo. Funciona sin conexión: los pagos se guardan en una cola local y se sincronizan al recuperar la red, sin riesgo de doble pago.","key_features":["Resumen consolidado por trabajador del período (planillas legales + complemento)","Desglose de deducciones y de la recaudación (comisariato y préstamo): cobrado vs. pendiente","Totales del período: empleados, neto a entregar, recaudado y pendiente","Registro de pago del neto por planilla (efectivo / transferencia / cheque)","Recibo de pago imprimible por trabajador","Modo sin conexión con cola local y sincronización (idempotente, sin doble pago)"],"flows":[{"title":"Pagar a un trabajador","steps":["Nómina → Sala de pago.","Elegir el período (aprobado o pagado) y, si aplica, la sucursal.","Buscar al trabajador y tocar su tarjeta para ver el detalle.","En cada planilla pendiente, tocar «Pagar».","Elegir el método y el monto a entregar y confirmar.","Si hay conexión se envía al instante; si no, queda en cola y se sincroniza después."],"note":"El monto debe ser mayor que cero y no puede exceder lo que resta de esa planilla."}],"business_rules":["La sala de pago es solo de pago/lectura: las deducciones y cobros ya se aplicaron al armar la planilla.","Solo se ofrecen períodos en estado APROBADO o PAGADO.","Una planilla sin sucursal (de toda la empresa) se ve en cualquier sucursal; las de otra sucursal se excluyen.","El pago es idempotente por clave: la cola offline reintenta sin generar doble pago.","Errores de dominio (período no aprobado, sobrepago) se rechazan y se muestran como no procesables.","El neto a entregar por trabajador = suma de netos de sus planillas legales + complemento; «pagado» = lo registrado + complemento recibido."],"permissions":["nomina.payment.read","nomina.payment.register"],"routes":[{"path":"/nomina/sala-de-pago","name":"Sala de pago","purpose":"Pagar el neto y ver cobros por trabajador del período"}],"faqs":[{"q":"¿Por qué no veo ningún trabajador en la sala de pago?","a":"Porque el período debe estar aprobado o pagado. Aprobá la planilla en Nómina o elegí un período aprobado/pagado en el selector."},{"q":"¿Puedo cobrar estando sin internet?","a":"Sí. Los pagos se guardan en una cola local y se envían solos al recuperar conexión; no se duplican aunque se reintente."},{"q":"¿Dónde veo cuánto se le cobró al trabajador por comisariato o préstamo?","a":"En el detalle del trabajador, sección «Dinero recaudado»: muestra lo deducido y abonado de comisariato y préstamo, y lo pendiente."},{"q":"¿Puedo pagar más del neto de una planilla?","a":"No. El monto no puede exceder lo que resta de esa planilla; el sistema lo bloquea."}]},{"id":"asistencia_campo","name":"Asistencia del día (marcaje de campo)","icon":"📋","one_liner":"Pantalla simple del mandador/capataz para marcar presente/ausente/enfermo/medio día/accidentado, y consolidar el día hacia la planilla; funciona en celular y sin conexión.","what_it_does":"Es la pantalla del mandador o capataz para pasar lista del día. Muestra al personal activo de la empresa con su foto y, por cada uno, se marca un estado: presente, ausente, enfermó, trabajó medio día o accidentado. Cada marca alimenta las piezas formales de campo (pase de lista y eventos), que luego una consolidación cruza con otras fuentes (reportes de cuadrilla y control biométrico, si lo hay) para detectar conflictos. Cuando termina el día, quien tenga el permiso lo «consolida» hacia un período de planilla en revisión, de donde después la nómina toma los días trabajados. Está optimizada para celular y entrada limitada en campo. Hay separación de funciones: un rol ve la lista, otro la marca y otro la consolida.","key_features":["Lista del personal activo con foto, puesto y estado del día","Marcaje por trabajador: Presente / Ausente / Se enfermó / Trabajó medio día / Accidentado","Para «Se enfermó» pregunta si hay constancia médica (con constancia el día se paga, sin constancia no)","Deshacer/corregir una marca puesta por error («Quitar marca»)","Modo consulta (solo ver) para roles que no marcan","Consolidar el día hacia un período de planilla en revisión","Pensada para celular y operación sin conexión (marcado optimista)"],"flows":[{"title":"Pasar lista del día","steps":["Abrir Asistencia (en celular es la pantalla de entrada).","Buscar al trabajador o recorrer la lista.","En su selector, elegir el estado (Presente, Ausente, Se enfermó, Medio día, Accidentado).","Si es «Se enfermó», indicar si presentó constancia médica certificada.","La marca se guarda; el contador «marcados» sube."],"note":"Para corregir, abrir el selector y elegir «Quitar marca»: el trabajador vuelve a «sin marcar»."},{"title":"Consolidar el día hacia la planilla","steps":["Con el personal ya marcado, tocar «Consolidar» (requiere el permiso de consolidación).","Elegir el período de planilla abierto (borrador o en revisión) destino.","Confirmar: el día se consolida y queda en revisión; se avisa cuántos quedan para revisar (p. ej. sin reporte de cuadrilla).","Luego, en la planilla, se usa «Aplicar asistencia» para traer esos días."]}],"business_rules":["Separación de funciones: ver la lista exige nomina.field.read; marcarla exige nomina.field.capture; consolidar exige nomina.field.consolidate.","La marca no es un canal paralelo: escribe en las piezas formales de campo (pase de lista + eventos) que la consolidación de varias fuentes ya cruza.","«Trabajó medio día» paga medio día (0.5); «Accidentado» pone el día completo (el accidente fue en el trabajo); «Se enfermó» paga el día solo con constancia médica certificada, si no, no paga.","Corregir una marca reemplaza solo la línea y los eventos hechos por esta pantalla; lo que registró el capataz por su canal no se toca.","El día de campo se abre con la primera marca, no con la consulta; solo se puede consolidar si ya existe el día y hay al menos una marca.","La consolidación detecta conflictos: lista ausente pero presente en cuadrilla, doble cuadrilla sin traslado (bloqueante), biométrico que contradice la lista, etc.; con conflictos bloqueantes no se puede aprobar.","El séptimo día se gana por semana con trabajo y sin falta injustificada; subsidio/permiso/vacación no lo rompen.","El perfil del trabajador en esta pantalla es solo lectura: se edita desde Recursos Humanos en PC."],"permissions":["nomina.field.read","nomina.field.capture","nomina.field.consolidate"],"routes":[{"path":"/asistencia","name":"Asistencia del día","purpose":"Pasar lista del personal y consolidar el día hacia la planilla"}],"faqs":[{"q":"Marqué a alguien por equivocación, ¿cómo lo deshago?","a":"Abrí su selector y elegí «Quitar marca»: vuelve a quedar «sin marcar» (solo borra lo que registraste por esta pantalla)."},{"q":"Un trabajador se enfermó, ¿le pago el día?","a":"Solo si presentó constancia médica certificada. Al marcar «Se enfermó» el sistema pregunta: con constancia el día se paga, sin constancia no."},{"q":"¿Cómo pasan los días marcados a la planilla?","a":"Primero consolidás el día hacia un período de planilla; luego, en la planilla, tocás «Aplicar asistencia» para traer los días trabajados aprobados."},{"q":"Solo puedo ver la lista pero no marcar, ¿por qué?","a":"Tu rol es de consulta (supervisor). Marcar requiere el permiso de captura de campo; consolidar requiere el de consolidación."},{"q":"¿Funciona en el celular sin internet?","a":"Sí, la pantalla está hecha para celular y marca de forma optimista; la señal en campo puede tardar y la marca se confirma cuando hay conexión."}]}],"uncertainties":["El permiso para consolidar la asistencia de campo (nomina.field.consolidate) se infiere del frontend (AsistenciaPage.vue) y del flujo SoD; el endpoint de consolidar (views_field.py) no se leyó en detalle, así que el código exacto del permiso de consolidación podría diferir.","Existe un flujo de aprobación maker-checker de la asistencia de campo (approve-request / approve, en field/views_field.py) y la captura por cuadrilla (PR #17), que no se documentaron como módulo aparte por estar fuera de la pantalla principal de Asistencia; sus permisos exactos no se verificaron.","El control biométrico (dispositivos, importación de marcajes) aparece en las rutas del backend (biometric/) como tercera fuente de asistencia, pero no tiene pantalla propia en las carpetas frontend indicadas del área; no se documentó como módulo de usuario.","Los permisos hr.contract.read/manage, hr.vacation.read/manage, hr.file.manage y nomina.complement.* se confirmaron en el backend (views) y/o en el router del frontend (routes.ts).","La línea de planilla puede recibir el abono de préstamo (loan_payment) y crédito de comisariato (store_credit_deduction) por integración con otros módulos (portfolio/comisariato); el detalle de esa integración está fuera de esta área y solo se describió a nivel de que 'se llenan solos'."]},{"area_id":"cartera-contabilidad-intercompania","area_title":"Cartera, Contabilidad e Intercompañía","area_summary":"Cubre el dinero por cobrar y por pagar (cartera, cobranza, créditos), toda la contabilidad de la empresa (diario con separación de funciones, plan de cuentas, períodos, reportes, tipo de cambio, presupuestos y cierre anual), los cruces entre las empresas del grupo (intercompañía y consolidación) y el motor de cierre contable end-to-end (CEC). Es el corazón financiero-contable del ERP: lo operativo (ventas, compras, caja, planilla) alimenta automáticamente los saldos y los asientos, y el contador valida, aprueba, postea y cierra con controles de auditoría.","icon":"💰","modules":[{"id":"cartera","name":"Cartera (cuentas por cobrar y por pagar)","icon":"📥","one_liner":"Lo que te deben los clientes (CxC) y lo que le debés a proveedores (CxP), con su antigüedad y estado de cuenta.","what_it_does":"Es la pantalla central de la cartera. Muestra en pestañas las Cuentas por Cobrar (CxC), las Cuentas por Pagar (CxP), las Aplicaciones de pago, la mesa de Cobranza y el Estado de cuenta de un cliente. Los saldos no se crean a mano: nacen automáticamente cuando se emite una factura a crédito (genera la CxC) o cuando se registra una compra a proveedor con tercero fuerte (genera la CxP). Cada documento muestra su total, saldo pendiente, fecha de vencimiento, días de mora y su 'bucket' de antigüedad (CURRENT, 0-30, 31-60, 61-90, 91-120, 120+).","key_features":["Pestaña Por cobrar (CxC): lista de lo que deben los clientes, con saldo, vencimiento, antigüedad y estado","Pestaña Por pagar (CxP): lista de lo que se debe a proveedores, con botón Pagar","Pestaña Aplicaciones: pagos ya aplicados a las obligaciones (los generan caja, comisariato y planilla)","Pestaña Cobranza: mesa de trabajo de clientes vencidos con recordatorios por niveles","Pestaña Estado de cuenta: por cliente, con saldo total, vencido y documentos abiertos, e impresión","Ajustar una CxC (subir o rebajar el monto con motivo) y Castigar una CxC incobrable","Antigüedad de saldos calculada por días de mora","Multi-moneda: el saldo se ve en su moneda (NIO u otra)"],"flows":[{"title":"Pagarle a un proveedor (CxP)","steps":["Entrar a Cartera y abrir la pestaña 'Por pagar (CxP)'","Ubicar la cuenta del proveedor con saldo pendiente","Hacer clic en 'Pagar' (solo aparece si hay saldo y se tiene el permiso)","Completar los datos del pago en el diálogo de pago al proveedor y confirmar"],"note":"El botón Pagar solo se muestra cuando el saldo pendiente es mayor que cero."},{"title":"Ajustar una cuenta por cobrar","steps":["En la pestaña 'Por cobrar (CxC)', hacer clic en 'Ajustar' en la fila del documento","Escribir el monto del ajuste en C$ (negativo para rebajar) y el motivo (obligatorio)","Hacer clic en 'Aplicar ajuste'"],"note":"El ajuste cambia el monto principal del documento y queda registrado en su historial con fecha, monto, motivo y usuario."},{"title":"Castigar una cuenta incobrable","steps":["En 'Por cobrar (CxC)', hacer clic en 'Castigar' en la fila (color rojo)","Escribir el motivo (mínimo 5 caracteres) en el cuadro de confirmación","Confirmar el castigo"],"note":"Castigar saca la deuda de cobranza y es irreversible. No se puede castigar una cuenta ya pagada ni una ya castigada."},{"title":"Ver el estado de cuenta de un cliente","steps":["Abrir la pestaña 'Estado de cuenta'","Elegir el cliente en el selector","Revisar las tarjetas de Saldo total, Vencido y Documentos abiertos, y el detalle por factura","Opcional: hacer clic en 'Imprimir'"]}],"business_rules":["Las CxC se crean automáticamente desde facturas a crédito (evento BILLING.DocumentIssued); el contado y consumidor final no generan CxC","Creación idempotente: una factura (BILLING_DOC) o compra (PROCUREMENT_DOC) no duplica su CxC/CxP aunque se reprocese el evento","La fecha de vencimiento de la CxC sale de los días de crédito de la cuenta del cliente; sin cuenta de crédito vence el mismo día de emisión","El monto principal siempre debe ser positivo; el monto aplicado no puede exceder el total (validado por base de datos)","La aplicación de pagos sigue la cascada contable: penalidad → interés → comisiones → principal","Al aplicar un pago la obligación se bloquea (select_for_update) para evitar sobre-aplicación cuando concurren el pago automático y el manual","Un pago debe estar CAPTURADO para poder aplicarse; no se puede aplicar más que el saldo pendiente ni que el monto del pago","Si el pago y la obligación están en monedas distintas se exige tipo de cambio","El estado de la obligación pasa solo: PENDING → PARTIAL → PAID (o OVERDUE si vence)","Castigar requiere el permiso de write-off y es irreversible; no aplica a cuentas pagadas","Todas las acciones sensibles (crear, ajustar, castigar, aplicar pago) quedan auditadas"],"permissions":["portfolio.receivable.read","portfolio.receivable.write","portfolio.receivable.adjust","portfolio.receivable.writeoff","portfolio.payable.read","portfolio.payable.write","procurement.payable.pay","portfolio.payment.allocation.read","portfolio.allocation.read","portfolio.allocation.write","portfolio.collections.read"],"routes":[{"path":"/cartera","name":"Cartera","purpose":"Pestañas de CxC, CxP, Aplicaciones, Cobranza y Estado de cuenta"}],"faqs":[{"q":"¿Cómo se crea una cuenta por cobrar?","a":"Sola: cuando se emite una factura a crédito, el sistema genera la CxC del cliente automáticamente. No se captura a mano."},{"q":"¿Cómo rebajo el saldo de un cliente sin que pague?","a":"Con el botón Ajustar en la CxC: poné un monto negativo y el motivo. Queda auditado."},{"q":"¿Puedo deshacer un castigo?","a":"No. Castigar es irreversible; la deuda sale de cobranza. Por eso pide motivo y confirmación."},{"q":"¿Por qué no veo la pestaña Por pagar o Cobranza?","a":"Dependen de permisos (portfolio.payable.read, portfolio.collections.read). Si no los tenés, esas pestañas no aparecen."}]},{"id":"cobranza","name":"Cobranza (recordatorios por niveles)","icon":"📣","one_liner":"Mesa de cobranza de clientes vencidos con carta de cobro imprimible y escalación 1→3 que nunca retrocede.","what_it_does":"Es la pestaña Cobranza dentro de Cartera (y un módulo de backend propio, la 'Ola D'). Agrupa por cliente y moneda los documentos vencidos, calcula la mora máxima y sugiere un nivel de recordatorio. El usuario genera un recordatorio formal que congela un snapshot de los documentos cubiertos y arma una carta de cobro imprimible con el texto del nivel. Sirve para gestionar la cobranza de forma ordenada y dejar evidencia de cada aviso.","key_features":["Lista de clientes con saldo vencido, documentos vencidos, saldo y mora máxima en días","Nivel sugerido automático: 1 (aviso amable), 2 (reclamo formal, ≥30 días), 3 (última instancia, ≥60 días)","El nivel nunca baja respecto del último recordatorio emitido (escalación monótona)","Aviso de 'recordado hace poco' (cooldown de 7 días) — no bloquea, solo sugiere esperar","Genera e imprime una carta de cobro con membrete de la empresa, detalle de documentos y total vencido","Historial de recordatorios por cliente con opción de reimprimir","Una fila por cada moneda en que el cliente tiene deuda (dos monedas = dos recordatorios)"],"flows":[{"title":"Generar un recordatorio de cobro","steps":["En Cartera, abrir la pestaña 'Cobranza'","Ubicar al cliente vencido y hacer clic en 'Generar recordatorio'","Revisar el nivel sugerido (se puede cambiar entre 1, 2 y 3) y agregar notas opcionales","Hacer clic en 'Generar e imprimir': se registra el recordatorio y se abre la carta para imprimir"],"note":"Si al cliente se le recordó hace menos de 7 días aparece un aviso, pero igual se puede generar."},{"title":"Consultar el historial de cobranza de un cliente","steps":["En la pestaña Cobranza, hacer clic en 'Historial' en la fila del cliente","Ver los recordatorios previos con su nivel, fecha y total","Opcional: 'Reimprimir' una carta anterior"]}],"business_rules":["Solo entran a la mesa documentos con estado abierto (PENDING/PARTIAL/OVERDUE), con vencimiento pasado y saldo > 0","Nivel base por mora: cualquier mora arranca en 1; ≥30 días pasa a 2; ≥60 días pasa a 3","Escalación monótona: el nivel sugerido nunca es menor que el último recordatorio + 1 (tope 3)","Cooldown de 7 días: marca 'recordado hace poco' como advertencia, no como bloqueo","No se puede generar un recordatorio si el cliente no tiene documentos vencidos en esa moneda","El recordatorio congela un snapshot de los documentos vencidos al momento de emitirse (no cambia después)","El aviso in-app lo dan las alertas del sistema; la cobranza no lo duplica","Cada recordatorio queda auditado con el usuario que lo generó"],"permissions":["portfolio.collections.read","portfolio.collections.remind"],"routes":[{"path":"/cartera","name":"Cartera › Cobranza","purpose":"Pestaña Cobranza dentro de la pantalla de Cartera"}],"faqs":[{"q":"¿Por qué el sistema me sugiere nivel 3 si la mora es de 20 días?","a":"Porque al cliente ya se le mandó un recordatorio anterior y el nivel no puede bajar: sube respecto del último."},{"q":"¿Puedo mandar otro recordatorio aunque acabe de mandar uno?","a":"Sí, pero si fue hace menos de 7 días el sistema te avisa para que consideres darle tiempo."},{"q":"¿Dónde queda la carta de cobro?","a":"Se genera en el navegador para imprimir y el recordatorio queda guardado en el historial del cliente, listo para reimprimir."}]},{"id":"creditos","name":"Créditos","icon":"🏦","one_liner":"Créditos otorgados (agrícolas, de equipo, líneas): se aprueban, se desembolsan y devengan intereses.","what_it_does":"Lista los créditos de la empresa (capital de trabajo, préstamo a plazo, línea de crédito, hipoteca, financiamiento de equipo, factoring, crédito a proveedor, préstamo intercompañía). Muestra contrato, deudor, tipo, principal, saldo, tasa, vencimiento y estado. La acción central es el desembolso: al desembolsar, el crédito pasa a ACTIVO (o DESEMBOLSADO si se entrega el total) y arranca el devengo de intereses.","key_features":["Listado de créditos con contrato, deudor, tipo, principal, saldo, tasa % y vencimiento","Estados: borrador, aprobado, desembolsado, activo, reestructurado, pagado, en mora, castigado","Desembolso parcial o total con monto y fecha","Devengo de intereses por crédito (simple, compuesto o tasa fija) calculado sobre el principal pendiente","Soporta colateral/garantía, garante, período de gracia y frecuencia de pago"],"flows":[{"title":"Desembolsar un crédito","steps":["Desde Cartera, entrar a 'Créditos'","Ubicar un crédito en estado PENDIENTE o APROBADO y hacer clic en 'Desembolsar'","Indicar el monto a desembolsar en C$ y la fecha de desembolso","Confirmar: el crédito queda ACTIVO (o DESEMBOLSADO si se entregó el total aprobado)"],"note":"El total desembolsado nunca puede superar el monto aprobado (control de base de datos y de servicio)."}],"business_rules":["Solo se desembolsa un crédito en estado APROBADO, DESEMBOLSADO o ACTIVO","El monto a desembolsar debe ser positivo y el acumulado no puede exceder el monto aprobado","Prestamista y prestatario deben ser partes distintas","La tasa de interés no puede ser negativa","El devengo solo corre sobre créditos DESEMBOLSADO o ACTIVO y sobre el principal pendiente (descontando lo aplicado a interés/fees/penalidad)","Interés simple: P×r×días/365; compuesto: P×((1+tasa diaria)^días−1); tasa fija: P×tasa/12","No se devenga dos veces el mismo día (restricción única crédito+fecha)"],"permissions":["portfolio.credit.read","portfolio.credit.write","portfolio.credit.disburse","portfolio.interest.read"],"routes":[{"path":"/cartera/creditos","name":"Créditos","purpose":"Listado de créditos y desembolso"}],"faqs":[{"q":"¿Cuándo empiezan a correr los intereses?","a":"Cuando se desembolsa el crédito: el desembolso lo activa y arranca el devengo sobre el principal pendiente."},{"q":"¿Puedo desembolsar más de lo aprobado?","a":"No. El sistema bloquea cualquier desembolso que haga que el total supere el monto aprobado."},{"q":"¿Por qué no veo el botón Desembolsar?","a":"Porque te falta el permiso portfolio.credit.disburse o el crédito no está en estado pendiente/aprobado."}]},{"id":"contabilidad-home","name":"Contabilidad (panel)","icon":"📒","one_liner":"Panel del contador con accesos a diario, plan de cuentas, períodos, reportes, monedas, intercompañía, centros de costo, presupuestos y cierre anual.","what_it_does":"Es la portada del módulo contable. Muestra tarjetas hacia cada herramienta del contador; cada tarjeta aparece solo si el usuario tiene el permiso correspondiente. Desde aquí se navega a todo el resto de la contabilidad.","key_features":["Tarjetas hacia Diario, Plan de cuentas, Períodos, Reportes, Tipo de cambio, Intercompañía, Centros de costo, Presupuestos y Cierre anual","Cada tarjeta se muestra según el permiso del usuario en la empresa activa"],"flows":[{"title":"Entrar a una herramienta contable","steps":["Abrir Contabilidad","Hacer clic en la tarjeta de la herramienta deseada (p. ej. Diario o Reportes)"]}],"business_rules":["Cada tarjeta solo se muestra si el usuario tiene el permiso de lectura de ese sub-módulo"],"permissions":["accounting.report.read","accounting.journal_draft.read","accounting.coa.read","accounting.period.read","accounting.fx_rate.read","accounting.intercompany.read","accounting.cost_center.read","accounting.budget.read","accounting.year_end.close"],"routes":[{"path":"/contabilidad","name":"Contabilidad","purpose":"Panel con accesos a todas las herramientas contables"}],"faqs":[{"q":"¿Por qué veo menos tarjetas que otro compañero?","a":"Las tarjetas dependen de tus permisos; solo se muestran las herramientas a las que tenés acceso."}]},{"id":"diario","name":"Diario contable (asientos)","icon":"📖","one_liner":"Borradores de asientos generados por la operación y asientos manuales, con flujo de aprobar → postear (separación de funciones) y reversa.","what_it_does":"El sistema es event-sourced: los asientos nacen de eventos operacionales (ventas, compras, caja, planilla, inventario) según reglas de posteo (PostingRuleSet) y caen como borradores. El contador ve los borradores por estado, puede crear asientos manuales (reclasificaciones, provisiones, depreciación) que cuadren débito = crédito, aprobar los validados y postear los aprobados. Los asientos ya posteados se pueden reversar (genera el asiento contrario). Todo el flujo respeta separación de funciones (SoD): quien genera no aprueba, y quien aprueba no postea.","key_features":["Pestaña Borradores: lista por estado (Generado, Validado, Aprobado para postear, Posteado, Excepción) con totales debe/haber","Pestaña Asientos: asientos posteados con fecha, descripción y totales","Crear asiento manual con varias líneas (cuenta, debe/haber, monto, centro de costo) que debe cuadrar","Aprobar borradores validados (en lote)","Postear borradores aprobados (en lote)","Reversar un asiento posteado indicando motivo (crea el asiento contrario)","Marca de validación fallida visible en cada borrador"],"flows":[{"title":"Crear un asiento manual","steps":["En Diario, hacer clic en 'Nuevo asiento manual'","Indicar fecha y concepto del asiento","Agregar líneas: elegir cuenta posteable, lado (Debe/Haber), monto y opcionalmente el centro de costo","Verificar que el total Debe = total Haber (el sistema muestra 'cuadra ✓')","Hacer clic en 'Crear borrador': queda como borrador VALIDADO; otra persona debe aprobarlo y postearlo (SoD)"],"note":"Requiere que la contabilidad GL esté habilitada (Fase 7) y que el mes del asiento esté abierto. Las cuentas deben ser activas y posteables."},{"title":"Aprobar y postear borradores","steps":["Hacer clic en 'Aprobar validados' para aprobar en lote los borradores validados","Luego hacer clic en 'Postear aprobados' para llevar los aprobados al diario (asientos posteados)"],"note":"No podés aprobar borradores que vos mismo generaste, ni postear borradores que vos mismo aprobaste, salvo que tengas el permiso de override SoD."},{"title":"Reversar un asiento posteado","steps":["En la pestaña 'Asientos', hacer clic en 'Reversar' en la fila del asiento","Escribir el motivo de la reversa (mínimo 5 caracteres)","Confirmar: se genera el asiento contrario"],"note":"No se puede reversar una reversa; reversar el mismo asiento dos veces es idempotente (devuelve la reversa existente). El período de la reversa debe estar abierto."}],"business_rules":["Separación de funciones (SoD) al aprobar: el mismo usuario no puede generar y aprobar el mismo borrador","SoD al postear: el mismo usuario no puede aprobar y postear el mismo borrador","Override SoD (allow_same_*) solo permitido con el permiso accounting.sod.override","Un borrador no balanceado (debe ≠ haber) no se postea","No se postea en un período fiscal cerrado (queda registrado el bloqueo en auditoría)","El asiento manual debe cuadrar débito = crédito y ser > 0; las cuentas deben ser activas y posteables","Reversar: no se reversa una reversa; la operación es idempotente; el SoD bloquea reversar tu propio asiento sin override; el período de reversa debe estar abierto","Cada acción (aprobar, postear, reversar) queda auditada con actor, antes/después y manifiesto"],"permissions":["accounting.journal_draft.read","accounting.journal_draft.approve","accounting.journal_draft.post","accounting.journal_entry.read","accounting.journal_entry.reverse","accounting.journal_entry.reverse_batch","accounting.manual_journal.create","accounting.sod.override"],"routes":[{"path":"/contabilidad/diario","name":"Diario contable","purpose":"Borradores, asientos posteados, asiento manual, aprobar/postear/reversar"}],"faqs":[{"q":"¿Por qué no puedo aprobar un asiento que generé yo?","a":"Por separación de funciones (SoD): quien genera no aprueba. Necesita aprobarlo otra persona, salvo que tengas el permiso de override."},{"q":"¿De dónde salen los asientos que no creé a mano?","a":"Los genera la operación: cada venta, compra, pago o planilla produce su borrador contable según las reglas de posteo."},{"q":"¿Cómo corrijo un asiento ya posteado?","a":"No se borra: se reversa indicando motivo, lo que genera el asiento contrario. Si querés, después hacés el correcto."},{"q":"¿Por qué mi asiento manual no me deja guardar?","a":"Porque no cuadra (Debe ≠ Haber) o el total es cero. El botón se habilita solo cuando cuadra y es positivo."}]},{"id":"plan-cuentas","name":"Plan de cuentas","icon":"🌳","one_liner":"Catálogo contable de la empresa y configuración de moneda funcional y cuentas especiales (FX, resultados acumulados).","what_it_does":"Muestra el catálogo de cuentas (código, nombre, tipo, cuenta padre y atributos) y la configuración contable: moneda funcional y cuentas de ganancia/pérdida cambiaria. Permite crear o actualizar cuentas. Solo las cuentas marcadas como posteables reciben asientos; las demás sirven para agrupar. Las cuentas pueden marcarse como revaluables (moneda extranjera).","key_features":["Catálogo con código, nombre, tipo (Activo, Pasivo, Patrimonio, Ingreso, Gasto), cuenta padre y atributos","Atributos: Posteable, Revaluable (moneda extranjera), Activa/Inactiva","Muestra moneda funcional y cuentas de ganancia/pérdida cambiaria configuradas","Crear nueva cuenta (código, nombre, tipo, padre, posteable, revaluable)"],"flows":[{"title":"Crear una cuenta","steps":["En Plan de cuentas, hacer clic en 'Nueva cuenta'","Escribir código, nombre y elegir el tipo","Opcional: indicar la cuenta padre (código) y marcar si es posteable y/o revaluable","Hacer clic en 'Guardar cuenta'"]}],"business_rules":["Solo las cuentas posteables reciben asientos; las no posteables agrupan","Crear/actualizar cuentas requiere el permiso accounting.coa.update (ver requiere accounting.coa.read)","Cambiar la moneda funcional, habilitar GL (Fase 7) o asignar cuentas FX/resultados acumulados se hace desde esta configuración","Las cuentas FX de ganancia/pérdida deben existir y estar activas para poder asignarse"],"permissions":["accounting.coa.read","accounting.coa.update"],"routes":[{"path":"/contabilidad/plan-cuentas","name":"Plan de cuentas","purpose":"Catálogo de cuentas y configuración contable de la empresa"}],"faqs":[{"q":"¿Por qué no puedo elegir una cuenta en un asiento?","a":"Porque solo se pueden usar cuentas posteables. Las cuentas de agrupación no reciben asientos."},{"q":"¿Qué es una cuenta revaluable?","a":"Una cuenta en moneda extranjera que entra en la corrida de revaluación de tipo de cambio."}]},{"id":"periodos","name":"Períodos fiscales","icon":"📅","one_liner":"Cerrar un mes bloquea nuevos asientos en él; reabrir exige motivo, respeta el orden cronológico y queda auditado.","what_it_does":"Lista los períodos fiscales (mes/año) con su estado Abierto o Cerrado. Cerrar un período evalúa primero unas compuertas (gates) de calidad y, si pasan, sella el mes para que no se posteen más asientos. Reabrir devuelve el mes a abierto, pero exige motivo y queda auditado; no se reabre un mes si hay un mes posterior aún cerrado (hay que reabrir de lo más nuevo a lo más viejo).","key_features":["Listado de períodos con estado Abierto/Cerrado","Cerrar período (por el botón o eligiendo el mes AAAA-MM)","Reabrir período con motivo obligatorio","Los períodos se crean solos al postear o cerrar asientos"],"flows":[{"title":"Cerrar un período","steps":["En Períodos, hacer clic en 'Cerrar período' (o en 'Cerrar' en la fila de un mes abierto)","Confirmar el mes a cerrar (AAAA-MM)","Confirmar: si las compuertas pasan, el mes queda Cerrado y no admite más asientos"],"note":"Si hay incidencias bloqueantes (borradores pendientes, descuadres, eventos sin contabilizar), el cierre se bloquea y muestra el resumen de las compuertas."},{"title":"Reabrir un período","steps":["En la fila de un mes cerrado, hacer clic en 'Reabrir'","Escribir el motivo (mínimo 5 caracteres) — queda en auditoría","Confirmar"],"note":"No se puede reabrir un mes si un mes posterior sigue cerrado (salvo forzar con permiso de override). Quien cerró el mes no puede reabrirlo solo: debe autorizarlo otro usuario."}],"business_rules":["Cerrar evalúa compuertas: borradores pendientes, outbox fallido, descuadres de conciliación, borradores en excepción y eventos operativos sin contabilizar; si hay bloqueantes, no cierra (salvo force con permiso)","SoD al cerrar: quien posteó asientos o ejecutó revaluación en el mes no puede cerrarlo (salvo allow_same_poster con override)","Cerrar un mes ya cerrado es idempotente","Reabrir es idempotente si ya está abierto, exige motivo y SoD maker-checker (quien cerró no reabre sin otro actor u override)","Integridad cronológica: no se reabre un mes si hay un mes posterior cerrado, salvo force (que requiere permiso de override)","Cierre y reapertura generan un manifiesto hasheado y quedan auditados","Un período cerrado bloquea el posteo de asientos con fecha en ese mes"],"permissions":["accounting.period.read","accounting.period.close","accounting.period.reopen","accounting.sod.override"],"routes":[{"path":"/contabilidad/periodos","name":"Períodos fiscales","purpose":"Listar, cerrar y reabrir meses fiscales"}],"faqs":[{"q":"¿Por qué no me deja cerrar el mes?","a":"Porque alguna compuerta lo bloquea (borradores sin postear, descuadres, eventos sin contabilizar). El sistema muestra el resumen de qué falta."},{"q":"¿Puedo reabrir marzo si abril ya está cerrado?","a":"No directamente: primero reabrí abril. El sistema exige reabrir de lo más nuevo a lo más viejo, salvo que fuerces con permiso de override."},{"q":"¿Quién puede reabrir un mes que yo cerré?","a":"Otro usuario, por separación de funciones. Vos solo podés con el permiso de override SoD."}]},{"id":"reportes","name":"Reportes contables","icon":"📊","one_liner":"Balanza de comprobación, mayor por cuenta, estado de resultados y balance general por período.","what_it_does":"Permite consultar los reportes contables clásicos eligiendo el reporte y el período (AAAA-MM). Cubre la balanza de comprobación, el mayor por cuenta (requiere código de cuenta), el estado de resultados (P&G) y el balance general. Las columnas se arman según el reporte y los montos se muestran formateados.","key_features":["Balanza de comprobación por período","Mayor por cuenta (libro mayor) filtrando por código de cuenta","Estado de resultados (P&G)","Balance general (activos, pasivos, patrimonio) a una fecha"],"flows":[{"title":"Consultar un reporte","steps":["En Reportes, elegir el reporte en el selector","Indicar el período (AAAA-MM)","Si es el Mayor, escribir además el código de cuenta","Hacer clic en 'Consultar'"],"note":"El mayor por cuenta no devuelve datos sin un código de cuenta."}],"business_rules":["Todos los reportes requieren el permiso accounting.report.read","Los reportes se calculan sobre asientos posteados del período indicado","El balance general separa Activos, Pasivos y Patrimonio y muestra los totales"],"permissions":["accounting.report.read"],"routes":[{"path":"/contabilidad/reportes","name":"Reportes contables","purpose":"Balanza, mayor, estado de resultados y balance general"}],"faqs":[{"q":"¿Por qué el mayor no me muestra nada?","a":"Porque falta el código de cuenta: el mayor por cuenta lo exige."},{"q":"¿El reporte incluye borradores?","a":"No. Los reportes se arman con los asientos ya posteados del período."}]},{"id":"monedas","name":"Tipo de cambio (monedas)","icon":"💱","one_liner":"Tasas de cambio por fecha y la corrida de revaluación de cuentas en moneda extranjera.","what_it_does":"Permite registrar tasas de cambio por fecha entre dos monedas y tipo (Cierre, Spot, Promedio), y correr la revaluación de un período: el sistema reexpresa las cuentas revaluables a la tasa de cierre y genera los asientos de diferencia cambiaria (ganancia o pérdida) como borradores en el diario.","key_features":["Listado de tasas por fecha, monedas y tipo","Registrar tasa (fecha, de, a, tasa, tipo)","Correr revaluación de un período (AAAA-MM): genera borradores de diferencia cambiaria"],"flows":[{"title":"Registrar una tasa de cambio","steps":["En Tipo de cambio, hacer clic en 'Registrar tasa'","Indicar fecha, moneda de origen, moneda destino, la tasa y el tipo (Cierre/Spot/Promedio)","Hacer clic en 'Guardar'"],"note":"Si ya existe una tasa para esa fecha, monedas y tipo, se actualiza (no se duplica)."},{"title":"Correr la revaluación de un mes","steps":["Hacer clic en 'Correr revaluación'","Indicar el período a revaluar (AAAA-MM)","Confirmar: la corrida deja los asientos de diferencia cambiaria como borradores en el diario"],"note":"Si la corrida queda BLOQUEADA (por ejemplo, faltan tasas o cuentas FX), el sistema lo informa."}],"business_rules":["Registrar tasas requiere accounting.fx_rate.update; ver tasas requiere accounting.fx_rate.read","La tasa se guarda por combinación única de fecha + de + a + tipo (upsert)","Correr la revaluación requiere accounting.revaluation.run","La revaluación necesita la cuenta funcional, las cuentas de ganancia/pérdida cambiaria y cuentas marcadas como revaluables","Una revaluación ya ejecutada para el mismo mes es idempotente; si está bloqueada devuelve estado BLOCKED","SoD: quien corrió la revaluación de un mes no puede cerrar ese mes sin override"],"permissions":["accounting.fx_rate.read","accounting.fx_rate.update","accounting.revaluation.run"],"routes":[{"path":"/contabilidad/monedas","name":"Tipo de cambio","purpose":"Tasas de cambio por fecha y corrida de revaluación FX"}],"faqs":[{"q":"¿Qué pasa si registro una tasa repetida?","a":"No se duplica: el sistema actualiza la tasa existente para esa fecha, monedas y tipo."},{"q":"¿La revaluación postea sola los asientos?","a":"No: deja los asientos de diferencia cambiaria como borradores en el diario, para que pasen por el flujo de aprobar y postear."}]},{"id":"intercompania","name":"Intercompañía","icon":"🔗","one_liner":"Cruces entre tus empresas del grupo con su ciclo creada → confirmada → conciliada → liquidada → cerrada (y disputa).","what_it_does":"Gestiona las transacciones intercompañía: operaciones entre dos empresas del grupo (cada una con su RUC). El usuario crea un cruce indicando empresa destino, monto y cuentas, y luego lo hace avanzar por su ciclo de vida: confirmar, conciliar, liquidar y cerrar; también puede disputarlo. Estos cruces son la base para que la consolidación del holding los elimine (el grupo no se infla). Existe además un primitivo de backend (record_intercompany_charge) que registra la operación completa (asiento GL en cada empresa, CxC en la que cobra, CxP en la que paga y el enlace confirmado) en una sola transacción.","key_features":["Listado de cruces con descripción, monto y estado","Crear cruce (empresa destino, monto, cuenta origen, cuenta destino, descripción)","Acciones por estado: Confirmar, Conciliar, Liquidar, Cerrar","Disputar un cruce con motivo (en estados Confirmado o Conciliado)","Posición de cartera del grupo separando lo intercompañía (party INTERNAL) de lo externo","Registro automático de la operación completa con referencia común e idempotencia"],"flows":[{"title":"Crear un cruce intercompañía","steps":["En Intercompañía, hacer clic en 'Nuevo cruce'","Elegir la empresa destino (otra empresa del grupo)","Indicar el monto en C$ y los códigos de cuenta origen y destino","Opcional: descripción. Hacer clic en 'Crear cruce' (queda en estado CREADA)"]},{"title":"Hacer avanzar un cruce por su ciclo","steps":["En la fila del cruce, usar el botón según su estado: 'Confirmar' (de Creada), 'Conciliar' (de Confirmada), 'Liquidar' (de Conciliada) o 'Cerrar' (de Liquidada)","El sistema mueve el cruce al siguiente estado y registra la conciliación"],"note":"Cada acción exige su propio permiso (confirmar/conciliar/liquidar tienen permisos distintos)."},{"title":"Disputar un cruce","steps":["En un cruce Confirmado o Conciliado, hacer clic en 'Disputar'","Escribir el motivo de la disputa (mínimo 5 caracteres)","Confirmar: el cruce queda en disputa"]}],"business_rules":["Requiere autorización explícita entre empresas (CompanyLink + grant accounting.intercompany.write): independientes pero interrelacionadas; sin autorización la operación da INTERCOMPANY_NOT_AUTHORIZED","SoD: el creador del cruce no puede confirmarlo sin override (allow_same_actor)","Al confirmar, la transacción queda 100% conciliada (diferencia 0)","Al conciliar: si la diferencia es ≤ 1 centavo pasa a CONFIRMADA; si hay diferencia mayor pasa a DIFERENCIA; con marca de disputa pasa a DISPUTADA","Origen y destino deben ser empresas distintas y el monto > 0","El registro automático es idempotente por reference_code (no duplica el cruce)","El asiento de eliminación intercompañía lo genera el sistema directo en POSTED (no pasa por maker-checker, porque el control SoD vive en la operación que origina el cruce)","Las disputas pueden tener un SLA y exigir evidencia según el motivo configurado"],"permissions":["accounting.intercompany.read","accounting.intercompany.write","accounting.intercompany.reconcile","accounting.intercompany.settle","accounting.intercompany.dispute","audit.read"],"routes":[{"path":"/contabilidad/intercompania","name":"Intercompañía","purpose":"Crear y operar cruces entre empresas del grupo y su conciliación"}],"faqs":[{"q":"¿Por qué no puedo confirmar el cruce que yo creé?","a":"Por separación de funciones: el creador no confirma. Debe confirmarlo otra persona, salvo override."},{"q":"¿Qué pasa con los cruces al consolidar el grupo?","a":"Se eliminan: la consolidación quita los movimientos intercompañía para que el grupo no quede inflado."},{"q":"¿Una empresa puede cargar cruces contra otra sin permiso?","a":"No. Hace falta una autorización explícita entre las empresas; sin ella el cruce no se registra."}]},{"id":"centros-costo","name":"Centros de costo","icon":"🎯","one_liner":"Dimensión analítica por empresa para imputar gastos e ingresos en asientos y comparar contra el presupuesto.","what_it_does":"Mantiene el catálogo de centros de costo de la empresa (código y nombre). Los centros se eligen en las líneas de los asientos manuales y de cierre, y sirven para comparar lo real contra el presupuesto por centro. Se pueden crear, renombrar y activar/desactivar.","key_features":["Listado de centros de costo con código, nombre y estado Activo/Inactivo","Crear centro (código único + nombre)","Editar nombre y activar/desactivar (el código no se cambia)"],"flows":[{"title":"Crear un centro de costo","steps":["En Centros de costo, hacer clic en 'Nuevo centro'","Escribir código y nombre","Hacer clic en 'Guardar'"],"note":"El código no puede repetirse dentro de la empresa."},{"title":"Activar o desactivar un centro","steps":["En la fila del centro, hacer clic en 'Desactivar' (o 'Activar')","El estado cambia de inmediato"]}],"business_rules":["El código del centro es único por empresa; crear uno repetido da error de duplicado","Gestionar centros requiere accounting.cost_center.manage; verlos requiere accounting.cost_center.read","Solo los centros activos se pueden imputar en líneas de asientos manuales","Crear y editar quedan auditados"],"permissions":["accounting.cost_center.read","accounting.cost_center.manage"],"routes":[{"path":"/contabilidad/centros-costo","name":"Centros de costo","purpose":"Catálogo de centros de costo de la empresa"}],"faqs":[{"q":"¿Puedo cambiar el código de un centro?","a":"No. El código queda fijo al crearlo; solo se puede cambiar el nombre o activar/desactivar."},{"q":"¿Para qué sirven los centros de costo?","a":"Para imputar gastos e ingresos por área en los asientos y comparar lo real contra el presupuesto por centro."}]},{"id":"presupuestos","name":"Presupuestos","icon":"🐖","one_liner":"Presupuesto mensual por cuenta y centro de costo, y comparación contra lo realmente registrado.","what_it_does":"Permite armar presupuestos anuales con líneas por cuenta y centro de costo y montos mensuales. Un presupuesto nace como borrador (editable), se le cargan las líneas, se aprueba y luego se compara contra lo real (presupuesto vs real) por rango de meses y opcionalmente por centro, mostrando variación absoluta y porcentual. La comparación se puede imprimir.","key_features":["Lista de presupuestos por año y moneda con estado (Borrador, Aprobado, Archivado)","Editar líneas en borrador: cuenta, centro de costo y los 12 montos mensuales, con total anual","Aprobar el presupuesto (queda fijo)","Comparar Presupuesto vs Real por rango de meses y centro, con variación y % de variación","Imprimir la comparación"],"flows":[{"title":"Crear y cargar un presupuesto","steps":["En Presupuestos, hacer clic en 'Nuevo presupuesto' e indicar año y nombre","Seleccionar el presupuesto en la lista (queda en borrador)","Agregar líneas: cuenta, centro de costo y montos por mes","Hacer clic en 'Guardar líneas'","Cuando esté listo, hacer clic en 'Aprobar'"],"note":"Las líneas solo se editan mientras el presupuesto está en borrador."},{"title":"Comparar presupuesto contra lo real","steps":["Con un presupuesto seleccionado, abrir la pestaña 'Presupuesto vs real'","Indicar mes desde / mes hasta y opcionalmente el centro de costo","Hacer clic en 'Comparar'","Revisar los totales (presupuesto, real, variación) y el detalle; opcional 'Imprimir'"]}],"business_rules":["Crear/editar/aprobar/archivar requiere accounting.budget.manage; ver y comparar requiere accounting.budget.read","Solo se editan líneas cuando el presupuesto está en estado DRAFT (borrador)","El 'real' de la comparación se toma de los asientos posteados por cuenta y centro en el rango","El año fiscal del presupuesto va entre 2000 y 2999"],"permissions":["accounting.budget.read","accounting.budget.manage"],"routes":[{"path":"/contabilidad/presupuestos","name":"Presupuestos","purpose":"Armar presupuesto anual por cuenta/centro y comparar vs real"}],"faqs":[{"q":"¿Por qué no puedo editar las líneas del presupuesto?","a":"Porque ya está aprobado o archivado. Solo se editan en estado borrador."},{"q":"¿De dónde sale lo 'real' en la comparación?","a":"De los asientos posteados por cuenta y centro en el rango de meses que elegís."}]},{"id":"cierre-anual","name":"Cierre anual","icon":"🗓️","one_liner":"Cierra el ejercicio llevando ingresos y gastos a resultados acumulados y sellando diciembre; reabrir reversa el asiento de cierre.","what_it_does":"Cierra el ejercicio fiscal de la empresa: lleva las cuentas de resultado (ingresos y gastos) a cero contra la cuenta de resultados acumulados mediante un asiento de cierre con fecha 31 de diciembre, y luego sella diciembre. Muestra el estado del año, el resultado del ejercicio (ingresos − gastos), el mapa de meses cerrados/abiertos y el asiento de cierre. Reabrir el ejercicio reabre diciembre y reversa el asiento de cierre (los resultados vuelven a sus cuentas).","key_features":["Estado del ejercicio (Abierto / Cerrado / Reabierto) y resultado del ejercicio","Mapa de los 12 meses con candado abierto/cerrado y lista de meses pendientes de cerrar","Cerrar ejercicio: genera el asiento de cierre y sella diciembre","Reabrir ejercicio con motivo: reabre diciembre y reversa el asiento de cierre","Muestra el número del asiento de cierre generado"],"flows":[{"title":"Cerrar el ejercicio","steps":["En Cierre anual, indicar el año y hacer clic en 'Ver estado'","Verificar que enero a noviembre estén cerrados y diciembre abierto","Hacer clic en 'Cerrar ejercicio' y confirmar","El sistema genera el asiento de cierre (resultado a resultados acumulados) y sella diciembre"],"note":"El botón Cerrar solo se habilita si no hay meses pendientes de cerrar (ene-nov) y diciembre está abierto."},{"title":"Reabrir el ejercicio","steps":["Con el ejercicio cerrado, hacer clic en 'Reabrir ejercicio'","Escribir el motivo (mínimo 5 caracteres)","Confirmar: se reabre diciembre y se reversa el asiento de cierre"]}],"business_rules":["Requiere el permiso accounting.year_end.close y que la contabilidad GL (Fase 7) esté habilitada","Debe estar configurada la cuenta de resultados acumulados, si no, no se puede cerrar","De enero a noviembre deben estar cerrados y diciembre abierto (salvo forzar)","Cierre idempotente: cerrar un ejercicio ya cerrado devuelve su estado sin reprocesar","El asiento de cierre lleva fecha 31-dic y debe quedar balanceado; lo postea el sistema (allow_same_poster)","Reabrir exige motivo, reabre diciembre y reversa el asiento de cierre en diciembre del ejercicio (no en el mes actual)","Cierre y reapertura quedan auditados con manifiesto hasheado"],"permissions":["accounting.year_end.close"],"routes":[{"path":"/contabilidad/cierre-anual","name":"Cierre anual","purpose":"Cerrar y reabrir el ejercicio fiscal del año"}],"faqs":[{"q":"¿Por qué no me deja cerrar el año?","a":"Porque faltan meses por cerrar (enero a noviembre) o diciembre ya está cerrado. El sistema lista los meses pendientes."},{"q":"¿Qué hace exactamente el cierre?","a":"Lleva ingresos y gastos a cero contra resultados acumulados con un asiento al 31-dic y sella diciembre."},{"q":"¿Reabrir borra el cierre?","a":"No lo borra: reversa el asiento de cierre (los resultados vuelven a sus cuentas) y reabre diciembre, todo auditado."}]},{"id":"consolidacion","name":"Consolidación del grupo","icon":"🏢","one_liner":"Estados financieros consolidados del holding por período, eliminando los cruces intercompañía.","what_it_does":"Genera los estados financieros consolidados de varias empresas del grupo (holding) para un período: corre la consolidación eligiendo año, mes y empresas, y el sistema elimina los cruces intercompañía y arma la balanza, el estado de resultados y el balance general consolidados. Si hay incidencias (por ejemplo cruces intercompañía descuadrados) y está activo el modo Estricto, la corrida queda bloqueada.","key_features":["Correr consolidación por año, mes y conjunto de empresas, con modo Estricto on/off","Estado de la corrida (Consolidada / Bloqueada) con conteo de incidencias","Reportes consolidados: Balanza, Estado de resultados (con KPIs de ingresos, gastos y neto) y Balance general","Es idempotente: si la corrida ya existía, lo indica"],"flows":[{"title":"Correr la consolidación","steps":["En Consolidación del grupo, indicar año y mes","Elegir las empresas a consolidar","Dejar o quitar el modo 'Estricto' y hacer clic en 'Correr consolidación'","Si no queda bloqueada, revisar las pestañas Balanza, Estado de resultados y Balance general"],"note":"Si hay incidencias y el modo Estricto está activo, la corrida se bloquea (HTTP 409) y muestra el detalle; con Estricto apagado consolida igual."}],"business_rules":["Correr requiere accounting.consolidation.run; ver los reportes consolidados requiere accounting.consolidation.read","La consolidación elimina los movimientos intercompañía entre las empresas del grupo","En modo Estricto, las incidencias (p. ej. cruces descuadrados) bloquean la corrida; sin Estricto consolida con incidencias","La corrida es idempotente y produce un hash de manifiesto reproducible","Los reportes consolidados solo están disponibles si la corrida no quedó bloqueada"],"permissions":["accounting.consolidation.read","accounting.consolidation.run"],"routes":[{"path":"/contabilidad/consolidacion","name":"Consolidación del grupo","purpose":"Estados financieros consolidados del holding por período"}],"faqs":[{"q":"¿Por qué la consolidación quedó bloqueada?","a":"Por incidencias en modo Estricto (por ejemplo cruces intercompañía descuadrados). Revisá y reintentá, o apagá Estricto para consolidar igual."},{"q":"¿Se suman los saldos entre empresas tal cual?","a":"No: la consolidación elimina los cruces intercompañía para que el grupo no quede inflado."}]},{"id":"cec","name":"CEC — Cierre Contable End-to-end","icon":"⚙️","one_liner":"Motor de cierre por corridas con avance por etapas y compuertas que detectan excepciones y bloquean la entrega.","what_it_does":"El CEC (Controlador/motor de Cierre Contable) orquesta el cierre end-to-end mediante corridas. Una corrida avanza por etapas (Creada → Reunida → Validada → Empaquetada → Entregada) y al ejecutarse corre una batería de compuertas (gates) sobre una ventana de tiempo: integridad de numeración de facturas y compras, disciplina de caja, conciliación facturación vs caja, stock negativo, integridad de costo de compras, conciliación de pago a proveedores y validaciones fiscales modo B. Cada incidencia abre una excepción con severidad; las bloqueantes impiden avanzar/empaquetar. La corrida empaquetada dispara la proyección del shadow ledger (los borradores contables). El usuario crea corridas, las hace avanzar, ve el resumen/explicación y resuelve excepciones.","key_features":["Corridas de cierre Diarias o Periódicas con su estado y fecha","Avanzar la corrida al siguiente estado del ciclo","Ver Resumen y Explicación (paquete contador, solo lectura) de cada corrida","Pestaña de Excepciones con módulo, código, severidad y estado","Resolver una excepción con nota de qué se corrigió","Score de consistencia y conteo de excepciones bloqueantes por corrida"],"flows":[{"title":"Crear una corrida de cierre","steps":["En CEC, hacer clic en 'Nueva corrida'","Elegir el tipo: Diaria o Periódica (mes)","Hacer clic en 'Crear': la corrida nace en estado CREADA"]},{"title":"Hacer avanzar la corrida y revisarla","steps":["En la fila de la corrida, hacer clic en 'Avanzar a …' (siguiente estado del ciclo)","Usar 'Resumen' para ver gates y métricas, o 'Explicar' para el paquete contador","Si hay excepciones abiertas, el avance puede fallar hasta resolverlas"],"note":"El detalle de Resumen/Explicación se muestra como JSON en un diálogo."},{"title":"Resolver una excepción del cierre","steps":["Abrir la pestaña 'Excepciones'","En una excepción abierta, hacer clic en 'Resolver'","Escribir la nota de resolución (qué se corrigió, mínimo 5 caracteres) y confirmar"]}],"business_rules":["Crear corrida requiere cec.close_run.create; avanzar/ejecutar requiere cec.close_run.update; ver requiere cec.close_run.read","Transiciones de estado controladas: CREATED→GATHERED→VALIDATED→PACKAGED→DELIVERED, con REOPENED_EXCEPTION como salida; transiciones inválidas dan conflicto","Una corrida solo se ejecuta desde CREATED o REOPENED_EXCEPTION; window_start debe ser anterior a window_end","Compuertas bloqueantes siempre: stock negativo, diferencia de caja distinta de cero, fallas de impresión/contingencia fiscal modo B, integridad de costo de compras","Compuertas bloqueantes solo en modo Estricto: gaps de numeración de factura/compra, descuadre facturación-caja, descuadre pago a proveedor, reservas fiscales B obsoletas","Tolerancia de conciliación: 1 centavo (diferencias dentro de la tolerancia no abren excepción)","Si hay excepciones bloqueantes, la corrida pasa a REOPENED_EXCEPTION en vez de PACKAGED","Las excepciones se deduplican por huella (fingerprint) y reactualizan severidad/detalle si ya existían","La corrida PACKAGED publica CloseRunPackaged, que dispara la proyección del shadow ledger (borradores contables)","Resolver una excepción requiere cec.exception.resolve; crear requiere cec.exception.create","Score de consistencia: parte de 100 y baja según severidad (CRITICAL −40, HIGH −20, MEDIUM −10)","Cada avance, excepción y resolución queda auditado"],"permissions":["cec.close_run.read","cec.close_run.create","cec.close_run.update","cec.exception.read","cec.exception.create","cec.exception.resolve","cec.evidence.create"],"routes":[{"path":"/cec","name":"Cierre contable (CEC)","purpose":"Corridas de cierre, su avance por etapas y las excepciones"}],"faqs":[{"q":"¿Por qué no puedo avanzar la corrida?","a":"Probablemente hay excepciones bloqueantes abiertas (stock negativo, descuadre de caja, etc.). Resolvelas y reintentá."},{"q":"¿Qué diferencia hay entre el modo Estricto y no?","a":"Algunas incidencias (gaps de numeración, descuadres) solo bloquean en modo Estricto; otras (stock negativo, caja descuadrada) bloquean siempre."},{"q":"¿Qué pasa cuando una corrida queda Empaquetada?","a":"Dispara la proyección contable: se generan los borradores de asientos del período para que pasen por el flujo de aprobar y postear."},{"q":"¿La opción Explicar cambia algo?","a":"No: es solo lectura, arma un paquete explicativo del cierre para el contador sin escribir nada."}]}],"uncertainties":["El módulo backend modulos.intercompany (endpoints /charges/ y /group-cartera/) y modulos.accounting (solo __init__.py, sin código) no tienen ruta de frontend propia en routes.ts: la pantalla de Intercompañía consume los endpoints del kernel accounting (/intercompany/transactions/...). record_intercompany_charge parece pensado para ser llamado por verticales (comisariato, transporte, ganado), no directamente desde la UI documentada.","La pantalla de Conciliación bancaria 100% mencionada en el enfoque del área no se encontró como pantalla propia dentro de portfolio/accounting/cec; la conciliación que existe en código es la conciliación facturación-vs-caja del CEC (gate billing_vs_cash_reconciliation con tolerancia 1 centavo) y la conciliación de pago a proveedores. El reporte de conciliación operativa vs contable existe como endpoint (operational-reconciliation) pero no como tarjeta en el panel de Contabilidad.","El CEC se ejecuta vía endpoint execute (con window_start/window_end y strict); en la UI de CEC solo se ven crear corrida y avanzar manualmente por estados. No se confirmó desde la UI cómo se dispara execute_close_run con su ventana (puede correrse por comando o por otra pantalla no incluida en este área).","Los nombres de estados de IntercompanyTransaction (CREATED/CONFIRMED/RECONCILED/SETTLED/CLOSED/DISPUTED/DIFFERENCE) se infieren del frontend y de phase7b; no se leyó la definición completa del enum de estado en models del kernel accounting.","El módulo Créditos no expone en la UI documentada la creación de un crédito (create_credit existe en el servicio y por API REST del CreditViewSet con permiso portfolio.credit.write), pero la pantalla CreditosPage solo muestra listar y desembolsar."]},{"area_id":"cafe","area_title":"Café: Financiamiento/Acopio, Beneficio y Finca","area_summary":"Vertical de café que moderniza el viejo sistema SIFA: ficha de productores, recepción de café en custodia, préstamos en doble moneda (C$/US$), fijación de precio, liquidaciones que abonan al préstamo, análisis de riesgo de cartera, beneficiado (pergamino→oro con merma) y manejo de finca (lotes, órdenes de trabajo, costos y presupuesto agrícola). Cubre el ciclo completo: financiar al productor, acopiar su café, liquidarlo y procesarlo.","icon":"☕","modules":[{"id":"financiamiento-inicio","name":"Acopio y Financiamiento (inicio)","icon":"🏠","one_liner":"Tablero de entrada al vertical de café con accesos a productores, recibos, préstamos y liquidaciones.","what_it_does":"Es la pantalla principal del área de café para el personal de acopio y financiamiento. Muestra cuatro tarjetas grandes que llevan a las pantallas clave: Productores, Recibos de café, Préstamos y Fijación/liquidación. Sirve como punto de partida para el cajero, el responsable de acopio y el analista de crédito.","key_features":["Tarjetas de acceso rápido a Productores, Recibos de café, Préstamos y Fijación/liquidación","Resumen del propósito de cada sección"],"flows":[{"title":"Entrar a una sección","steps":["Abrir el menú y elegir Acopio y Financiamiento","Hacer clic en la tarjeta del trabajo que vas a hacer (por ejemplo, Recibos de café)","El sistema te lleva a la pantalla correspondiente"]}],"business_rules":["Para entrar al vertical se necesita el permiso de lectura de productores (financing.producer.read)","Las pantallas de Riesgo y Configuración no aparecen como tarjeta en el inicio; se llega por su ruta o desde el menú"],"permissions":["financing.producer.read"],"routes":[{"path":"/financiamiento","name":"Acopio y Financiamiento","purpose":"Página de inicio del vertical de café con accesos directos"}],"faqs":[{"q":"¿Por dónde empiezo si soy nuevo en acopio?","a":"Entrá a Acopio y Financiamiento y elegí la tarjeta que corresponde a tu tarea: registrar productores, pesar recibos, gestionar préstamos o liquidar."}]},{"id":"financiamiento-productores","name":"Productores","icon":"🪪","one_liner":"Ficha de cada productor de café (carnet de acopio) con sus certificaciones y su depósito de café.","what_it_does":"Permite registrar y consultar a los productores que entregan café y reciben financiamiento (lo que el SIFA llamaba cooperativas). Cada productor se basa en un tercero ya existente (con su cédula) y se le agrega un código de acopio y sus certificaciones (orgánico, Fair Trade, UTZ, etc.). Desde aquí también se ve el depósito de café del productor: cuánto ha recibido, cuánto tiene con precio fijado, cuánto se le ha liquidado y cuánto queda disponible y en custodia.","key_features":["Alta de productor a partir de un tercero, con código de acopio y certificaciones","Búsqueda por nombre, código de acopio o cédula","Consulta del depósito de café: recibido, fijado, liquidado, disponible para fijar y en custodia","Listado de hasta 500 productores ordenados por código de acopio"],"flows":[{"title":"Registrar un productor nuevo","steps":["En Productores, hacer clic en «Nuevo productor»","Elegir el tercero (productor) en el selector","Escribir el código de acopio y las certificaciones (opcional)","Agregar notas si hace falta y hacer clic en «Crear»"],"note":"El tercero debe pertenecer a la misma empresa; si ya existe ficha para ese tercero, el sistema reutiliza la existente."},{"title":"Ver el depósito de café de un productor","steps":["Buscar al productor en la lista","Hacer clic en «Depósito»","Revisar las cantidades en libras: recibido, fijado, liquidado, disponible para fijar y en custodia"]}],"business_rules":["El código de acopio es único por empresa (no se puede repetir entre productores de la misma empresa)","No puede haber dos fichas del mismo tercero en la misma empresa","El tercero debe ser de la misma empresa; si es de otra, se rechaza (FIN_PARTY_SCOPE)","Al crear la ficha, al tercero se le asigna automáticamente el rol de Productor","Disponible para fijar = recibido − fijado; En custodia = recibido − liquidado"],"permissions":["financing.producer.read","financing.producer.write","financing.reception.read"],"routes":[{"path":"/financiamiento/productores","name":"Productores","purpose":"Alta, consulta y depósito de café de cada productor"}],"faqs":[{"q":"¿Cómo registro a un productor?","a":"En Productores, clic en «Nuevo productor», elegí el tercero, ponele código de acopio y certificaciones y guardá."},{"q":"¿Cómo sé cuánto café tiene disponible un productor para fijar precio?","a":"Abrí su ficha, clic en «Depósito» y mirá el renglón «Disponible para fijar»."},{"q":"¿Por qué no me deja repetir un código de acopio?","a":"El código de acopio es único por empresa; usá uno distinto."}]},{"id":"financiamiento-acopio","name":"Recibos de café (Acopio)","icon":"⚖️","one_liner":"Recepción de café del productor en custodia: se pesan los sacos y el neto entra a la bodega de custodia.","what_it_does":"Es la pantalla de báscula del acopio, pensada para tablet. El operador registra cada entrega de café del productor: productor, calidad, estado físico (mojado, húmedo, oreado o pergamino seco), número de sacos, peso bruto y tara. El sistema calcula el peso neto (bruto − tara) y lo muestra también en quintales. El café entra a la bodega de custodia con costo cero porque todavía es del productor: no se le compra hasta que se fija precio y se liquida.","key_features":["Captura de recibo grande, apta para báscula/tablet","Cálculo automático del neto (bruto − tara) y vista previa en quintales","Tara automática por calidad si se deja el campo vacío","Registro del café en bodega de custodia (costo 0, sigue siendo del productor)","Listado de recibos con fecha, productor, calidad, estado, sacos y pesos"],"flows":[{"title":"Registrar un recibo de café","steps":["En Recibos de café, elegir el productor y la calidad","Elegir el estado físico (por defecto Húmedo)","Escribir los sacos y el peso bruto (libras)","Dejar la tara vacía para usar la tara por calidad, o escribir la tara real","Revisar el «Neto estimado» y hacer clic en «Registrar recibo»"],"note":"Requiere haber definido la Configuración de acopio (artículo de café y bodega de custodia) y tener sucursal activa."}],"business_rules":["Los sacos y el peso bruto deben ser positivos (FIN_RECEPTION_INVALID)","La tara debe ser ≥ 0 y menor que el peso bruto","Si no se digita tara, se calcula como bruto × % de tara por calidad","Antes de acopiar debe estar configurado el artículo de café y la bodega de custodia (FIN_SETTINGS_INCOMPLETE)","El café entra a custodia con costo 0; no es compra todavía","El número de recibo (referencia), si se usa, es único por empresa","Cada recepción genera un movimiento de inventario trazable (idempotente)"],"permissions":["financing.reception.read","financing.reception.create"],"routes":[{"path":"/financiamiento/acopio","name":"Recibos de café","purpose":"Pesaje y recepción de café en custodia del productor"}],"faqs":[{"q":"¿Cómo registro la entrega de café de un productor?","a":"En Recibos de café elegí productor y calidad, poné sacos y peso bruto; el neto se calcula solo. Clic en «Registrar recibo»."},{"q":"¿Qué pongo en la tara?","a":"Si la dejás vacía, el sistema usa la tara sugerida de la calidad. Si tenés la tara real medida, escribila."},{"q":"¿El café acopiado ya es de la empresa?","a":"No. Entra en custodia y sigue siendo del productor hasta que se fija precio y se liquida."},{"q":"¿Por qué me dice que falta configuración?","a":"Hay que definir primero el artículo de café y la bodega de custodia en Configuración de acopio."}]},{"id":"financiamiento-prestamos","name":"Préstamos a productores","icon":"💵","one_liner":"Solicitud → aprobación → desembolso de préstamos en C$ y/o US$, con estado de cuenta y registro de pagos.","what_it_does":"Gestiona el financiamiento al productor con el ciclo completo del SIFA y separación de funciones. Una solicitud captura montos en córdobas y/o dólares, plazo, interés, forma de desembolso y garantías (incluida la garantía de café en quintales). La solicitud pasa por borrador, presentada, aprobada o rechazada y, finalmente, desembolsada, momento en que se crea el préstamo con doble saldo (uno por moneda). Después se consulta el estado de cuenta por moneda (principal, interés, comisión, mora, saldo) y consolidado en córdobas con la tasa vigente, y se registran los pagos.","key_features":["Solicitud con montos en C$ y/o US$, plazo, interés y garantías (café en qq, finca, solar, otras)","Flujo con estados: borrador → presentada → aprobada/rechazada → desembolsada","Préstamo de doble saldo: un crédito por cada moneda con monto mayor a cero","Estado de cuenta por moneda y consolidado en córdobas con la tasa vigente","Registro de pagos con conversión de moneda usando la tasa de cambio","Comisión y mora del préstamo registradas sobre el monto desembolsado"],"flows":[{"title":"Crear y presentar una solicitud","steps":["En Préstamos, pestaña Solicitudes, clic en «Nueva solicitud»","Elegir productor, montos C$ y/o US$, plazo (meses) e interés","Indicar forma de desembolso, actividad/destino y garantía de café (qq)","Guardar con «Crear»; la solicitud queda en Borrador","En la fila de la solicitud, clic en «Presentar» para mandarla a aprobación"]},{"title":"Aprobar y desembolsar (con separación de funciones)","steps":["Una persona distinta a quien la creó hace clic en «Aprobar» (o «Rechazar» con motivo)","Una persona distinta a quien aprobó hace clic en «Desembolsar»","Indicar fecha y referencia (cheque/transferencia) y confirmar","El sistema crea el préstamo con saldo en cada moneda solicitada"],"note":"El desembolso requiere sucursal activa."},{"title":"Ver estado de cuenta y registrar un pago","steps":["En la pestaña Préstamos, clic en «Estado» para ver saldos por moneda y consolidado","En un préstamo activo, clic en «Pago»","Escribir monto, moneda pagada y, si cruza moneda, la moneda destino y la tasa","Confirmar con «Registrar»"]}],"business_rules":["Debe solicitarse monto en córdobas, dólares o ambos; montos no negativos (FIN_AMOUNT_INVALID)","Separación de funciones: quien registró la solicitud no puede aprobarla (FIN_SOD_VIOLATION)","Separación de funciones: quien aprobó la solicitud no puede desembolsarla (FIN_SOD_VIOLATION)","Solo un borrador se presenta; solo una presentada se aprueba/rechaza; solo una aprobada se desembolsa (FIN_APP_STATE)","El préstamo es de doble moneda: se crea un crédito por cada moneda con monto > 0","Un pago no puede exceder el saldo de la moneda destino (FIN_PAYMENT_EXCEEDS_OUTSTANDING)","Si el pago cruza de moneda, se requiere tasa (parámetro o vigente del día); si no hay, se rechaza (FIN_RATE_REQUIRED)","El préstamo se marca Cancelado (pagado) cuando todos sus saldos quedan en cero","La referencia del préstamo es única por empresa; si no se indica, el sistema la genera (PTMO-...)"],"permissions":["financing.loan.read","financing.application.read","financing.application.create","financing.application.approve","financing.application.disburse","financing.payment.register","financing.rate.manage"],"routes":[{"path":"/financiamiento/prestamos","name":"Préstamos a productores","purpose":"Solicitudes, aprobación, desembolso, estado de cuenta y pagos"}],"faqs":[{"q":"¿Puedo aprobar la solicitud que yo mismo registré?","a":"No. Por separación de funciones, debe aprobarla otra persona; lo mismo aplica entre quien aprueba y quien desembolsa."},{"q":"¿Cómo le doy a un productor un préstamo en córdobas y en dólares a la vez?","a":"En la solicitud poné monto en ambas monedas; al desembolsar se crean dos saldos, uno por cada moneda."},{"q":"¿Cómo registro un pago en córdobas a un saldo en dólares?","a":"En «Pago» poné el monto, moneda pagada Córdoba, moneda destino Dólar y la tasa de cambio; el sistema convierte."},{"q":"¿Por qué no me deja registrar un pago mayor al saldo?","a":"El abono no puede exceder el saldo pendiente de esa moneda."}]},{"id":"financiamiento-liquidaciones","name":"Fijación y Liquidación","icon":"🧾","one_liner":"Fijar el precio del café del productor y liquidarlo: valor − deducciones, abono al préstamo y excedente a favor.","what_it_does":"Cierra el ciclo del acopio. Primero se fija el precio por libra de una parte del depósito disponible del productor (las libras fijadas quedan comprometidas). Luego se liquida una o varias fijaciones abiertas: el sistema calcula el valor bruto (libras × precio), resta las deducciones (retención IR, secado, etc.), abona el neto a un préstamo del productor si se indica y paga el excedente al productor como cuenta por pagar. En ese mismo acto, el café sale de la bodega de custodia y entra al inventario propio con su costo de compra.","key_features":["Fijación de precio por libra sobre el depósito disponible del productor","Liquidación de varias fijaciones abiertas en un solo acto","Cálculo de valor bruto, deducciones y neto","Abono automático al préstamo (incluso cruzando moneda con tasa) y excedente como cuenta por pagar","Traslado del café de custodia a inventario propio con costo de compra"],"flows":[{"title":"Fijar precio del café","steps":["En Fijación y liquidación, pestaña Fijaciones, clic en «Nueva fijación»","Elegir productor, escribir libras y precio por libra y la moneda","Agregar una nota si hace falta y clic en «Fijar»"],"note":"No se pueden fijar más libras de las disponibles en el depósito (FIN_DEPOSIT_INSUFFICIENT)."},{"title":"Liquidar entregas","steps":["Pestaña Liquidaciones, clic en «Nueva liquidación»","Elegir el productor y marcar las fijaciones abiertas a liquidar","Opcional: elegir el préstamo a abonar y la tasa de cambio si cruza moneda","Agregar deducciones (concepto y monto) si corresponde","Clic en «Liquidar»"],"note":"Requiere sucursal activa y tener configurada la bodega de liquidación."}],"business_rules":["Libras y precio de la fijación deben ser positivos (FIN_FIXATION_INVALID)","No se puede fijar más de lo disponible en el depósito del productor","Las fijaciones a liquidar deben estar abiertas y ser del mismo productor (FIN_FIXATION_STATE / FIN_FIXATION_NOT_FOUND)","No se pueden mezclar monedas distintas en una misma liquidación (FIN_FIXATION_MIXED)","Las deducciones requieren concepto y monto positivo y no pueden exceder el valor bruto (FIN_DEDUCTION_INVALID / FIN_DEDUCTION_EXCEEDS)","Si la fijación es en dólares se necesita tasa de cambio vigente para valorar el inventario (FIN_RATE_REQUIRED)","El abono al préstamo se hace con el método cupo de café; el excedente se registra como cuenta por pagar al productor","Al liquidar, el café sale de custodia y entra al inventario propio con costo = valor de compra; las fijaciones quedan Liquidadas"],"permissions":["financing.liquidation.read","financing.liquidation.create","financing.fixation.create","financing.reception.read"],"routes":[{"path":"/financiamiento/liquidaciones","name":"Fijación y liquidación","purpose":"Fijar precio del café y liquidar entregas abonando al préstamo"}],"faqs":[{"q":"¿Cómo fijo el precio del café de un productor?","a":"En Fijaciones, «Nueva fijación»: elegí productor, libras, precio por libra y moneda. No podés fijar más de lo disponible."},{"q":"¿Puedo liquidar fijaciones en córdobas y en dólares juntas?","a":"No, una liquidación maneja una sola moneda. Hacé liquidaciones separadas por moneda."},{"q":"¿Qué pasa con el saldo a favor del productor después de pagar su préstamo?","a":"El excedente queda como cuenta por pagar a favor del productor."},{"q":"¿Dónde queda el café después de liquidar?","a":"Sale de la bodega de custodia y entra al inventario propio de la empresa con su costo de compra."}]},{"id":"financiamiento-riesgo","name":"Riesgo de cartera","icon":"📊","one_liner":"Análisis asesor (solo lectura) de probabilidad de incumplimiento y pérdida esperada de los préstamos.","what_it_does":"Pantalla de apoyo a la decisión para el analista de crédito. Calcula, para cada préstamo activo, su probabilidad de incumplimiento (PD) y su severidad de pérdida (LGD) según el estado del crédito, los días de atraso, el historial de mora del productor y la cobertura de la garantía de café. Luego corre una simulación Monte Carlo con un factor común del mercado/cosecha y muestra la exposición total, la pérdida esperada y el Valor en Riesgo (VaR 95% y 99%). Es solo informativo: no registra ni cambia nada.","key_features":["Probabilidad de incumplimiento (PD) por préstamo: heurística transparente o modelo Random Forest si está activo","Simulación Monte Carlo de pérdidas con factor sistémico, reproducible por semilla","Indicadores: exposición total, pérdida esperada, VaR 95% y VaR 99%","Detalle por préstamo con PD, LGD y fuente del cálculo","Controles de número de simulaciones y semilla"],"flows":[{"title":"Consultar el riesgo de la cartera","steps":["Abrir Riesgo de cartera","Ajustar el número de simulaciones y la semilla (opcional)","Clic en «Recalcular»","Revisar los indicadores y la tabla de detalle por préstamo"],"note":"Misma semilla produce el mismo resultado; el VaR puede ser 0 aunque haya pérdida esperada cuando la mora es rara."}],"business_rules":["Es de solo lectura: no escribe datos ni cambia estados de préstamos","Solo analiza préstamos en estado Activo con saldo mayor a cero","La exposición consolida los saldos C$ y US$ usando la tasa de cambio (o una de respaldo si no hay tasa cargada)","El número de simulaciones se limita a un máximo del sistema","Peor estado del crédito o más días de atraso y más historial de mora del productor aumentan la PD"],"permissions":["financing.risk.read"],"routes":[{"path":"/financiamiento/riesgo","name":"Riesgo de cartera","purpose":"Análisis informativo de PD y pérdida esperada de los préstamos"}],"faqs":[{"q":"¿Este análisis cambia algo en los préstamos?","a":"No,
