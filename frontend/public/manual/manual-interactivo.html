uieren una sesión de caja abierta de la sucursal","El cobro de una CxC es idempotente por clave: refleja el abono en la factura de origen y registra el movimiento de caja una sola vez","Tipos de movimiento: ingreso, egreso, ajuste y devolución; egreso y devolución restan, los demás suman","La sesión sigue una máquina de estados (abierta → conteo/revisión pendiente → cerrada; cerrada → reabierta para investigación)"],"permissions":["payments.cash_session.read","payments.cash_session.open","payments.cash_session.close","payments.cash_movement.create","payments.intent.read","procurement.payable.pay"],"routes":[{"path":"/caja","name":"caja","purpose":"Sesión de caja: abrir con fondo, registrar movimientos y cobros, arqueo y cierre"}],"faqs":[{"q":"¿Cómo abro la caja al empezar el día?","a":"Entrá a Caja, escribí el fondo inicial que hay en la gaveta y tocá 'Abrir caja'."},{"q":"¿Cómo cierro la caja correctamente?","a":"Contá la gaveta por denominación en Arqueo, guardá el arqueo, revisá la diferencia y tocá 'Cerrar caja'."},{"q":"¿Qué pasa si el conteo no coincide con lo esperado?","a":"El sistema muestra la diferencia (faltante o sobrante) en rojo; igual podés cerrar y la diferencia queda registrada."},{"q":"¿Cómo cobro lo que me debe un cliente?","a":"En Movimientos usá 'Cobro de cliente', elegí su cuenta por cobrar, poné el monto y el método y tocá Cobrar."}]},{"id":"sesiones-caja","name":"Sesiones de caja (historial y reapertura)","icon":"📊","one_liner":"Consultá el historial de cajas con sus aperturas, cierres y diferencias, y solicitá reabrir una caja cerrada con aprobación de otra persona.","what_it_does":"Es el historial de todas las sesiones de caja de la sucursal: cuándo se abrieron y cerraron, el monto esperado, el contado y la diferencia. Desde aquí se puede solicitar la reapertura de una caja ya cerrada (por ejemplo para investigar una diferencia). La reapertura no es directa: una persona la solicita con motivo y otra persona distinta, con permiso de aprobación, debe autorizarla (separación de funciones / maker-checker).","key_features":["Tabla de sesiones con estado, apertura, cierre, esperado, contado y diferencia (diferencia distinta de cero resaltada)","Solicitud de reapertura de una caja cerrada con motivo obligatorio","Aprobación de la reapertura por una persona distinta a quien la solicitó (doble control)"],"flows":[{"title":"Solicitar la reapertura de una caja cerrada","steps":["Entrá a Caja → Historial (Sesiones de caja)","Ubicá la sesión CERRADA que querés reabrir","Tocá 'Solicitar reapertura'","Escribí el motivo (mínimo 5 caracteres) y confirmá 'Solicitar'","Avisá a un aprobador: una persona distinta debe autorizarla"],"note":"La solicitud queda pendiente; otra persona con payments.cash.reopen.approve la aprueba (no puede ser quien la solicitó)."}],"business_rules":["Solo se puede reabrir una sesión que esté CERRADA","La reapertura usa doble control (maker-checker): quien solicita no puede aprobar; el aprobador debe ser distinto y tener el permiso de aprobación","Solicitar exige payments.cash.reopen.request; aprobar exige payments.cash.reopen.approve","El motivo de la solicitud debe tener al menos 5 caracteres y lo verá quien apruebe"],"permissions":["payments.cash_session.read","payments.cash.reopen.request","payments.cash.reopen.approve"],"routes":[{"path":"/caja/sesiones","name":"caja-sesiones","purpose":"Historial de sesiones de caja y flujo de reapertura con doble aprobación"}],"faqs":[{"q":"¿Cómo reabro una caja que ya cerré?","a":"En Sesiones de caja tocá 'Solicitar reapertura', poné el motivo y pedí a otra persona con permiso que la apruebe."},{"q":"¿Puedo aprobar mi propia solicitud de reapertura?","a":"No; por separación de funciones la aprueba una persona distinta con el permiso de aprobación."}]},{"id":"intentos-pago","name":"Intentos de pago","icon":"💳","one_liner":"Seguí el ciclo de un cobro (creado → autorizado → cobrado) y manejá reembolsos donde una persona los solicita y otra los aprueba.","what_it_does":"Es la pantalla del ciclo de vida de los cobros (intentos de pago): crear un intento por un monto y método, autorizarlo, cobrarlo (capturar), cancelarlo o reembolsarlo. El reembolso usa doble control: una persona lo solicita y otra distinta, con permiso de aprobación, lo aprueba y se ejecuta. Como el backend no lista las aprobaciones pendientes, la pantalla muestra los reembolsos solicitados en esa misma sesión del navegador para que el aprobador (checker) los apruebe.","key_features":["Crear intento de pago por monto, método y referencia externa","Acciones según estado: Autorizar, Cobrar (capturar), Cancelar","Solicitud de reembolso de un pago cobrado y aprobación por otra persona (SoD)","Estados visibles del intento (creado, autorizado, cobrado, parcial, reembolsado, etc.)"],"flows":[{"title":"Crear y cobrar un intento de pago","steps":["Entrá a Caja → Intentos de pago","Tocá 'Nuevo intento', poné el monto, el método y una referencia","Tocá 'Crear'","En el renglón, tocá 'Autorizar' y luego 'Cobrar' (o 'Cobrar' directo según el estado)"],"note":"Crear/operar intentos exige payments.intent.create; ver exige payments.intent.read."},{"title":"Reembolsar un pago cobrado (con aprobación)","steps":["Ubicá el intento en estado cobrado (capturado) y tocá 'Reembolso'","Escribí el monto a reembolsar y solicitá","Aparece en 'Reembolsos pendientes de aprobación'","Otra persona distinta, con permiso, tocá 'Aprobar'; ahí se ejecuta el reembolso"],"note":"Solo se puede reembolsar un pago capturado; el solicitante no puede aprobar su propio reembolso (separación de funciones)."}],"business_rules":["El intento sigue una máquina de estados: creado → autorizado/cobrado → reembolsado/cancelado/fallido (no se salta pasos inválidos)","Solo se puede reembolsar un pago en estado cobrado/parcialmente cobrado/parcialmente reembolsado, y el monto debe ser mayor a cero","El reembolso usa doble control (maker-checker): quien solicita no aprueba; el aprobador necesita payments.refund.approve","Solicitar reembolso exige payments.refund.request; las acciones de autorizar/cobrar/cancelar exigen payments.intent.create","La lista de reembolsos pendientes es solo de la ventana actual del navegador (el backend no la persiste para listar)"],"permissions":["payments.intent.read","payments.intent.create","payments.refund.request","payments.refund.approve"],"routes":[{"path":"/caja/pagos","name":"caja-pagos","purpose":"Ciclo de intentos de pago: crear, autorizar, cobrar, cancelar y reembolsar con aprobación"}],"faqs":[{"q":"¿Cómo cobro un intento de pago?","a":"Creá el intento, luego en el renglón tocá Autorizar y Cobrar según el estado en que esté."},{"q":"¿Cómo reembolso un pago?","a":"Tocá Reembolso en el pago cobrado, poné el monto y solicitá; otra persona con permiso debe aprobarlo para que se ejecute."},{"q":"¿Por qué no veo reembolsos pendientes de otra persona?","a":"La lista de pendientes es solo de tu ventana actual; el aprobador debe tener a mano la solicitud creada en su sesión."}]},{"id":"bancos","name":"Bancos (cuentas y conciliación)","icon":"🏦","one_liner":"Registrá cuentas bancarias, cargá extractos y conciliá cada línea del banco contra los pagos del sistema (transferencias, cheques, tarjetas).","what_it_does":"Maneja las cuentas bancarias de la empresa y la conciliación de extractos. Registrás una cuenta (banco, nombre, número, moneda), cargás un extracto pegando las líneas en CSV (fecha, descripción, referencia, monto con signo) y luego conciliás: el sistema sugiere coincidencias (matches) por monto y fecha contra los pagos cobrados del sistema, o hacés el match manual. Las líneas que no corresponden a un pago (comisiones, intereses) se excluyen con una razón. Cuando todas las líneas están resueltas, conciliás el extracto y queda inmutable. El efectivo no va por aquí: se controla con el arqueo de caja.","key_features":["Cuentas bancarias por banco, nombre, número y moneda","Carga de extractos pegando CSV (fecha, descripción, referencia, monto ±) o agregando líneas a mano","Sugerencia automática de coincidencias por monto y fecha, más match manual y deshacer","Exclusión de líneas que no son pagos del sistema (con razón)","Barra de progreso de líneas resueltas y conciliación final que deja el extracto inmutable"],"flows":[{"title":"Cargar un extracto y conciliarlo","steps":["Entrá a Bancos → pestaña Extractos y tocá 'Cargar extracto'","Elegí la cuenta, el período (desde/hasta) y los saldos inicial y final","Pegá las líneas en CSV (fecha AAAA-MM-DD, descripción, referencia, monto con signo) o agregá líneas a mano","Verificá que inicial + suma de líneas dé el saldo final y tocá 'Cargar extracto'","En la conciliación tocá 'Sugerir matches', confirmá cada coincidencia o hacé match manual; excluí lo que no sea un pago","Cuando todas las líneas estén resueltas, tocá 'Conciliar extracto'"],"note":"El match manual solo ofrece pagos capturados por transferencia/cheque/tarjeta que calzan en monto y no respaldan otra línea."}],"business_rules":["El efectivo NO se concilia aquí: se controla con el arqueo de caja; los bancos cruzan transferencias, cheques y tarjetas","Solo se puede conciliar el extracto cuando todas sus líneas están resueltas (match o excluidas)","Una vez conciliado, el extracto queda inmutable","El match manual solo admite pagos en estado CAPTURED por método transferencia/cheque/tarjeta que aún no respaldan otra línea, y que calcen por monto","Excluir una línea exige una razón (mínimo 3 caracteres)","Ver bancos exige payments.bank.read; crear cuenta o cargar extracto exige payments.bank.manage; conciliar/match/excluir exige payments.bank.reconcile"],"permissions":["payments.bank.read","payments.bank.manage","payments.bank.reconcile"],"routes":[{"path":"/caja/bancos","name":"caja-bancos","purpose":"Cuentas bancarias y conciliación de extractos contra los pagos del sistema"}],"faqs":[{"q":"¿Cómo cargo un extracto bancario?","a":"En Bancos → Extractos tocá 'Cargar extracto', elegí la cuenta y período, pegá las líneas en CSV y guardá."},{"q":"¿Cómo concilio una línea del banco con un pago?","a":"Usá 'Sugerir matches' y confirmá la coincidencia, o tocá 'Match manual' y elegí el pago capturado que calza."},{"q":"¿Qué hago con una comisión o interés que no es un pago?","a":"Tocá 'Excluir' en esa línea y poné la razón; así no queda como pendiente."},{"q":"¿Por qué no aparece el efectivo en bancos?","a":"El efectivo se controla con el arqueo de caja, no con la conciliación bancaria."}]},{"id":"terceros","name":"Terceros (clientes y proveedores)","icon":"👥","one_liner":"Directorio único de clientes, proveedores y productores que usan ventas, facturación, compras y cartera.","what_it_does":"Es el directorio de personas y empresas con las que trabaja el negocio. Cada tercero tiene un tipo (natural, jurídico, interno), datos (nombre, razón social, RUC, cédula, correo, teléfono) y uno o varios roles (cliente, proveedor, empleado, productor, declarante, comprador externo). Desde aquí se crean y editan terceros, se cambia su estado (activo, inactivo, bloqueado) y se activan o quitan roles al instante. Lo usan la caja, la facturación, las compras y la cartera para identificar al cliente o proveedor.","key_features":["Búsqueda por nombre, RUC o cédula, con filtros por rol y estado","Crear y editar terceros con tipo, datos fiscales y de contacto","Roles múltiples por tercero (cliente, proveedor, productor, etc.) que se activan/quitan al instante","Estado del tercero: activo, inactivo o bloqueado (bloqueado = no se le puede vender ni comprar)"],"flows":[{"title":"Crear un cliente nuevo","steps":["En Terceros tocá 'Nuevo tercero'","Elegí el tipo, escribí el nombre (obligatorio) y los datos (razón social, RUC, cédula, correo, teléfono)","Marcá el rol 'Cliente' (y otros si aplica) en 'Roles iniciales'","Tocá 'Crear tercero'"],"note":"El nombre es obligatorio; los roles se pueden ajustar luego desde el botón 'Roles'."},{"title":"Cambiar los roles o el estado de un tercero","steps":["Buscá el tercero en la tabla","Para roles: tocá 'Roles' y activá/desactivá lo que sea para tu empresa (aplica al instante)","Para estado: tocá 'Editar' y cambiá el estado (activo / inactivo / bloqueado) y guardá"],"note":"Bloqueado significa que no se le puede vender ni comprar."}],"business_rules":["El nombre del tercero es obligatorio","Un tercero puede tener varios roles a la vez; los cambios de rol se aplican inmediatamente","Estado bloqueado impide venderle o comprarle","Ver terceros exige parties.party.read; crear exige parties.party.create; editar exige parties.party.update; gestionar roles exige parties.role.manage"],"permissions":["parties.party.read","parties.party.create","parties.party.update","parties.role.manage"],"routes":[{"path":"/terceros","name":"terceros","purpose":"Directorio de clientes, proveedores y productores con creación, edición, roles y estado"}],"faqs":[{"q":"¿Cómo agrego un cliente nuevo?","a":"En Terceros tocá 'Nuevo tercero', llená el nombre y datos, marcá el rol Cliente y creá."},{"q":"¿Cómo marco a alguien también como proveedor?","a":"Buscalo, tocá 'Roles' y activá el rol Proveedor; el cambio aplica al instante."},{"q":"¿Cómo evito que se le venda a un cliente moroso?","a":"Editá el tercero y cambiá su estado a 'Bloqueado'; así no se le puede vender ni comprar."}]}],"uncertainties":["Anulación de facturas (billing.doc.void): el endpoint web wired (/docs/\u003cid>/void/) ejecuta una anulación DIRECTA con el permiso billing.doc.void. Existe en el código un flujo de doble control (void_sod.py: request_void/approve_and_void con permiso billing.doc.void.approve) que NO aparece conectado en facturacion/urls.py; el diálogo del frontend dice que 'puede requerir aprobación de otra persona', pero la ruta efectiva no la exige. No pude confirmar si ese SoD de anulación se enruta en otro lado.","El detalle del documento muestra estado fiscal y acciones de contingencia solo para modo B; las pantallas no exponen explícitamente la diferencia operativa entre Modo A y Modo B más allá de la selección en Config Fiscal.","El precio de catálogo se resuelve en el backend con precedencia listas de precio (por cliente > segmento) > mayoreo > base (inventarios.pricing.resolve_sale_price); el frontend solo replica mayoreo/base, por lo que el total mostrado en pantalla puede diferir del definitivo cuando hay listas de precio por cliente o segmento.","El menú/navegación exacta (cómo se llega visualmente a cada pantalla desde el menú lateral) no se verificó; las rutas y permisos vienen confirmados del router y del backend, pero los rótulos del menú podrían diferir.","Permiso del corte de ventas: la Caja usa el permiso de frontend sales.pos.report para mostrar el botón 'Corte', y el endpoint backend PosReportView también exige sales.pos.report (confirmado en ambos lados)."]},{"area_id":"inventario-compras","area_title":"Inventario y Compras","area_summary":"Cubre todo el ciclo de los bienes de la empresa: el catalogo de articulos, las existencias por bodega con su costo promedio, el kardex (historial de movimientos), los conteos fisicos con aprobacion separada, la valorizacion del inventario, las listas de precios y, del lado de compras, los proveedores con precios pactados, requisiciones, ordenes de compra con aprobacion (quien crea no aprueba), recepcion parcial al inventario y el cruce de 3 vias (orden, recepcion, factura) con tolerancia. Todo esta separado por empresa y por sucursal activa.","icon":"📦","modules":[{"id":"existencias","name":"Existencias","icon":"📊","one_liner":"Muestra cuanto hay de cada articulo en cada bodega y desde aqui se mueve el inventario.","what_it_does":"Es la pantalla principal del inventario. Lista lo que hay disponible en cada bodega de la sucursal activa, con su costo promedio y el valor de la existencia. Desde aqui se hacen las cuatro operaciones de inventario: Recibir mercaderia (con su costo), Despachar (sacar del inventario), Ajustar (fijar la cantidad real contada) y Transferir entre bodegas. Esta pensada para el bodeguero y el encargado de inventario.","key_features":["Tabla de existencias con SKU, articulo, bodega, cantidad disponible, costo promedio y valor","Filtros por bodega, por articulo (con buscador) y un interruptor para ver solo lo que esta bajo el punto de reorden","Boton Recibir: ingresa cantidad y costo unitario; si el articulo maneja lotes, pide numero de lote y vencimiento","Boton Despachar: saca cantidad del inventario al costo promedio vigente","Boton Ajustar: se escribe la cantidad real contada y el sistema registra solo la diferencia","Boton Transferir: mueve cantidad de una bodega a otra (deben ser distintas)","Acceso directo a Lotes (si el articulo los maneja), a la Ficha del producto y a su Kardex","Cada movimiento muestra el estado contable resultante (posteado, borrador, sin contabilizar, etc.)"],"flows":[{"title":"Recibir mercaderia al inventario","steps":["Abrir Inventario (pantalla Existencias)","Hacer clic en el boton Recibir","Elegir el articulo y la bodega de destino","Escribir la cantidad y el costo unitario en cordobas","Si el articulo maneja lotes: escribir el numero de lote y la fecha de vencimiento","Opcional: agregar una nota","Confirmar con Recibir inventario; el sistema actualiza la existencia y recalcula el costo promedio"],"note":"La cantidad debe ser mayor a 0 y el costo no puede ser negativo. El costo promedio se recalcula como promedio ponderado."},{"title":"Transferir entre bodegas","steps":["En Existencias, hacer clic en Transferir","Elegir el articulo","Elegir la bodega de origen (Desde) y la de destino (Hacia)","Escribir la cantidad a mover","Confirmar; sale de una bodega y entra en la otra al mismo costo, en un solo paso"],"note":"Las bodegas de origen y destino deben ser distintas y debe haber existencia suficiente en la de origen."}],"business_rules":["Recibir exige cantidad > 0 y costo unitario >= 0; el costo promedio se recalcula por promedio ponderado movil","Si el saldo previo venia en cero o negativo, al recibir el costo promedio se reinicia al costo del ingreso (no se mezcla sobre base negativa)","Despachar normalmente exige existencia suficiente (no permite negativo salvo configuracion especial)","Transferir exige bodegas distintas y existencia suficiente en la de origen; mantiene el costo promedio","Cada movimiento queda en el kardex de forma inmutable (no se borra; las correcciones se hacen con reversas o ajustes)","Los movimientos son idempotentes: un reintento con la misma clave no duplica el movimiento","Articulos con lotes: la salida elige el lote segun la clase del producto (FEFO el de menor vencimiento, FIFO el mas antiguo)","Cada movimiento intenta generar su asiento contable y guarda el estado resultante"],"permissions":["inventory.balance.read (entrar y ver existencias)","inventory.movement.receive (Recibir)","inventory.movement.issue (Despachar)","inventory.movement.adjust (Ajustar)","inventory.transfer.create (Transferir)"],"routes":[{"path":"/inventario","name":"Existencias","purpose":"Ver existencias por bodega y registrar movimientos (recibir, despachar, ajustar, transferir)"}],"faqs":[{"q":"Como ingreso mercaderia nueva al inventario?","a":"Desde Existencias, boton Recibir: elegi articulo, bodega, cantidad y costo unitario."},{"q":"Como corrijo una existencia que no cuadra con el fisico?","a":"Usa el boton Ajustar y escribi la cantidad real contada; el sistema registra solo la diferencia. Para un conteo formal de toda la bodega, usa Conteo fisico."},{"q":"Por que no puedo despachar?","a":"Normalmente porque no hay existencia suficiente en esa bodega, o porque no tenes el permiso de despacho."},{"q":"Como veo los lotes de un articulo?","a":"Si el articulo maneja lotes, aparece el boton Lotes en su fila, que muestra cada lote con su vencimiento y saldo."}]},{"id":"kardex","name":"Kardex","icon":"🧾","one_liner":"Historial inmutable de todos los movimientos de un articulo: que entro, que salio, a que costo y quien lo hizo.","what_it_does":"Muestra el detalle cronologico de cada movimiento de inventario de un articulo: recepciones, despachos, ajustes, transferencias, conteos. Para cada movimiento muestra fecha, tipo, bodega, cantidad (con signo), costo unitario, total, lote y nota. Es la pantalla de auditoria/consulta del inventario; no se editan registros, solo se consultan.","key_features":["Tabla cronologica de movimientos con cantidad en positivo (entradas) o negativo (salidas)","Filtros por articulo (obligatorio), bodega, tipo de movimiento y rango de fechas (Desde / Hasta)","Muestra costo unitario y total de cada movimiento, mas el lote y la nota","Se llega directo desde Existencias o desde la Ficha del producto con el articulo ya seleccionado"],"flows":[{"title":"Consultar el kardex de un articulo","steps":["Abrir Inventario y luego Kardex (o el boton Kardex desde una fila de Existencias)","Elegir el articulo en el selector (es obligatorio)","Opcional: filtrar por bodega, tipo de movimiento y fechas Desde/Hasta","Revisar la lista; las entradas salen en verde con +, las salidas en rojo"],"note":"Si no se elige articulo, la pantalla solo muestra un aviso pidiendo elegir uno."}],"business_rules":["El kardex es de solo lectura e inmutable: nunca se borran movimientos","Las correcciones del pasado se hacen con reversas o ajustes nuevos, que tambien quedan en el kardex","Cada tipo de movimiento (recepcion, despacho, ajuste, transferencia, conteo fisico, etc.) tiene su etiqueta clara"],"permissions":["inventory.movement.read (ver el kardex)"],"routes":[{"path":"/inventario/kardex","name":"Kardex","purpose":"Historial de movimientos por articulo con saldo, costo y responsable"}],"faqs":[{"q":"Por que tengo que elegir un articulo primero?","a":"El kardex se muestra por articulo; sin elegir uno no hay nada que listar."},{"q":"Puedo borrar un movimiento equivocado?","a":"No. El kardex es inmutable. Se corrige con un ajuste o una reversa, que tambien quedan registrados."},{"q":"Como veo solo las recepciones de un mes?","a":"Elegi el articulo, pone el tipo de movimiento en Recepcion y el rango de fechas Desde/Hasta."}]},{"id":"catalogo","name":"Catalogo de inventario","icon":"🗂️","one_liner":"Donde se dan de alta los articulos, las bodegas y los lotes; se configura una vez.","what_it_does":"Es la pantalla de configuracion del inventario, organizada en tres pestanas: Articulos, Bodegas y Lotes. Aqui se crean y editan los productos (con SKU, precio, IVA, mayoreo, unidad, punto de reorden y controles como lotes/vencimiento), se crean las bodegas de la sucursal y se administran los lotes de los articulos que los manejan. Tambien permite imprimir etiquetas con codigo de barras.","key_features":["Pestana Articulos: alta y edicion de productos con SKU unico por empresa, codigo de barras, precio de venta, IVA, precio y cantidad minima de mayoreo, unidad de medida y punto de reorden","Marcas del articulo: maneja lotes, controla vencimiento (requiere lotes) y producto controlado (agroquimico)","Imprimir etiquetas: se seleccionan articulos y se generan etiquetas con nombre, precio y codigo de barras Code 128 escaneable","Pestana Bodegas: alta de bodegas de la sucursal activa, con tipo, ubicacion y marca de bodega por defecto","Pestana Lotes: ver y crear lotes por articulo (numero de lote, lote del proveedor, fechas de produccion y vencimiento)"],"flows":[{"title":"Crear un articulo nuevo","steps":["Abrir Catalogo de inventario, pestana Articulos","Hacer clic en Nuevo articulo","Escribir el SKU (codigo unico) y el nombre","Opcional: categoria, codigo de barras, precio de venta, IVA %, precio y cantidad minima de mayoreo, unidad y punto de reorden","Si el producto vence (agroquimicos, alimentos): activar Maneja lotes y luego Controla vencimiento","Confirmar con Crear articulo"],"note":"El SKU es unico por empresa y no se puede cambiar despues. El IVA se captura en % (15 = 15%, 0 = exento). Sin precio de venta la Caja no puede vender el articulo."},{"title":"Crear una bodega","steps":["Asegurarse de tener una SUCURSAL elegida en el selector de arriba","Ir a la pestana Bodegas y hacer clic en Nueva bodega","Escribir el nombre, opcional un codigo corto, el tipo y la ubicacion","Opcional: marcarla como bodega por defecto","Confirmar con Crear bodega"],"note":"Las bodegas pertenecen a la sucursal activa; si no hay sucursal elegida el boton queda deshabilitado."},{"title":"Imprimir etiquetas con codigo de barras","steps":["En la pestana Articulos, marcar las casillas de los articulos a etiquetar","Hacer clic en Imprimir etiquetas","Indicar cuantas copias por articulo (1 a 100)","Hacer clic en Imprimir; se abre una ventana lista para imprimir"],"note":"La etiqueta usa el codigo de barras del articulo, o el SKU si no tiene codigo de barras."}],"business_rules":["SKU unico por empresa; el codigo de barras tambien es unico por empresa (si se usa)","El SKU y la unidad de medida no se pueden editar despues de crear el articulo","Controla vencimiento requiere que el articulo Maneje lotes","El IVA se guarda como fraccion 0-1 (0.15) pero se captura y muestra en porcentaje","Las bodegas se crean dentro de la sucursal activa; el codigo de bodega es unico por sucursal","Solo los articulos que manejan lotes aparecen en la pestana Lotes","La clase de inventario (FEFO/FIFO/Promedio) define el orden de consumo: FEFO exige lotes y vencimiento; FIFO exige lotes"],"permissions":["inventory.item.read (ver el catalogo)","inventory.item.create (Nuevo articulo)","inventory.item.update (Editar articulo)","inventory.warehouse.create (Nueva bodega)","inventory.lot.read / inventory.lot.create (ver y crear lotes)"],"routes":[{"path":"/inventario/catalogo","name":"Catalogo de inventario","purpose":"Alta y edicion de articulos, bodegas y lotes; impresion de etiquetas"}],"faqs":[{"q":"Por que no puedo cambiar el SKU de un articulo?","a":"El SKU es el codigo unico del producto y queda fijo al crearlo. Si esta mal, hay que crear otro articulo."},{"q":"Como hago que un articulo controle vencimiento?","a":"Primero activa Maneja lotes; recien ahi se habilita Controla vencimiento. Solo se puede al crear el articulo."},{"q":"Por que el boton de Nueva bodega esta gris?","a":"Porque no hay una sucursal elegida en el selector de arriba. Las bodegas pertenecen a una sucursal."},{"q":"Como imprimo codigos de barras para la caja?","a":"Marca los articulos en la pestana Articulos, hace clic en Imprimir etiquetas, elegi las copias e imprimi."}]},{"id":"conteo-valorizacion","name":"Conteo fisico y valorizacion","icon":"✅","one_liner":"Hoja de conteo de bodega que otra persona aprueba antes de ajustar el kardex, mas el valor total del inventario.","what_it_does":"Tiene dos pestanas. Conteos: se genera una hoja con lo esperado de una bodega, se captura lo realmente contado (conteo ciego, el sistema no sugiere el valor), las varianzas las revisa y aprueba OTRA persona distinta a quien conto, y al aprobar se ajusta el kardex. Valorizacion: muestra cuanto vale hoy el inventario (existencia x costo promedio), agrupado por bodega y por categoria, con detalle articulo por articulo, y se puede imprimir.","key_features":["Generar hoja de conteo por bodega (opcionalmente filtrada por categoria); congela lo esperado en ese momento","Captura de lo contado por linea, sin que el sistema muestre lo esperado al capturar (conteo ciego honesto)","Captura parcial: se puede guardar avance e indica cuantas lineas faltan por contar","Aprobacion con separacion de funciones: quien conto no puede aprobar","Al aprobar, postea un ajuste por cada varianza y deja la existencia en lo realmente contado","Estados de la hoja: Abierto, Contado, Posteado, Cancelado","Valorizacion total del inventario con desglose por bodega y por categoria y detalle imprimible"],"flows":[{"title":"Generar y contar una hoja","steps":["Abrir Conteo fisico, pestana Conteos","Hacer clic en Nueva hoja de conteo","Elegir la bodega y, opcional, una categoria (vacio = toda la bodega) y notas","Confirmar Generar hoja; se crea con las lineas esperadas congeladas","Abrir la hoja, escribir lo realmente contado por articulo","Guardar lo contado (se puede dejar a medias y volver despues)"],"note":"Quien guarda lo contado queda como contador y, por separacion de funciones, no podra aprobar esa misma hoja."},{"title":"Aprobar el conteo y ajustar el kardex","steps":["Una persona DISTINTA a la que conto abre la hoja en estado Contado","Revisar las varianzas (lo contado vs. lo esperado)","Hacer clic en Aprobar y ajustar kardex","El sistema postea un ajuste por cada diferencia y deja la existencia en lo contado"],"note":"Si la misma persona que conto intenta aprobar, el sistema lo bloquea (debe aprobar otra persona)."}],"business_rules":["La hoja congela el esperado al generarla; si no hay existencias para esa bodega/categoria no se puede generar","Conteo ciego: al capturar no se muestra lo esperado, para un conteo honesto","Separacion de funciones: quien conto no puede aprobar la misma hoja (se rechaza con error)","Solo se puede aprobar una hoja que este completamente Contada","Al aprobar, la varianza se calcula contra la existencia ACTUAL (no contra el snapshot): si alguien ya movio stock y coincide con lo contado, no se ajusta esa linea","El posteo deja la existencia en lo contado y es idempotente por linea (un reintento no duplica ajustes)","Se pueden cancelar hojas que esten Abiertas o Contadas","La valorizacion es de solo lectura: suma existencia x costo promedio de cada saldo"],"permissions":["inventory.count.read (ver conteos y valorizacion)","inventory.count.create (generar y cancelar hojas)","inventory.count.capture (capturar lo contado)","inventory.count.approve (aprobar y ajustar)","inventory.balance.read (ver la valorizacion)"],"routes":[{"path":"/inventario/conteo","name":"Conteo fisico y valorizacion","purpose":"Hojas de conteo con aprobacion separada y valor del inventario"}],"faqs":[{"q":"Por que no puedo aprobar el conteo que yo conte?","a":"Por separacion de funciones: quien cuenta no aprueba. Debe aprobarlo otra persona con el permiso correspondiente."},{"q":"Que pasa si dejo el conteo a medias?","a":"Se guarda como avance parcial y la hoja sigue Abierta; el sistema indica cuantas lineas faltan por contar."},{"q":"El sistema me dice lo que deberia haber al contar?","a":"No. El conteo es ciego: escribis lo que realmente contas sin ver lo esperado, para que sea honesto."},{"q":"Como se cuanto vale mi inventario hoy?","a":"En la pestana Valorizacion: muestra el valor total y el desglose por bodega y categoria. Se puede imprimir."}]},{"id":"listas-precios","name":"Listas de precios","icon":"🏷️","one_liner":"Precios especiales por cliente o segmento, con tramos de cantidad (mayoreo).","what_it_does":"Permite administrar listas de precios: cada lista tiene tramos de precio por articulo y cantidad minima, y se asigna a un cliente concreto o a un segmento (por ejemplo MAYORISTA, VIP, o los segmentos del comisariato). El precio de venta efectivo lo resuelve siempre el servidor segun la precedencia definida; esta pantalla solo administra las listas, no fija el precio al vender.","key_features":["Crear, editar y activar/desactivar listas de precios con su moneda (NIO, USD, etc.)","Tramos de precio: por articulo, cantidad minima y precio (gana el tramo de mayor cantidad minima alcanzada)","Asignaciones: a un cliente concreto o a un segmento de cliente","El precio de venta lo resuelve siempre el servidor (anti-fraude); aqui solo se administran las listas"],"flows":[{"title":"Crear una lista y agregar precios","steps":["Abrir Listas de precios","Hacer clic en Nueva y poner nombre y moneda","Seleccionar la lista en el panel izquierdo","En Tramos de precio, hacer clic en Agregar tramo: elegir articulo, cantidad minima y precio","En Aplica a, hacer clic en Asignar: elegir un cliente o escribir un segmento"],"note":"Si la lista no tiene asignaciones, aplica como lista general/por defecto."}],"business_rules":["El precio de venta lo resuelve SIEMPRE el servidor; el cliente nunca manda el precio","Precedencia del precio: lista del cliente > lista del segmento > mayoreo del articulo > precio base","Dentro de una lista gana el tramo con la mayor cantidad minima que la venta alcance","Las listas se filtran por moneda: una lista en USD no aplica a una venta en NIO","Cada asignacion es a un cliente O a un segmento, nunca a los dos a la vez; solo una asignacion activa por cliente/segmento","El nombre de la lista es unico por empresa"],"permissions":["inventory.pricelist.read (ver listas)","inventory.pricelist.write (crear, editar, agregar tramos y asignaciones)"],"routes":[{"path":"/inventario/listas-precios","name":"Listas de precios","purpose":"Administrar precios por cliente/segmento con tramos de cantidad"}],"faqs":[{"q":"Como le pongo un precio especial a un cliente mayorista?","a":"Crea una lista, agrega los tramos de precio por articulo y cantidad, y asignala al cliente o al segmento MAYORISTA."},{"q":"Que precio gana si un cliente tiene lista propia y de segmento?","a":"Gana la del cliente concreto; luego la del segmento; luego el mayoreo del articulo; y por ultimo el precio base."},{"q":"Por que mi lista en dolares no se aplica en una venta en cordobas?","a":"Las listas se filtran por moneda. Una lista USD solo aplica a ventas en USD."}]},{"id":"ficha-producto","name":"Ficha de producto","icon":"📄","one_liner":"Vista completa de un articulo: datos, precios, existencias por bodega y ultimos movimientos.","what_it_does":"Muestra todo lo de un articulo en una sola pantalla de consulta: precios (venta, mayoreo, IVA), niveles (punto de reorden, stock minimo/maximo), existencias por cada bodega con su costo y valor, total disponible, y los ultimos movimientos. Avisa cuando el articulo esta bajo su punto de reorden. Es de solo lectura; los cambios se hacen en el Catalogo.","key_features":["Encabezado con chips de estado: activo/inactivo, categoria, unidad, por lotes, controlado, bajo punto de reorden","Bloque de Precios (venta, mayoreo con su cantidad minima, IVA) y de Niveles (reorden, minimo, maximo)","Existencias por bodega con disponible, en mano, costo promedio y valor, resaltando filas bajo el reorden","Lista de ultimos movimientos del articulo","Accesos directos a Kardex completo y de vuelta a Existencias"],"flows":[{"title":"Consultar la ficha de un articulo","steps":["Desde Existencias o el Catalogo, hacer clic en Ficha en la fila del articulo","Revisar precios, niveles y existencias por bodega","Si hace falta el detalle completo, hacer clic en Kardex completo"],"note":"Si la existencia total esta en o por debajo del punto de reorden, aparece el aviso 'Bajo punto de reorden'."}],"business_rules":["Pantalla de solo lectura; la edicion del articulo se hace en el Catalogo","Marca como bajo reorden cuando la existencia disponible total es menor o igual al punto de reorden (si este es mayor a 0)","Resalta cada bodega cuya existencia este en cero o por debajo del punto de reorden"],"permissions":["inventory.item.read (ver la ficha)"],"routes":[{"path":"/inventario/producto/:itemId","name":"Ficha de producto","purpose":"Vista consolidada de un articulo: precios, niveles, existencias y movimientos"}],"faqs":[{"q":"Donde veo todo de un solo articulo?","a":"En su Ficha: precios, niveles, existencias por bodega y ultimos movimientos en una sola pantalla."},{"q":"Puedo editar el articulo desde la ficha?","a":"No, la ficha es de consulta. Para editar usa el Catalogo de inventario."}]},{"id":"compras-documentos","name":"Compras - Documentos de proveedor","icon":"🧮","one_liner":"Documentos de compra (factura, nota de credito, etc.); la factura posteada crea la cuenta por pagar.","what_it_does":"Es la pantalla principal de Compras, con buscador y filtros, donde viven los documentos de proveedor (factura de proveedor, nota de credito, recibo de bienes, etc.). Un documento nace como borrador sin numero; al postearlo toma numero, queda en firme y, si tiene proveedor del directorio, genera la cuenta por pagar. Tambien es el punto de entrada a las pestanas de Ordenes, Requisiciones, Reorden y Precios proveedor.","key_features":["Lista de documentos con numero (serie-numero), tipo, proveedor, total, fecha y estado","Buscador por proveedor, referencia o numero y filtros por estado y tipo","Crear documento en borrador: tipo, proveedor (del directorio de Terceros o texto libre), referencia fisica, subtotal e impuesto","Postear el borrador: toma numero, queda en firme y alimenta la cuenta por pagar","Anular un documento posteado con motivo obligatorio","Pestanas de Documentos, Ordenes de compra, Requisiciones, Reorden y Precios proveedor (segun permisos)"],"flows":[{"title":"Registrar y postear una factura de proveedor","steps":["Abrir Compras, pestana Documentos","Hacer clic en Nuevo documento","Elegir el tipo (por defecto Factura de proveedor) y el proveedor","Escribir la referencia del proveedor (numero de su factura fisica), el subtotal y el impuesto","Crear borrador (queda sin numero)","Abrir el documento y hacer clic en Postear; confirma que tomara numero y quedara en firme"],"note":"Al postear, un documento con proveedor del directorio genera la cuenta por pagar. El total se calcula como subtotal + impuesto."}],"business_rules":["Un documento nuevo nace como BORRADOR sin numero","Al postear toma numero secuencial por empresa/sucursal/tipo/serie y queda en firme","La factura posteada con proveedor fuerte (Party) genera la cuenta por pagar (CxP)","No se puede postear un documento anulado; un documento ya posteado se ignora si se reintenta postear","Solo se anula un documento POSTEADO (no un borrador) y exige motivo de al menos 3 caracteres","Estados del documento: Borrador, Posteado, Anulado","Los tipos validos de documento son factura, nota de credito, recibo de bienes, pago a proveedor y ajuste"],"permissions":["procurement.doc.read (ver documentos)","procurement.doc.create (crear borrador)","procurement.doc.post (postear)","procurement.doc.void (anular)"],"routes":[{"path":"/compras","name":"Compras","purpose":"Documentos de proveedor y acceso a ordenes, requisiciones, reorden y precios"},{"path":"/compras/:id","name":"Detalle de compra","purpose":"Ver, postear o anular un documento de compra"}],"faqs":[{"q":"Como registro la factura de un proveedor?","a":"Compras > Documentos > Nuevo documento; elegi el proveedor, la referencia, el subtotal y el impuesto, crea el borrador y posteralo."},{"q":"Cuando se crea la cuenta por pagar?","a":"Al POSTEAR el documento (si tiene proveedor del directorio). El borrador todavia no genera CxP."},{"q":"Puedo borrar una factura mal hecha?","a":"Si esta posteada se ANULA con un motivo. Un borrador no se postea y se puede dejar/descartar."}]},{"id":"ordenes-compra","name":"Ordenes de compra","icon":"🛒","one_liner":"Ordenes formales con aprobacion (quien crea no aprueba), recepcion parcial al inventario y cruce de 3 vias.","what_it_does":"Maneja el ciclo formal de una orden de compra: se crea con lineas (articulo, cantidad, costo), se envia a aprobacion, OTRA persona la aprueba, se marca como enviada al proveedor, se reciben las mercaderias (total o parcialmente, lo que entra al inventario al costo real) y se registra la factura del proveedor con un cruce de 3 vias (orden-recepcion-factura) que valida montos con tolerancia. Cada recepcion actualiza el ultimo costo del proveedor.","key_features":["Crear OC borrador con lineas: articulo, cantidad y costo (vacio = usa el precio del proveedor)","Ciclo de estados: Borrador, Pendiente de aprobacion, Aprobada, Enviada, Recibida parcial, Recibida, Cerrada, Cancelada","Aprobacion con separacion de funciones: quien creo/envio la OC no puede aprobarla","Recepcion parcial e idempotente: se recibe linea por linea hasta lo pendiente; cada linea entra al inventario al costo real","Registrar factura con cruce de 3 vias y tolerancia (por defecto +/-2%); con permiso especial se puede forzar fuera de tolerancia (queda auditado)","Muestra 'recibido pendiente de facturar', recepciones y facturas ligadas a la orden","El total recibido actualiza automaticamente el ultimo costo del proveedor"],"flows":[{"title":"Crear y aprobar una orden de compra","steps":["En Compras, pestana Ordenes de compra, hacer clic en Nueva orden de compra","Elegir el proveedor y, opcional, la fecha esperada de entrega","Agregar lineas: articulo, cantidad y costo (si se deja vacio toma el precio del proveedor)","Crear borrador","Abrir la OC y hacer clic en Enviar a aprobacion","Una persona DISTINTA a quien la creo/envio abre la OC y hace clic en Aprobar"],"note":"Si quien creo o envio la orden intenta aprobarla, el sistema lo bloquea (debe aprobar otra persona)."},{"title":"Recibir mercaderia (parcial o total)","steps":["Con la OC en estado Enviada (o Recibida parcial), hacer clic en Recibir mercaderia","Elegir la bodega de destino","Por cada linea, escribir cuanto se recibe ahora y el costo real (dejar en 0 lo que no llego)","Hacer clic en Postear recepcion; cada linea entra al inventario (kardex) al costo real"],"note":"No se puede recibir mas de lo pendiente por linea. La recepcion es idempotente: un reintento no duplica el ingreso. Actualiza el ultimo costo del proveedor."},{"title":"Registrar la factura del proveedor (3 vias)","steps":["Con la OC ya con mercaderia, hacer clic en Registrar factura","Escribir la referencia, el subtotal y el impuesto","Si el monto se sale de la tolerancia y tenes permiso, activar Forzar fuera de tolerancia","Crear el borrador de factura","Postear ese borrador en Documentos para generar la cuenta por pagar"],"note":"El cruce compara la factura contra el 'recibido pendiente de facturar' con tolerancia +/-2%. Los borradores de factura previos ya consumen ese valor."}],"business_rules":["Quien crea o envia la OC no puede aprobarla (separacion de funciones maker != checker)","Solo se puede recibir cuando la OC esta Enviada o Recibida parcial; no se permite recibir mas de lo pendiente (sin over-receipt)","La recepcion es idempotente por clave; cada linea postea inventario real (con su asiento contable) al costo real","El estado de la OC se deriva de lo recibido: pasa a Recibida parcial o Recibida automaticamente","El costo de una linea se resuelve asi: explicito > precio acordado del proveedor > ultimo costo > error si falta","Cruce de 3 vias: la factura debe cuadrar con lo recibido dentro de la tolerancia (por defecto +/-2%); fuera de eso se rechaza salvo forzar con permiso procurement.invoice.match_override (queda auditado)","Los borradores de factura ligados a la OC ya consumen el valor pendiente (evita doble facturacion); un borrador huerfano bloquea el match hasta anularlo","Una OC con mercaderia recibida no se cancela: se cierra (acepta lo pendiente como no entregado); solo se cancela sin recepciones","La factura del proveedor se postea aparte en Documentos para generar la cuenta por pagar"],"permissions":["procurement.order.read (ver ordenes)","procurement.order.create (crear OC)","procurement.order.submit (enviar a aprobacion)","procurement.order.approve (aprobar)","procurement.order.send (marcar enviada)","procurement.order.receive (recibir mercaderia)","procurement.order.close (cerrar/cancelar)","procurement.doc.create (registrar la factura ligada)","procurement.invoice.match_override (forzar el cruce fuera de tolerancia)"],"routes":[{"path":"/compras/oc/:id","name":"Detalle de orden de compra","purpose":"Ciclo de la OC: aprobar, enviar, recibir, facturar, cerrar/cancelar"}],"faqs":[{"q":"Por que no puedo aprobar mi propia orden?","a":"Por separacion de funciones: quien crea o envia la OC no la aprueba. Debe aprobarla otra persona."},{"q":"Puedo recibir solo una parte de la orden?","a":"Si. En Recibir mercaderia escribi cuanto llego de cada linea y dejá en 0 lo que falta; la OC queda Recibida parcial."},{"q":"La factura no me cuadra con lo recibido, que hago?","a":"El cruce de 3 vias la rechaza fuera de tolerancia (+/-2%). Revisa los montos, o si tenes permiso activa Forzar fuera de tolerancia (queda auditado)."},{"q":"Quiero cancelar una OC pero ya recibi algo, se puede?","a":"No se cancela: se cierra, aceptando lo pendiente como no entregado. Cancelar solo se permite si no hay recepciones."},{"q":"De donde sale el costo si no lo escribo en la linea?","a":"Del precio del proveedor: primero el precio acordado y, si no hay, el ultimo costo recibido. Si no hay ninguno, da error."}]},{"id":"requisiciones","name":"Requisiciones","icon":"📝","one_liner":"Pedido interno 'necesito esto' que se aprueba (quien pide no aprueba) y se convierte en orden de compra.","what_it_does":"Permite a un area pedir internamente articulos sin elegir aun el proveedor: se crea la requisicion con sus lineas, se envia a aprobacion, OTRA persona la aprueba o rechaza (con motivo), y una vez aprobada se convierte en una orden de compra eligiendo el proveedor. Los costos de la OC resultante salen del precio del proveedor.","key_features":["Crear requisicion con lineas (articulo y cantidad) y una nota de para que se necesita; no lleva proveedor","Enviar a aprobacion","Aprobar o rechazar (el rechazo exige motivo); separacion de funciones: quien pidio no decide","Convertir la requisicion aprobada en orden de compra eligiendo el proveedor","Estados: Borrador, Enviada, Aprobada, Rechazada, Convertida a OC; muestra enlace a la OC generada"],"flows":[{"title":"Crear, aprobar y convertir una requisicion","steps":["En Compras, pestana Requisiciones, hacer clic en Nueva requisicion","Agregar lineas (articulo y cantidad) y la nota; Crear","Hacer clic en Enviar a aprobacion","Otra persona Aprueba (o Rechaza con motivo)","Sobre la requisicion aprobada, hacer clic en Convertir a OC y elegir el proveedor"],"note":"Al convertir, los costos de la OC salen del precio del proveedor (acordado o ultimo costo). Si falta alguno, registralo antes en Precios proveedor."}],"business_rules":["La requisicion no lleva proveedor; este se elige al convertirla","Separacion de funciones: quien creo/pidio la requisicion no puede aprobarla ni rechazarla","El rechazo exige un motivo","Solo se aprueba/rechaza una requisicion Enviada; solo se convierte una Aprobada","Al convertir, se crea una OC borrador con las mismas lineas y la requisicion queda Convertida con enlace a la OC"],"permissions":["procurement.requisition.read (ver requisiciones)","procurement.requisition.create (crear y enviar)","procurement.requisition.approve (aprobar/rechazar)","procurement.order.create (convertir a OC)"],"routes":[{"path":"/compras","name":"Compras (pestana Requisiciones)","purpose":"Pedidos internos de compra con aprobacion y conversion a OC"}],"faqs":[{"q":"Para que sirve una requisicion si ya existe la orden de compra?","a":"La requisicion es el pedido interno 'necesito esto' sin decidir aun el proveedor; al aprobarse se convierte en orden de compra."},{"q":"Puedo aprobar la requisicion que yo pedi?","a":"No. Quien pide no decide; debe aprobarla o rechazarla otra persona."},{"q":"Al convertir a OC me pide proveedor, de donde salen los costos?","a":"Del precio registrado de ese proveedor (acordado o ultimo costo). Si falta, registralo en Precios proveedor antes de convertir."}]},{"id":"reorden","name":"Reorden (reabastecimiento)","icon":"🔁","one_liner":"Lista de articulos bajo su punto de reorden con cantidad y proveedor sugeridos, para crear ordenes de compra.","what_it_does":"Muestra los articulos cuya existencia esta por debajo de su punto de reorden, con una cantidad sugerida para reabastecer y el proveedor sugerido (el de la ultima compra). Se seleccionan articulos y se generan ordenes de compra en borrador, agrupadas una por proveedor.","key_features":["Lista de articulos bajo el punto de reorden con existencia, cantidad sugerida y proveedor sugerido con ultimo costo","Cantidad sugerida = completar el stock maximo (o el doble del punto de reorden) menos lo que hay, minimo 1","Seleccion multiple para crear OCs borrador de un solo paso, agrupando una OC por proveedor","Avisa cuando hay seleccionados sin proveedor conocido (hay que registrar su precio o hacer la OC a mano)"],"flows":[{"title":"Generar ordenes de compra desde el reorden","steps":["En Compras, pestana Reorden","Revisar los articulos bajo el punto de reorden y sus cantidades/proveedores sugeridos","Marcar los articulos a reabastecer (deben tener proveedor conocido)","Hacer clic en Crear OC borrador; se genera una orden por proveedor"],"note":"Los seleccionados sin proveedor conocido no se incluyen: hay que registrarles el precio de proveedor o crear la OC manualmente."}],"business_rules":["Entran los articulos cuya existencia total en la sucursal esta por debajo del punto de reorden","Cantidad sugerida = (stock maximo, o el doble del punto de reorden si no hay maximo) menos la existencia, redondeada hacia arriba, minimo 1","El proveedor sugerido es el de la ultima compra recibida mas reciente del articulo","Al crear, se genera una OC borrador por cada proveedor con las lineas seleccionadas de ese proveedor","Los articulos sin proveedor conocido no se pueden incluir automaticamente"],"permissions":["procurement.reorder.read (ver sugerencias de reorden)","procurement.order.create (crear las OCs sugeridas)"],"routes":[{"path":"/compras","name":"Compras (pestana Reorden)","purpose":"Sugerencias de reabastecimiento y creacion de OCs por proveedor"}],"faqs":[{"q":"Como se que tengo que volver a comprar?","a":"La pestana Reorden lista los articulos bajo su punto de reorden con la cantidad sugerida para reabastecer."},{"q":"Por que no puedo crear la OC de un articulo del reorden?","a":"Probablemente no tiene proveedor conocido. Registrale el precio en Precios proveedor o crea la OC a mano."},{"q":"Como calcula la cantidad sugerida?","a":"Completa el stock maximo (o el doble del punto de reorden si no hay maximo) restando lo que ya hay, con un minimo de 1."}]},{"id":"precios-proveedor","name":"Precios por proveedor","icon":"💲","one_liner":"Precio pactado y ultimo costo por proveedor y articulo, que alimentan los costos de las ordenes de compra.","what_it_does":"Registra por cada combinacion de proveedor y articulo el precio acordado (manual) y muestra el ultimo costo (que se llena solo con cada recepcion de OC). Estos precios son los que usan las ordenes de compra cuando no se escribe el costo a mano: manda el precio acordado y, si no hay, el ultimo costo.","key_features":["Lista de precios por proveedor: proveedor, articulo, ultimo costo (automatico) y precio acordado (manual)","Filtros por proveedor y buscador de articulo","Registrar o editar el precio acordado de un (proveedor, articulo); vaciar el campo quita el acuerdo","El ultimo costo se actualiza solo con cada recepcion de mercaderia"],"flows":[{"title":"Registrar un precio acordado","steps":["En Compras, pestana Precios proveedor, hacer clic en Registrar precio","Elegir el proveedor y el articulo","Escribir el precio acordado en cordobas (vacio = quitar el acuerdo)","Guardar"],"note":"El precio acordado manda sobre el ultimo costo al armar ordenes de compra."}],"business_rules":["Hay un solo registro por combinacion de empresa, proveedor y articulo","El ultimo costo se llena/actualiza automaticamente con cada recepcion de OC; el precio acordado es manual","Para los costos de la OC manda el precio acordado; si no hay, el ultimo costo; si no hay ninguno, la linea da error de costo requerido","El precio acordado no puede ser negativo; dejarlo vacio elimina el acuerdo"],"permissions":["procurement.price.read (ver precios por proveedor)","procurement.price.manage (registrar/editar precio acordado)"],"routes":[{"path":"/compras","name":"Compras (pestana Precios proveedor)","purpose":"Precio acordado y ultimo costo por proveedor y articulo"}],"faqs":[{"q":"Como hago que la orden de compra ponga el costo sola?","a":"Registra el precio acordado del proveedor para ese articulo; al crear la OC sin escribir costo, lo toma de ahi."},{"q":"Quien actualiza el ultimo costo?","a":"El sistema, solo, cada vez que recibis mercaderia de una orden de compra de ese proveedor."},{"q":"Que pasa si hay precio acordado y ultimo costo distintos?","a":"Para armar la OC manda el precio acordado; el ultimo costo es respaldo si no hay acuerdo."}]}],"uncertainties":["El permiso para escribir/administrar listas de precios aparece en dos variantes en el codigo: el frontend usa 'inventory.pricelist.write' como permiso de ruta de lectura (meta.requiredPermissions usa inventory.pricelist.read) y el backend (views_pricing) usa inventory.pricelist.read para lectura e inventory.pricelist.write para escritura. No se confirmo si existe ademas un 'inventory.pricelist.manage'.","El despacho con stock negativo (allow_negative) existe en el backend (post_issue), pero no se identifico en el frontend de Existencias una opcion para activarlo manualmente; parece reservado a flujos internos/integraciones.","La conversion entre unidades de compra/venta y unidad base (purchase_uom_factor, sale_uom_factor, movement_uom) existe en el modelo y en post_receive, pero la pantalla de Existencias captura siempre en la unidad base; no se vio UI para recibir en unidad de compra distinta.","Existe el modelo Remision (despacho con evidencia fotografica y cotejo en destino) en el kernel de inventarios, pero no se encontro una pantalla .vue dedicada dentro de los modulos inventory/procurement revisados; podria exponerse en otra area o aun no tener UI.","La pestana de Documentos de compra solo muestra cabecera (proveedor, montos, notas) en el detalle; no se observaron lineas de articulo a nivel de PurchaseDocument (las lineas con articulos viven en la Orden de Compra). El subtotal/impuesto del documento se capturan como totales, no linea por linea.","El valor exacto de la tolerancia del 3-way match (2%) proviene del ajuste PROCUREMENT_MATCH_TOLERANCE_PCT en settings; el codigo usa 2.0 como valor por defecto, pero podria estar configurado distinto en el despliegue real."]},{"area_id":"rrhh_nomina_asistencia","area_title":"Recursos Humanos, Nómina y Asistencia","area_summary":"Cubre todo el ciclo del personal: el expediente del trabajador (datos, salario, contratos, vacaciones, documentos), el procesamiento de la planilla de Nicaragua (INSS, IR, séptimo día, horas extra, régimen CON/SIN INSS y complemento de salario), la sala de pago donde se entrega el neto y se cobran deudas internas, y el marcaje de asistencia de campo (móvil, sin conexión) que alimenta los días trabajados de la planilla.","icon":"👷","modules":[{"id":"rrhh_home_onboarding","name":"Inicio de Recursos Humanos (Onboarding)","icon":"🏠","one_liner":"Tablero de arranque que guía paso a paso para dejar listo el equipo: puestos, trabajadores, asignaciones y accesos.","what_it_does":"Es la pantalla de entrada al módulo de Recursos Humanos. Muestra tarjetas con los contadores del equipo (puestos creados, trabajadores activos, suspendidos, de baja, con asignación y con usuario del sistema) y un recorrido guiado de pasos que indica cuál es el siguiente que falta hacer (crear puestos, asignar roles a los puestos, agregar trabajadores, asignarlos y provisionar su acceso). Está pensado para que un encargado de RRHH configure la empresa de cero sin perderse.","key_features":["Tarjetas de resumen con conteos de personal (activos, suspendidos, de baja, asignados, con acceso)","Recorrido guiado de onboarding que marca el próximo paso pendiente y avisa cuando está completo","Accesos directos a Puestos, Trabajadores, Contratos y Vacaciones","Un solo resumen agregado para no hacer varias consultas"],"flows":[{"title":"Configurar el equipo desde cero","steps":["Entrar a Recursos Humanos (menú principal).","Mirar el paso marcado como «Siguiente» en el recorrido guiado.","Tocar el botón del paso (por ejemplo «Crear puesto» o «Agregar trabajador»).","Volver al inicio; el contador se actualiza y avanza al siguiente paso.","Repetir hasta que aparezca «¡Onboarding completo! Tu equipo está configurado.»"]}],"business_rules":["El próximo paso se calcula automáticamente: primero puestos, luego roles de puesto, luego trabajadores, luego asignaciones y por último provisionar usuario.","Provisionar el acceso al sistema es opcional por trabajador, pero se sugiere como último paso del recorrido.","El resumen siempre se calcula sobre la empresa activa seleccionada en la barra superior."],"permissions":["hr.employee.read"],"routes":[{"path":"/recursos-humanos","name":"Inicio RRHH","purpose":"Tablero de onboarding con contadores y pasos guiados"}],"faqs":[{"q":"¿Por dónde empiezo a configurar mi personal?","a":"Por el recorrido guiado del inicio de Recursos Humanos: te marca el siguiente paso (puestos, trabajadores, asignaciones, acceso) y solo tenés que seguirlo en orden."},{"q":"¿Qué significa que un trabajador esté «provisionado»?","a":"Que tiene un usuario del sistema vinculado para poder entrar a la aplicación. Es el último paso y es opcional: un jornalero que solo va en planilla no necesita acceso."}]},{"id":"rrhh_puestos","name":"Puestos","icon":"💼","one_liner":"Catálogo de cargos de la empresa; cada puesto define qué permisos (roles) recibe quien lo ocupa.","what_it_does":"Permite crear y administrar los puestos de trabajo de la empresa (por ejemplo «Cajero», «Capataz», «Encargado de nómina»). A cada puesto se le pueden mapear uno o varios roles del sistema, de modo que al asignar a un trabajador a ese puesto el sistema le otorgue automáticamente los permisos correspondientes. Es una configuración que se hace una vez y se reutiliza. La usa el encargado de RRHH o el administrador.","key_features":["Crear puestos desde un selector de cartas precargadas o uno personalizado","Activar/desactivar puestos y editar su nombre y código","Mapear roles a un puesto con alcance EMPRESA o SUCURSAL","Al cambiar los roles de un puesto, se reconcilian automáticamente los accesos de los trabajadores asignados que tienen usuario"],"flows":[{"title":"Crear un puesto y darle permisos","steps":["Abrir Recursos Humanos → Puestos.","Tocar «Elegir puesto…» y seleccionar una carta precargada o crear uno personalizado.","En la fila del puesto, tocar «Roles».","Marcar los roles que tendrá ese puesto y elegir el alcance (empresa o sucursal).","Guardar; los trabajadores ya asignados a ese puesto que tengan usuario reciben los accesos al instante."]}],"business_rules":["No pueden existir dos puestos con el mismo nombre dentro de la misma empresa.","Guardar los roles de un puesto es un reemplazo total: desactiva los anteriores y activa solo los nuevos.","El alcance del rol mapeado puede ser COMPANY (toda la empresa) o BRANCH (la sucursal de la asignación del trabajador).","La reconciliación de accesos solo afecta los roles de origen «POSITION»; los roles manuales o del sistema no se tocan."],"permissions":["hr.position.read","hr.position.create","hr.position.update","hr.position.roles.update"],"routes":[{"path":"/recursos-humanos/puestos","name":"Puestos","purpose":"Catálogo de cargos y mapeo de roles por puesto"}],"faqs":[{"q":"¿Cómo le doy permisos a un cargo?","a":"Entrá a Puestos, tocá «Roles» en la fila del puesto y marcá los roles que debe tener. Quien ocupe ese puesto y tenga usuario recibe esos accesos solo."},{"q":"¿Qué diferencia hay entre alcance empresa y sucursal?","a":"Empresa = el permiso aplica en toda la compañía; sucursal = solo en la sucursal donde está asignado el trabajador."}]},{"id":"rrhh_trabajadores","name":"Trabajadores y Expediente","icon":"🧑‍💼","one_liner":"Ficha completa de cada trabajador: datos personales, datos de planilla, salario, roles, acceso, suspensiones y bajas.","what_it_does":"Es el listado del personal y la ficha (expediente) de cada trabajador, usada por el encargado de RRHH. Desde el alta se cargan los datos personales y los «datos de planilla» que la nómina copia tal cual: cédula, número INSS, género, tipo de salario (por día/jornal o mensual) con su monto, el interruptor «Cotiza INSS» y el complemento de salario opcional. El perfil reúne en pestañas los datos y roles, contratos, documentos adjuntos, memorandos y el historial laboral. También se gestiona el ciclo de vida del trabajador (suspender, reintegrar, dar de baja, reingresar), su foto, y el acceso al sistema.","key_features":["Alta de trabajador con datos personales y datos de planilla (cédula, INSS, género, tipo de salario y monto)","Interruptor «Cotiza INSS» con fecha de vigencia opcional (puede ser retroactiva)","Complemento de salario: monto base pactado, aparte de la planilla legal","Roles asignados directamente a la persona (además de los que vienen del puesto)","Foto del trabajador y documentos del expediente (cédula, INSS, títulos, etc.)","Ciclo de vida laboral: suspender, reintegrar, dar de baja, reingresar — siempre con motivo y auditado","Saldo de vacaciones visible en el encabezado","Provisionar usuario del sistema, resetear contraseña temporal y revocar acceso"],"flows":[{"title":"Dar de alta un nuevo trabajador","steps":["Recursos Humanos → Trabajadores → «Nuevo trabajador».","Cargar nombres, apellidos y datos de contacto (foto opcional).","Llenar los datos de planilla: cédula, número INSS, género, tipo de salario (por día o mensual) y su monto.","Definir si «Cotiza INSS» y, si aplica, el complemento de salario.","Otorgar los roles que necesite.","Guardar: el trabajador queda creado y disponible para asignarlo y para la nómina."]},{"title":"Suspender o dar de baja a un trabajador","steps":["Abrir el perfil del trabajador desde la lista.","Tocar «Suspender» o «Dar de baja» en el encabezado.","Elegir el motivo del catálogo y la fecha efectiva (en suspensión, opcionalmente con goce de salario y bloqueo de acceso).","Confirmar.","En baja: se terminan sus asignaciones, se revoca su acceso y se finalizan los contratos vigentes; queda como historial y puede reingresar después."],"note":"El estado laboral nunca se edita directo: solo cambia por estas acciones, que quedan registradas en el historial con su motivo."},{"title":"Cambiar si el trabajador cotiza INSS","steps":["Abrir el perfil → pestaña «Datos y roles».","Activar o desactivar el interruptor «Cotiza INSS».","Opcional: poner una fecha «INSS vigente desde» (vacío = desde hoy; fecha pasada para planillas de meses anteriores).","Guardar datos. El cambio de régimen queda auditado y exige el permiso de gestión de INSS."]}],"business_rules":["Los datos de planilla del expediente son la FUENTE: la nómina los copia al crear la línea de planilla (la planilla congela un snapshot).","El régimen INSS se maneja con afiliación fechada: cambiarlo a «no cotiza» (al crear o al editar) exige el permiso nomina.inss.manage; ver o editar el resto del perfil no lo exige.","El estado laboral (Activo/Suspendido/Baja) NUNCA se edita a mano: solo cambia por eventos de ciclo de vida (suspender/reintegrar/baja/reingreso), todos auditados y con motivo.","Suspender no quita roles; opcionalmente bloquea el login del usuario y el reintegro lo restituye.","Dar de baja termina asignaciones activas, revoca accesos (roles de puesto + membresías, deshabilita el usuario si no pertenece a otra empresa) y finaliza contratos EMITIDOS; los roles quedan como historial para un eventual reingreso.","El reingreso reactiva la ficha pero NO restituye el acceso automáticamente: se gestiona aparte (provisionar / reset de clave).","Provisionar o resetear el acceso exige que el trabajador tenga al menos una asignación activa.","El complemento de salario es un pago bruto pactado que se procesa aparte de la planilla legal (sin INSS/IR)."],"permissions":["hr.employee.read","hr.employee.create","hr.employee.update","hr.assignment.read","hr.assignment.create","hr.assignment.end","hr.file.manage","nomina.inss.manage","iam.users.create"],"routes":[{"path":"/recursos-humanos/trabajadores","name":"Trabajadores","purpose":"Listado del personal con estado, foto y acceso"},{"path":"/recursos-humanos/trabajadores/nuevo","name":"Nuevo trabajador","purpose":"Alta con datos personales, de planilla y roles"},{"path":"/recursos-humanos/trabajadores/:id","name":"Perfil del trabajador","purpose":"Expediente con datos, contratos, documentos, memorandos e historial"}],"faqs":[{"q":"¿Dónde pongo el salario y si es por día o mensual?","a":"En el perfil del trabajador, pestaña «Datos y roles» → «Datos de planilla»: elegís «Por día (jornal)» o «Mensual» y escribís el monto. La nómina lo copia tal cual."},{"q":"¿Cómo registro que un trabajador no cotiza INSS?","a":"En su perfil, apagá el interruptor «Cotiza INSS» y guardá. Necesitás el permiso de gestión de INSS; el cambio queda auditado y podés fijar desde qué fecha rige."},{"q":"¿Qué pasa con un trabajador cuando lo doy de baja?","a":"Se terminan sus asignaciones, se revoca su acceso al sistema y se finalizan sus contratos vigentes. El expediente queda como historial y puede reingresar más adelante."},{"q":"¿Puedo subir la cédula o el carné del INSS escaneados?","a":"Sí, en la pestaña «Documentos» del perfil (requiere el permiso hr.file.manage). Acepta PDF, JPG o PNG hasta 8 MB."},{"q":"¿Cómo le doy acceso al sistema a un trabajador?","a":"Debe tener al menos una asignación activa; luego se provisiona su usuario desde RRHH. Recibe una contraseña temporal que deberá cambiar al entrar."}]},{"id":"rrhh_contratos","name":"Contratos laborales","icon":"📄","one_liner":"Redacción, emisión, firma, adendas y renovación de contratos, con alertas de vencimiento a nivel empresa.","what_it_does":"Gestiona los contratos laborales de la empresa, para el encargado de RRHH o jurídico. Cada contrato se redacta por caso a partir de una plantilla según el tipo (indefinido, plazo fijo, por obra, por temporada/cosecha, período de prueba, parcial, aprendizaje); el texto es editable mientras está en BORRADOR y queda congelado al EMITIRSE. Después se pueden registrar las firmas de ambas partes (empleador y trabajador), hacer adendas (versiones nuevas del texto) y renovar el contrato encadenándolo al anterior. El roster a nivel empresa muestra todos los contratos y resalta los que están por vencer.","key_features":["Plantillas por tipo de contrato (Nicaragua): indefinido, plazo fijo, obra, temporada, prueba, parcial, aprendizaje","Borrador con texto editable que se congela al emitir","Registro de firmas de empleador y trabajador (física o digital); marca «plenamente firmado» cuando firman ambos","Adendas que crean versiones inmutables del texto, conservando la historia","Renovación encadenada: finaliza el anterior y crea un borrador heredando sus datos","Alertas de contratos por vencer dentro de N días (o ya vencidos)","Anular un contrato (no se borra, queda en el expediente)"],"flows":[{"title":"Crear y emitir un contrato","steps":["En el perfil del trabajador → pestaña «Contratos» → «Nuevo contrato».","Elegir el tipo/caso, el puesto, las fechas y el salario con su período de pago.","El sistema redacta el borrador desde la plantilla; revisar y ajustar el texto.","Tocar «Emitir contrato»: el texto queda congelado (versión 1).","Más adelante, registrar las firmas de ambas partes."],"note":"Los contratos de plazo fijo, temporada, prueba y aprendizaje EXIGEN fecha de fin."},{"title":"Renovar un contrato por vencer","steps":["Recursos Humanos → Contratos → pestaña «Por vencer».","En el contrato a renovar (emitido o finalizado), tocar «Renovar».","Ajustar fechas, salario o puesto si cambian (lo demás se hereda).","Confirmar: el contrato anterior se finaliza y se crea un borrador encadenado al previo."]}],"business_rules":["El texto solo es editable en estado BORRADOR; al EMITIR se congela y se captura la versión 1.","Tipos PLAZO_FIJO, TEMPORADA, PRUEBA y APRENDIZAJE requieren fecha de fin; la fecha de fin no puede ser anterior al inicio.","Una adenda solo se hace sobre un contrato EMITIDO y crea una versión nueva con motivo obligatorio.","El contrato queda «plenamente firmado» solo cuando existen las dos firmas (empleador y trabajador).","Renovar solo aplica a contratos EMITIDO o FINALIZADO; el previo emitido se finaliza al renovar.","Anular no borra el contrato: lo marca ANULADO y permanece en el expediente.","Las alertas de vencimiento listan contratos EMITIDOS con fecha de fin dentro de la ventana (por defecto 30 días) o ya vencidos."],"permissions":["hr.contract.read","hr.contract.manage"],"routes":[{"path":"/recursos-humanos/contratos","name":"Contratos","purpose":"Roster de contratos, firmas, adendas, renovaciones y vencimientos"}],"faqs":[{"q":"¿Puedo cambiar el texto de un contrato después de emitirlo?","a":"No directamente: al emitir se congela. Si necesitás cambios, hacé una adenda (genera una versión nueva) o renová el contrato."},{"q":"¿Cómo sé qué contratos están por vencer?","a":"En Contratos, la pestaña «Por vencer» lista los emitidos con fin dentro de los próximos días y marca cuántos días faltan o si ya vencieron."},{"q":"¿Cómo registro que firmaron el contrato?","a":"En un contrato emitido, tocá «Firmar» y registrá cada parte (empleador y trabajador). Cuando firman ambos, queda marcado como plenamente firmado."}]},{"id":"rrhh_vacaciones","name":"Vacaciones","icon":"🏖️","one_liner":"Saldos por trabajador con acumulación legal de 2.5 días/mes, registro directo de vacaciones y ajustes.","what_it_does":"Lleva el control de vacaciones de cada trabajador como un saldo de días (estilo libro mayor: el saldo es la suma de movimientos), para el encargado de RRHH. Permite definir la política de acumulación (por defecto 2.5 días por mes, 30 al año, según Art. 76 del Código del Trabajo), acumular el mes a todo el personal activo, registrar directamente las vacaciones tomadas (que descuentan días hábiles), ajustar el saldo y consultar el historial. El registro lo hace RRHH directamente, sin doble firma.","key_features":["Política de acumulación configurable (días por mes y tope opcional acumulable)","Acumulación mensual idempotente para todo el personal activo","Registro directo de vacaciones que descuenta días hábiles (excluye domingos y feriados)","Ajuste manual del saldo (cargar saldo inicial, corregir) con motivo obligatorio","Tabla de saldos por trabajador e historial con solicitudes y movimientos","Anular una solicitud restaura el saldo"],"flows":[{"title":"Registrar vacaciones de un trabajador","steps":["Recursos Humanos → Vacaciones.","En la fila del trabajador, tocar «Registrar».","Indicar fecha desde, fecha hasta y un motivo/observación.","Confirmar: el sistema calcula los días hábiles (sin domingos ni feriados) y los descuenta del saldo."],"note":"Si los días hábiles superan el saldo disponible, el registro se rechaza."},{"title":"Acumular el mes a todo el personal","steps":["Recursos Humanos → Vacaciones → tarjeta «Acumular mes».","Elegir año y mes.","Tocar «Acumular»: se acreditan los días de la política a cada trabajador activo.","Si el mes ya se acumuló antes, no se duplica (es a prueba de repeticiones)."]}],"business_rules":["Política por defecto: 2.5 días/mes (30/año), Art. 76 CT; configurable, con tope opcional del saldo acumulable.","La acumulación es idempotente por (trabajador, año, mes): re-ejecutarla no crea movimientos duplicados.","Las vacaciones registradas descuentan días HÁBILES (excluyen domingos y feriados del catálogo nacional y de la empresa).","No se pueden registrar vacaciones si los días hábiles superan el saldo disponible.","La fecha de fin no puede ser anterior al inicio; el rango debe tener al menos un día hábil.","El registro queda APROBADO al crearse (RRHH directo, sin doble firma); anularlo revierte el saldo y marca la solicitud ANULADA.","El ajuste manual exige un motivo y un valor distinto de cero (positivo acredita, negativo descuenta)."],"permissions":["hr.vacation.read","hr.vacation.manage"],"routes":[{"path":"/recursos-humanos/vacaciones","name":"Vacaciones","purpose":"Saldos, política, acumulación, registro y ajustes de vacaciones"}],"faqs":[{"q":"¿Cuántos días de vacaciones acumula un trabajador por mes?","a":"Por defecto 2.5 días por mes (30 al año), según el Art. 76 del Código del Trabajo. Podés cambiarlo en la política de la pantalla de Vacaciones."},{"q":"Al registrar vacaciones, ¿cuenta los domingos y feriados?","a":"No. El sistema descuenta solo los días hábiles del rango, excluyendo domingos y los feriados del calendario."},{"q":"Me equivoqué al registrar unas vacaciones, ¿qué hago?","a":"Abrí el historial del trabajador y anulá la solicitud: el saldo se restaura automáticamente."},{"q":"¿Cómo cargo el saldo inicial de vacaciones de alguien?","a":"Usá «Ajustar» en su fila, poné los días (por ejemplo 30) y un motivo. El ajuste se suma al saldo."}]},{"id":"nomina_periodos","name":"Nómina: Períodos y Planillas","icon":"🧾","one_liner":"Quincenas/catorcenas de planilla con sub-planillas por área, cálculo automático de INSS, IR, séptimo día y horas extra, y exporte legal.","what_it_does":"Es el corazón de la nómina de Nicaragua, usada por el encargado de nómina y los jefes de área. Primero se crea la configuración del año (tasas de ley y tabla del IR) y luego los períodos de pago (primera/segunda quincena, catorcena o mensual). Dentro de cada período se arman planillas (sub-planillas por área o sucursal, marcadas CON o SIN INSS) y en cada planilla se agregan los trabajadores —del expediente de RRHH (autollenado) o manuales—. Al guardar cada línea, el sistema calcula automáticamente todas las casillas legales: salario del período, séptimo día, feriados y domingos laborados, horas extra, subsidio por enfermedad, provisiones de vacaciones y aguinaldo, INSS laboral (7%), IR por tabla progresiva, INSS patronal e INATEC, hasta el neto a pagar y el costo total. Cada planilla pasa por un flujo de borrador → enviada → aprobada y se exporta a Excel y PDF con el formato legal.","key_features":["Configuración del año (tasas Nicaragua + tabla IR de 5 tramos) creada con un clic","Períodos por frecuencia: primera quincena, segunda quincena, catorcena o mensual","Sub-planillas por área/sucursal, marcadas CON o SIN INSS","Agregar trabajadores desde el expediente (autollena cédula, INSS, cargo, salario, régimen) o manualmente","Cálculo automático de todas las casillas legales al guardar o con «Calcular»","Botón «Aplicar asistencia» que trae los días desde la asistencia de campo aprobada","Flujo de planilla: borrador → enviada → aprobada (con quién y cuándo)","Exporte a Excel (.xlsx) y PDF con el formato de la norma INSS"],"flows":[{"title":"Crear el período y su planilla","steps":["Si es la primera vez del año, en Nómina tocar «Crear configuración Nicaragua por defecto».","Tocar «Nuevo período», elegir mes y tipo (quincena/catorcena/mensual); las fechas se sugieren solas.","Crear el período y abrirlo.","Tocar «Nueva planilla», ponerle nombre (p. ej. «Planilla general») y marcar si es con INSS.","Agregar trabajadores con «Agregar» (del expediente o manual)."]},{"title":"Calcular, revisar y aprobar la planilla","steps":["Con la planilla seleccionada, opcional: «Aplicar asistencia» para traer los días desde el campo aprobado.","Ajustar líneas si hace falta (horas extra, otros ingresos, deducciones manuales) — solo en borrador.","Tocar «Calcular» para recalcular todas las líneas.","Tocar «Enviar» (pasa a revisión) y luego «Aprobar» (lo hace el encargado de nómina).","Descargar el XLSX o PDF legal cuando esté lista."],"note":"Las líneas solo se editan o se quitan mientras la planilla está en BORRADOR; al enviarse/aprobarse quedan estables."},{"title":"Agregar un trabajador desde el expediente","steps":["En la planilla, tocar «Agregar» y dejar el modo «Del expediente (RH)».","Buscar y elegir al trabajador (solo personal activo).","El sistema muestra y copia cédula, INSS, género, cargo, salario y si cotiza INSS.","Indicar días del período y días trabajados.","«Agregar y calcular»: la línea queda creada y calculada."]}],"business_rules":["No se pueden crear períodos sin la configuración del año (tasas + tabla IR).","Un período es único por (empresa, año, mes, tipo); el mes debe estar entre 1 y 12.","El IR se calcula anualizando el ingreso por la frecuencia REAL del pago (catorcena ×26, quincena ×24, mensual ×12) sobre la tabla progresiva; si se fija un IR a mano (override) el sistema lo respeta y no lo recalcula.","INSS laboral por defecto 7%; INSS patronal 21.5% (\u003c50 trabajadores) o 22.5% (≥50); INATEC 2%; vacaciones y aguinaldo provisionados al 8.33%.","El séptimo día y los feriados laborados solo aplican a jornaleros (DAILY); los mensuales lo llevan embebido.","Si la planilla es SIN INSS, no se calcula INSS laboral ni patronal ni INATEC para esas líneas.","El expediente de RRHH es la fuente: al agregar por employee_id se autollenan los datos; lo que se envíe explícito manda sobre el expediente.","Las líneas solo se editan/eliminan en planillas en estado DRAFT (borrador).","El flujo de la planilla solo permite enviar desde borrador y aprobar desde enviada/revisada."],"permissions":["nomina.period.read","nomina.period.create","nomina.config.read","nomina.config.manage","nomina.sheet.read","nomina.sheet.create","nomina.sheet.manage","nomina.entry.read","nomina.entry.create"],"routes":[{"path":"/nomina","name":"Nómina","purpose":"Lista de períodos, configuración del año y exportes"},{"path":"/nomina/periodos/:id","name":"Detalle del período","purpose":"Planillas del período, líneas por trabajador y acciones"}],"faqs":[{"q":"¿Por qué no me deja crear un período?","a":"Falta la configuración de nómina del año. En la pantalla de Nómina tocá «Crear configuración Nicaragua por defecto» (carga tasas de ley y la tabla del IR) y luego podrás crear períodos."},{"q":"¿El sistema calcula solo el INSS y el IR?","a":"Sí. Al guardar o tocar «Calcular», cada línea calcula INSS laboral (7%), IR por la tabla progresiva, séptimo día, horas extra, provisiones y los costos patronales hasta el neto a pagar."},{"q":"¿Cómo lleno los días trabajados sin escribirlos a mano?","a":"Usá «Aplicar asistencia»: trae los días desde la asistencia de campo que ya esté consolidada y aprobada del período."},{"q":"¿Qué diferencia hay entre quincena y catorcena para el IR?","a":"El IR se anualiza según la frecuencia real: catorcena se multiplica por 26 y quincena por 24, para que el impuesto del período salga correcto."},{"q":"Ya aprobé la planilla, ¿puedo corregir una línea?","a":"No. Las líneas solo se editan mientras la planilla está en borrador. Una vez enviada o aprobada quedan estables."}]},{"id":"nomina_inss","name":"Régimen INSS del período","icon":"🏛️","one_liner":"Resuelve el vaivén de trabajadores que cotizan un período y al siguiente no, sin mover gente a mano entre planillas CON/SIN INSS.","what_it_does":"Resuelve el «dolor de cabeza» de la nómina, para el encargado de nómina: trabajadores que un período cotizan INSS y al siguiente no. En vez de moverlos a mano entre planillas, el sistema usa la afiliación INSS fechada del expediente (que define desde cuándo cotiza o no) y, por período, materializa la elección de cada trabajador. Con dos acciones —«Resolver» y «Clasificar»— el sistema decide quién va con y sin INSS y mueve cada línea de planilla a la hoja correcta, recalculando. También permite ajustes (override) auditados por período.","key_features":["Lista de la elección INSS de cada trabajador del período (cotiza / no cotiza) con su fuente","«Resolver»: trae la elección de cada uno desde su afiliación vigente","«Clasificar»: mueve cada línea a la planilla CON o SIN INSS correcta y la recalcula","Override por período auditado (poner/quitar INSS a un trabajador con motivo)","Afiliación maestra fechada definida desde el perfil del trabajador"],"flows":[{"title":"Acomodar quién cotiza INSS en un período","steps":["Abrir el período → botón «INSS».","Tocar «Resolver»: el sistema trae la elección de cada trabajador desde su afiliación vigente.","Revisar la tabla (cada uno marcado «Cotiza INSS» o «No cotiza»).","Tocar «Clasificar»: mueve las líneas a la planilla CON/SIN INSS correcta y recalcula.","Si hace falta una excepción, usar «Poner/Quitar INS
