'Generar': aparece el QR y el código","En el aparato, abrir la pantalla de enrolar; escanear el QR o escribir el código y ponerle un nombre","Tocar 'Enrolar dispositivo'; el aparato queda activo y aparece en la lista al cerrar el diálogo"],"note":"El código es de un solo uso y vence pronto: canjealo en el aparato de inmediato."},{"title":"Revocar un dispositivo","steps":["En la lista de Dispositivos, ubicar el aparato Activo","Tocar 'Revocar' y confirmar","El aparato pasa a Revocado y deja de poder operar"],"note":"Revocar del lado del servidor es lo que invalida la identidad; 'olvidar' en el aparato solo borra la identidad local."}],"business_rules":["Generar el código de enrolamiento exige sync.device.enroll y contexto de empresa (X-Company-Id); la sucursal debe estar dentro del alcance del usuario.","Listar y revocar dispositivos exige sync.device.revoke (quien puede revocar, puede listar).","El código de enrolamiento se entrega UNA sola vez y se guarda solo su huella; es de un solo uso y con vencimiento (5 a 120 minutos, por defecto 15).","Canjear el código no requiere sesión (el secreto es el propio código); si está vencido o ya usado, se rechaza y hay que pedir uno nuevo.","El enrolamiento cuenta como la primera conexión del aparato (la 'última conexión' muestra ese momento, no 'nunca').","La clave privada del aparato nunca se envía al servidor; firma los comandos del canal de sync.","Sincronización: cada comando se valida por firma Ed25519 y por alcance (no puede operar fuera de su empresa/sucursal). La idempotencia es por command_id: el mismo comando repetido se marca DUPLICADO; el mismo id con datos distintos se RECHAZA.","Un desfase de reloj extremo del aparato lo manda a cuarentena; los dispositivos revocados o en cuarentena no pueden aplicar comandos.","Todo (crear código, enrolar, revocar, lotes y comandos) queda en la bitácora de auditoría."],"permissions":["sync.device.enroll","sync.device.revoke"],"routes":[{"path":"/dispositivos","name":"Dispositivos","purpose":"Generar códigos de enrolamiento, ver el estado de los aparatos y revocarlos"},{"path":"/enrolar","name":"Enrolar este dispositivo","purpose":"Pantalla (sin sesión) donde el aparato canjea el código/QR para enrolarse"}],"faqs":[{"q":"¿Cómo enrolo un celular?","a":"En la web, Dispositivos → 'Generar código de enrolamiento'. En el celular, abrí la pantalla de enrolar y escaneá el QR o escribí el código. El código es de un solo uso y vence en minutos."},{"q":"El código me dice que es inválido o ya usado.","a":"Es de un solo uso y vence rápido. Pedí uno nuevo desde la web y canjealo de inmediato."},{"q":"¿Qué pasa cuando revoco un aparato?","a":"Deja de poder operar y su identidad queda inválida del lado del servidor. 'Olvidar' desde el aparato solo borra la identidad local; la revocación real se hace en la web."},{"q":"¿Por qué un dispositivo aparece 'En cuarentena'?","a":"Porque su reloj tenía un desfase muy grande al sincronizar. En ese estado no puede aplicar comandos hasta resolverlo."},{"q":"Si subo el mismo dato dos veces sin internet, ¿se duplica?","a":"No. La sincronización es idempotente por comando: el repetido se marca como duplicado y no se vuelve a aplicar."}]},{"id":"chatter","name":"Notas sobre registros (chatter)","icon":"📝","one_liner":"Dejá notas escritas sobre un registro (un préstamo, una cuenta por cobrar, etc.) que quedan para siempre.","what_it_does":"Chatter permite escribir notas humanas sobre un registro del sistema (por ejemplo un préstamo de financiamiento o una cuenta por cobrar). Es la pieza de 'comentarios' del historial unificado de cada registro, que se completa con la bitácora de auditoría y los documentos adjuntos. Las notas son append-only: no se editan ni se borran; para corregir, se escribe otra nota. Lo usa cualquier usuario que necesite dejar contexto o seguimiento sobre un registro concreto.","key_features":["Notas de texto asociadas a un registro (por tipo e id de sujeto)","Append-only: no hay edición ni borrado (coherente con la bitácora)","Listado de notas de un registro, de la más nueva a la más vieja","Acotado a la empresa activa"],"flows":[{"title":"Agregar una nota a un registro","steps":["Desde la pantalla del registro (donde se muestre el chatter), escribir la nota","Guardarla; queda registrada con tu usuario y la fecha","Para corregir algo, escribir una nota nueva (las anteriores no se borran)"],"note":"Las notas son permanentes: no se pueden editar ni eliminar."}],"business_rules":["Leer notas exige chatter.note.read; escribir exige chatter.note.write.","Las notas están acotadas a la empresa activa (X-Company-Id requerido) y se identifican por tipo + id del registro.","Append-only: no existe edición ni borrado de notas."],"permissions":["chatter.note.read","chatter.note.write"],"routes":[{"path":"(sin ruta propia)","name":"Notas / Chatter","purpose":"Se consume embebido en la pantalla de cada registro; expone /chatter/notes/ en el backend"}],"faqs":[{"q":"¿Puedo editar o borrar una nota?","a":"No. Las notas no se editan ni se borran; si algo cambió, escribí una nota nueva."},{"q":"¿Quién ve mis notas?","a":"Los usuarios de la empresa con permiso de lectura de notas (chatter.note.read), sobre ese mismo registro."}]},{"id":"notifications","name":"Notificaciones","icon":"🔔","one_liner":"Avisos in-app (y push) a los usuarios con el rol correcto cuando pasa algo importante.","what_it_does":"El módulo de Notificaciones entrega avisos a los usuarios. Funciona desacoplado: otros módulos (por ejemplo Alertas) publican un evento y este módulo crea un registro de notificación para cada usuario con el rol adecuado. En la fase actual el canal es el registro in-app; el push (FCM) se suma sin tocar el resto. Cada aparato puede registrar su 'token' de notificaciones (Android, iOS o Web) para recibir push. Lo reciben todos los usuarios según sus roles; los administradores lo configuran indirectamente al asignar roles.","key_features":["Avisos dirigidos por rol (no por usuario individual): se notifica a quien corresponde","Registro in-app de cada notificación, con título, cuerpo y datos","Registro de token del dispositivo para push (Android/iOS/Web)","Idempotencia: una sola notificación por evento de origen y destinatario (no se duplican avisos)","Las alertas operativas usan este módulo y avisan solo al abrir o reabrir"],"flows":[{"title":"Registrar el dispositivo para recibir push","steps":["Desde la app/web, registrar el token de notificaciones del aparato (plataforma + token)","El sistema lo guarda asociado a tu usuario y empresa para futuros envíos"],"note":"El registro del token exige el permiso correspondiente y empresa activa."}],"business_rules":["Registrar el token del dispositivo exige notifications.device.register y contexto de empresa.","Las notificaciones se dirigen por rol dentro de la empresa, no a usuarios sueltos.","Idempotencia por clave de deduplicación: no se crean dos notificaciones para el mismo evento de origen y el mismo destinatario.","El envío es un adaptador: hoy el canal es el registro in-app; el push (FCM) se agrega sin cambiar el dominio."],"permissions":["notifications.device.register"],"routes":[{"path":"(sin ruta propia)","name":"Notificaciones","purpose":"Backend transversal; expone /notifications/device-token/ para registrar el aparato"}],"faqs":[{"q":"¿Por qué me llegan algunos avisos y a otros no?","a":"Las notificaciones se mandan por rol: recibís las de los roles que tenés en tu empresa."},{"q":"¿Por qué no me llega push al celular?","a":"Tu aparato debe tener registrado su token de notificaciones. En la fase actual el aviso principal es in-app; el push se habilita por aparte."}]},{"id":"activity","name":"Actividad y tiempo de trabajo","icon":"⏱️","one_liner":"Registra el uso del sistema (sesiones, telemetría de acciones) y las marcas de entrada/salida de trabajo.","what_it_does":"Actividad es una capa transversal de fondo que complementa la bitácora de seguridad con una dimensión de uso y tiempo: registra los dispositivos conocidos por usuario, las sesiones de uso (login a logout) con su duración, telemetría ligera por acción (ruta, método, duración) y las marcas de entrada/salida de trabajo (clock-in/clock-out) con las horas trabajadas, que alimentan a RRHH y nómina. No tiene una pantalla propia en esta área; trabaja por detrás. La aprovechan RRHH, nómina y supervisión; el resto del personal la alimenta al usar el sistema.","key_features":["Dispositivos conocidos por usuario (con etiqueta, plataforma, confianza)","Sesiones de uso con dispositivo, IP, user-agent y duración","Telemetría ligera por acción (no se firma ni encadena, para no afectar rendimiento)","Marcas de entrada/salida de trabajo con horas trabajadas","Una sola sesión de trabajo abierta por usuario y empresa a la vez"],"flows":[{"title":"Marca de entrada/salida de trabajo","steps":["Al iniciar la jornada se registra el clock-in (entrada)","Al cerrar se registra el clock-out (salida)","El sistema calcula las horas trabajadas para RRHH/nómina"],"note":"No puede haber dos jornadas abiertas a la vez por el mismo usuario en la misma empresa."}],"business_rules":["Una única sesión de trabajo abierta por usuario + empresa (restricción del sistema).","La telemetría de acciones es de alto volumen y, a diferencia de la bitácora de auditoría, no se encadena ni se firma.","Las horas trabajadas se calculan a partir de la entrada y la salida.","Es una capa de fundación transversal: no expone pantalla propia en esta área."],"permissions":[],"routes":[{"path":"(sin ruta propia)","name":"Actividad/Tiempo","purpose":"Capa transversal de sesiones, telemetría y horas trabajadas; insumo de RRHH/nómina"}],"faqs":[{"q":"¿Esto reemplaza la bitácora de auditoría?","a":"No. La auditoría es el rastro de seguridad (firmado, encadenado). Actividad mide uso y tiempo, sin firmar, para no afectar rendimiento."},{"q":"¿De dónde salen las horas trabajadas?","a":"De las marcas de entrada y salida (clock-in/clock-out), que el sistema convierte en horas para RRHH y nómina."}]},{"id":"integration","name":"Integración (outbox / inbox)","icon":"🔗","one_liner":"El canal interno por el que los módulos se avisan eventos de forma confiable y sin duplicar.","what_it_does":"Integración es la infraestructura de mensajería entre módulos: cada módulo que produce un evento de negocio lo deja en una 'bandeja de salida' (outbox); los consumidores lo toman desde su 'bandeja de entrada' (inbox) sin procesarlo dos veces (idempotencia). Permite ver el estado de los eventos (pendiente, enviado, reintentos, último error), marcar uno como enviado y reconocer (ack) los de entrada. No tiene pantalla propia en esta área; es la plomería que sostiene cosas como las notificaciones. La consulta el equipo técnico/operación que monitorea la mensajería entre módulos.","key_features":["Bandeja de salida (outbox) de eventos por módulo, con estado y reintentos","Bandeja de entrada (inbox) por consumidor, con idempotencia","Ver eventos filtrando por estado, módulo o tipo","Marcar un evento de salida como enviado","Reconocer (ack) un evento de entrada como procesado o fallido"],"flows":[{"title":"Revisar el estado de los eventos","steps":["Consultar la bandeja de salida filtrando por estado/módulo/tipo de evento","Ver intentos, próximo reintento y último error de cada evento","Marcar como enviado el que corresponda, o reconocer los de entrada"],"note":"El procesamiento de entrada es idempotente: un mismo evento no se procesa dos veces."}],"business_rules":["Ver la bandeja de salida exige integration.outbox.read; marcar como enviado exige integration.outbox.publish.","Ver la bandeja de entrada exige integration.inbox.read; reconocer (procesado/fallido) exige integration.inbox.process.","La salida está acotada a la empresa activa; el procesamiento de entrada es idempotente por evento (no se procesa dos veces)."],"permissions":["integration.outbox.read","integration.outbox.publish","integration.inbox.read","integration.inbox.process"],"routes":[{"path":"(sin ruta propia)","name":"Integración","purpose":"Backend transversal de eventos (outbox/inbox); sostiene la mensajería entre módulos"}],"faqs":[{"q":"¿Para qué sirve esto si no tiene pantalla?","a":"Es la base que permite que los módulos se avisen eventos de forma confiable (por ejemplo, que una alerta genere una notificación) sin duplicar trabajo."},{"q":"¿Qué garantiza la 'idempotencia'?","a":"Que un mismo evento no se procese dos veces, aunque llegue repetido."}]}],"uncertainties":["El kernel de reporting (catálogo de datasets, runs, snapshots, vistas guardadas, exportaciones) está completo en el backend con sus permisos, pero en esta área el frontend de Analítica solo implementa listar workspaces y generar el token de embed; no se vio una pantalla Vue que consuma directamente catalog/runs/snapshots/saved-views (probablemente los consume el tablero embebido externo).","El registro del token de dispositivo para notificaciones push (notifications.device.register) existe en el backend, pero no se ubicó la pantalla Vue concreta que lo invoca dentro de esta área (parece dispararse desde el arranque de la app móvil).","Chatter (notas) y Activity/Integration no tienen ruta propia en el router de esta área; se documentan como módulos transversales por estar listados en el enfoque. El chatter se consume embebido en pantallas de registros de otros módulos.","El módulo 'sync' (carpeta separada de 'sync_engine') solo contiene migraciones; toda la lógica real de dispositivos y sincronización vive en 'sync_engine'.","La pestaña 'Diagnósticos' y ciertas acciones del panel de Diagnóstico se muestran u ocultan según permisos evaluados en el cliente (p. ej. diagnostics.diagnose.read, diagnostics.finding.read); el conjunto exacto visible depende de los permisos del usuario."]}],"concepts":{"concepts":[{"id":"multiempresa","title":"Estructura multiempresa: Holding, Empresa y Sucursal","icon":"🏢","body":"El sistema maneja varias empresas dentro de un mismo grupo usando una jerarquía estricta de tres niveles: Holding (el grupo), Empresa (cada negocio con su RUC y razón social propia) y Sucursal (cada local o punto físico de una empresa). Todo se apoya en una única estructura llamada OrgUnit, donde un Holding no tiene padre, cada Empresa cuelga de un Holding y cada Sucursal cuelga de una Empresa. Esto importa porque cada empresa tiene sus propios datos, usuarios y permisos completamente separados, y el grupo puede compartir un mismo sistema sin mezclar la información. Las empresas pueden tener marca propia (nombre y logo) que se hereda del holding si no se define.","examples":["Holding 'Grupo Cafetalero' con empresas 'Finca La Esperanza', 'Beneficio Central' y 'Comisariato El Trabajador', cada una con sus sucursales","Una empresa sin logo propio muestra automáticamente el del holding en la barra superior","Cada empresa puede activar o desactivar módulos por separado (CompanyModule), salvo los módulos base que siempre están activos"]},{"id":"selector-contexto","title":"Selector de contexto: en qué empresa y sucursal estás trabajando","icon":"🎯","body":"Como un usuario puede tener acceso a más de una empresa o sucursal, al entrar el sistema le pide elegir el contexto en la pantalla 'Elegí tu empresa'. Todo lo que el usuario haga (ventas, asientos, planillas) queda registrado en la empresa y sucursal seleccionadas. El usuario puede elegir una sucursal específica o 'Toda la empresa (sin sucursal)'. Este contexto viaja en cada petición al servidor (cabecera X-Company-Id) y el backend lo exige para casi todas las operaciones, salvo rutas de inicio de sesión y ayuda. Importa porque evita errores graves como registrar una venta en la empresa equivocada.","examples":["La pantalla muestra: 'Tu usuario tiene acceso a más de una. Todo lo que hagás queda en la empresa elegida.'","Opción 'Toda la empresa (sin sucursal)' para tareas a nivel de empresa completa","Si una petición no trae el contexto de empresa, el sistema la rechaza (excepto login, 2FA y documentación)"]},{"id":"rbac-permisos","title":"Seguridad y permisos por rol (RBAC) con alcance por empresa o sucursal","icon":"🔐","body":"Lo que cada usuario puede hacer se controla con permisos (por ejemplo 'inventory.read'), que se agrupan en roles (administrador, cajero, encargado de bodega, recursos humanos). A cada usuario se le asigna un rol con un alcance: si se asigna a la Empresa aplica a todas sus sucursales, y si se asigna a una Sucursal aplica solo a esa. El sistema calcula los 'permisos efectivos' combinando los roles del usuario en el contexto elegido. Importa porque si una opción no aparece o el sistema responde 'no autorizado', es porque el usuario no tiene ese permiso en ese alcance; un administrador puede ajustarlo. Las asignaciones se pueden revocar sin borrar y guardan quién las otorgó.","examples":["Un cajero con rol asignado solo a la sucursal 'Mercado Oriental' no puede operar en otras sucursales","Roles típicos: administrador de empresa, cajero, encargado de bodega, recursos humanos","Pantallas en modo consulta: 'Estás en modo consulta: tu rol puede ver la asistencia pero no marcarla.'"]},{"id":"auditoria","title":"Auditoría y bitácora: trazabilidad con cadena de hashes y firma","icon":"📜","body":"Cada acción importante queda registrada en una bitácora inmutable (AuditEvent) que guarda quién la hizo, cuándo, desde qué dispositivo, qué cambió (antes y después) y desde qué empresa. Para garantizar que nadie altere el historial, cada evento se sella con un hash SHA256 de su contenido y una firma HMAC, y se encadena al evento anterior de la misma empresa (como una cadena de bloques). Existe un verificador que recalcula los hashes y detecta cualquier manipulación, evento faltante o ruptura de la cadena. Importa porque da confianza legal y de auditoría: el sistema puede demostrar que el registro no fue alterado.","examples":["Cada empresa tiene su propia cadena de auditoría (partición 'COMPANY:\u003cid>'); los eventos del sistema van en la partición 'SYSTEM'","El verificador reporta errores como EVENT_HASH_MISMATCH, SIGNATURE_MISMATCH o CHAIN_DISCONNECTED si alguien manipuló datos","Cada evento guarda actor, dispositivo, IP, si fue en modo offline, ruta y metadatos"]},{"id":"separacion-funciones","title":"Separación de funciones: quien crea no aprueba","icon":"✅","body":"El sistema aplica control anti-fraude separando funciones incompatibles. Por un lado, el flujo maker-checker (solicitante-aprobador): una operación sensible la solicita un usuario (maker) y la debe aprobar un segundo usuario distinto (checker) que tenga el permiso requerido en ese alcance; el sistema bloquea explícitamente que la misma persona se apruebe a sí misma. Por otro lado, una matriz de reglas de segregación (SegregationRule) define combinaciones de permisos que no deberían coexistir, y el sistema detecta violaciones de dos formas: por concesión (un usuario tiene ambos permisos peligrosos) y por ejercicio (un usuario realmente realizó ambas acciones según la bitácora). Cada hallazgo (ControlFinding) se gestiona con un flujo de revisión. Importa porque previene que una sola persona controle todo un proceso crítico.","examples":["Error 'SOD_SELF_APPROVAL' cuando un usuario intenta aprobar su propia solicitud","Regla tóxica: el mismo usuario no debería poder crear un proveedor y autorizar el pago","Hallazgos con severidad Baja/Media/Alta/Crítica y estados Abierto, Reconocido, Resuelto, Descartado"]},{"id":"offline-sync","title":"Trabajo sin internet, sincronización y dispositivos móviles","icon":"📲","body":"El sistema está pensado para funcionar sin conexión continua (offline-first), útil en fincas, beneficios y rutas sin buena señal. Un dispositivo móvil primero se enrola con un código de un solo uso (que puede ir en un QR) y recibe una identidad criptográfica (llave Ed25519). En campo, el dispositivo guarda las operaciones localmente y luego las sincroniza por lotes; el servidor valida la firma de cada comando, controla que pertenezca a la empresa/sucursal correctas y aplica idempotencia para no duplicar (cada comando se aplica una sola vez aunque se reenvíe). Cada operación recibe un estado: Aplicado, Duplicado o Rechazado. Importa porque permite vender, capturar asistencia o recibir café aunque se caiga el internet, sin perder datos ni duplicarlos.","examples":["Enrolar un teléfono con un código QR de un solo uso desde la pantalla de Dispositivos","Marcar asistencia del día en campo y consolidarla luego cuando hay señal","Estados de sincronización por comando: APPLIED, DUPLICATE, REJECTED; un dispositivo se puede revocar o poner en cuarentena"]},{"id":"nicaragua","title":"Contexto Nicaragua: córdoba, RUC y deducciones de ley (INSS, IR, INATEC)","icon":"🇳🇮","body":"El sistema está adaptado a la legislación nicaragüense. La moneda funcional por defecto es el córdoba (NIO) y las empresas guardan su RUC (tax_id). La nómina calcula automáticamente las deducciones y costos de ley con tasas configurables sin tocar el código: INSS laboral (7% al trabajador), INSS patronal (21.5% para empresas con menos de 50 trabajadores y 22.5% para 50 o más), INATEC (2%) e IR laboral con tabla progresiva por tramos. También maneja subsidio por enfermedad del INSS, séptimo día, feriados y régimen de afiliación INSS por empleado. Importa porque las planillas, recibos y reportes salen correctos según la ley nicaragüense sin cálculos manuales.","examples":["INSS laboral 7%, INSS patronal 21.5% (\u003c50 trabajadores) o 22.5% (>=50), INATEC 2%","IR laboral por tramos progresivos, anualizado según la frecuencia real (quincenal, catorcenal, mensual)","Planillas 'CON INSS' y 'SIN INSS', y planilla de complemento de salario por convenio personal","Subsidio de enfermedad: la empresa paga los primeros días al 100% y el INSS cubre 60% desde el día siguiente"]},{"id":"multimoneda-fx","title":"Multimoneda y tipo de cambio (FX)","icon":"💱","body":"Aunque la moneda base suele ser el córdoba (NIO), el sistema soporta varias monedas. Cada empresa define su moneda funcional y registra tipos de cambio fechados (FxRate) por tipo (cierre, spot, promedio) entre pares de monedas, por ejemplo USD a NIO. Las líneas contables guardan su moneda y el tipo de cambio aplicado, y existe un proceso de revaluación (RevaluationRun) para ajustar saldos en moneda extranjera al cierre. En nómina, por ejemplo, un salario pactado en dólares se convierte a córdobas con el tipo de cambio del período. Importa porque permite operar con clientes, proveedores o salarios en distintas monedas y mantener la contabilidad consistente.","examples":["Tipo de cambio USD→NIO registrado por fecha y tipo (CLOSING/SPOT/AVERAGE) por empresa","Salario base en USD convertido a NIO usando el exchange_rate del período de planilla","Proceso de revaluación mensual de saldos en moneda extranjera al cierre"]},{"id":"intercompania","title":"Operaciones entre empresas del grupo (intercompañía)","icon":"🔗","body":"Las empresas del grupo son independientes pero pueden estar interrelacionadas. El sistema permite declarar vínculos entre dos empresas del mismo holding (IntercompanyRelationship: contabilidad, inventario, cuentas por cobrar o por pagar). Cuando una empresa le vende o suministra a otra del grupo, el sistema registra ambas patas con una referencia común: genera el asiento en cada empresa y crea la cuenta por cobrar en una y la cuenta por pagar en la otra, de modo que al consolidar el grupo esas operaciones se eliminan y no se infla el resultado. Esto requiere autorización explícita entre empresas (CompanyLink más un permiso de escritura intercompañía). Importa porque refleja correctamente las operaciones del grupo sin contar dos veces lo mismo.","examples":["El comisariato vende a crédito a trabajadores de la finca; la finca prestó sacos al beneficio","Una operación entre empresa A y B genera CxC en A y CxP en B con una referencia común","La consolidación del grupo elimina automáticamente las operaciones intercompañía"]},{"id":"asistente-conocimiento","title":"Asistente y base de conocimiento que busca en el manual","icon":"🤖","body":"El sistema incluye un asistente que responde preguntas buscando en la documentación interna (este manual y los textos de cada módulo). La búsqueda es determinista y funciona siempre, usando un índice de texto completo en español (entiende variantes de una palabra: 'cierres' encuentra 'cierre'); muestra el fragmento del manual y su fuente. Además, el asistente puede responder con datos reales del sistema, pero siempre dentro de la empresa del usuario y respetando sus permisos: el componente de IA solo elige una consulta segura de un catálogo permitido, nunca escribe consultas libres, y cada consulta vuelve a validar permiso y alcance. La redacción con IA es opcional y se puede apagar. Importa porque el usuario obtiene ayuda contextual y datos sin riesgo de ver información que no le corresponde.","examples":["Preguntar con palabras clave del tema: 'abrir caja', 'registrar empleado', 'régimen INSS', 'orden de compra'","El asistente muestra el fragmento del manual y de dónde salió (su fuente)","Si la IA está habilitada, redacta una respuesta corta con citas; si no, igual muestra los resultados del manual"]}],"uncertainties":["El catálogo concreto de roles predefinidos (nombres exactos) vive en rbac/seed_v01.py, que no leí en detalle; los roles citados (administrador, cajero, bodega, RH) provienen del manual existente y son ilustrativos.","Las tasas de nómina (INSS 7%/21.5%/22.5%, INATEC 2%) son los valores por defecto en el código (NominaConfig); son configurables por año y empresa, por lo que un despliegue real podría tener otras vigentes.","No verifiqué el detalle del frontend del selector de contexto más allá de SelectContextPage.vue y la cabecera X-Company-Id en iam/context.py; el almacenamiento del contexto (context.store) se infiere del uso en la página."]},"roles":{"model_summary":"Necktral ERP usa un modelo de control de acceso basado en roles (RBAC). Cada permiso es una capacidad atomica con formato dominio.recurso.accion (por ejemplo billing.invoice.create). Un rol es simplemente un conjunto de permisos con nombre (tablas Role -> RolePermission -> Permission). A un usuario se le asignan uno o varios roles, asi que sus permisos efectivos son la union de todos los permisos de sus roles. Una persona puede combinar roles (por ejemplo un cajero que ademas es supervisor de campo). El acceso siempre depende del alcance (scope): la asignacion de rol (RoleAssignment) se hace sobre una unidad organizativa que es EMPRESA (COMPANY) o SUCURSAL (BRANCH), de modo que un mismo rol puede valer solo para una sucursal o para toda la empresa. La asignacion guarda trazabilidad de su origen (MANUAL, POSITION = derivada del puesto/cargo del empleado, o SYSTEM = creada en el arranque del sistema) y puede revocarse desactivandola sin borrar el historial. El catalogo se carga con una semilla idempotente (seed_rbac_v01) que no borra nada existente. Sobre esto opera la separacion de funciones (SoD): el modulo de Controls define reglas que marcan combinaciones peligrosas de permisos en la misma persona (por ejemplo quien crea facturas no debe poder anularlas, quien crea empleados no debe aprobar la planilla, quien arma la planilla no la aprueba). Muchos flujos sensibles estan partidos en maker (solicita/registra) y checker (aprueba), y permisos muy sensibles (apagar la IA, postear/cerrar contabilidad, castigar cartera, desembolsar) se reservan a roles de alto nivel para sostener esa segregacion.","roles":[{"key":"company_admin","name":"Administrador de la empresa","description":"Para el dueno o administrador general dentro de una empresa. Es el rol con mas alcance: gobierna roles y permisos, la organizacion, el personal y ve todos los reportes; tambien administra los verticales completos (estacion, flota, comisariato, financiamiento).","can_do":["Crear empresas y sucursales, y habilitar o deshabilitar modulos","Administrar roles, permisos y asignaciones de roles a usuarios (RBAC)","Crear usuarios y gestionar todo el personal, contratos, vacaciones y expedientes","Operar y aprobar facturacion, inventario, compras, caja y contabilidad de punta a punta","Aprobar planillas y asistencia de campo, cerrar periodos y el ejercicio anual","Ver y exportar todos los dashboards, reportes y la auditoria, y gobernar el kill switch de la IA"],"modules":["Organizacion","RBAC/Seguridad","RRHH","Nomina","Facturacion","Inventario","Compras","Caja y Pagos","Contabilidad","Reportes y Dashboards","Controls/SoD","Finca","Flota","Comisariato","Estacion (Fuel)","Financiamiento","Diagnostico/IA","Auditoria"]},{"key":"branch_manager","name":"Gerente de sucursal","description":"Para el responsable de una sucursal. Administra la operacion diaria de su sucursal (inventario, ventas, caja, nomina operativa) sin tocar la administracion de roles ni la configuracion global de la empresa.","can_do":["Ver y actualizar datos de su sucursal y de los empleados que ahi trabajan","Gestionar inventario: items, bodegas, movimientos, transferencias y conteos fisicos","Crear y emitir documentos de facturacion y manejar la caja (abrir/cerrar, reembolsos y reaperturas)","Llevar la nomina operativa de la sucursal y revisar la asistencia de campo","Aprobar y postear asientos contables operativos y ver reportes y dashboards"],"modules":["Organizacion","RRHH","Inventario","Facturacion","Caja y Pagos","Nomina","Contabilidad","Reportes","Estacion (Fuel)","Comisariato","Flota","CEC"]},{"key":"hr_manager","name":"Gerente de Recursos Humanos","description":"Para quien dirige RRHH. Gestion completa del personal y su informacion laboral, incluido el regimen de INSS, pero sin administrar roles del sistema.","can_do":["Crear y actualizar puestos y mapear puestos a roles","Crear y actualizar empleados y sus asignaciones laborales","Gestionar contratos, vacaciones y el expediente documental","Crear usuarios del sistema para los empleados","Administrar la afiliacion y eleccion de regimen INSS por periodo"],"modules":["RRHH","Nomina (INSS)","Organizacion (lectura)"]},{"key":"hr_clerk","name":"Auxiliar de Recursos Humanos","description":"Para el personal operativo de RRHH. Hace altas, bajas y edicion de empleados y maneja documentos, pero no administra roles ni el regimen INSS.","can_do":["Ver puestos y registrar empleados nuevos","Actualizar datos de empleados y crear o finalizar asignaciones laborales","Ver contratos y vacaciones","Adjuntar y administrar documentos del expediente"],"modules":["RRHH"]},{"key":"auditor","name":"Auditor","description":"Para auditoria interna o externa. Acceso de solo lectura a auditoria, reportes financieros, contabilidad y hallazgos de control; no opera nada.","can_do":["Leer el log de auditoria","Ver reportes financieros (balance de comprobacion, mayor, estado de resultados)","Ver asientos, periodos, catalogo contable y consolidaciones (solo lectura)","Ver datasets, dashboards, la matriz SoD y los hallazgos de control"],"modules":["Auditoria","Contabilidad (lectura)","Reportes","Controls/SoD (lectura)","CEC (lectura)"]},{"key":"controls_officer","name":"Oficial de control interno","description":"Para el encargado de control interno y anti-fraude. Gestiona las reglas de separacion de funciones (SoD) y los hallazgos de control.","can_do":["Ver y administrar la matriz y las reglas de separacion de funciones (SoD)","Ver hallazgos de control, correr los detectores y resolver hallazgos","Leer el log de auditoria"],"modules":["Controls/SoD","Auditoria"]},{"key":"warehouse_manager","name":"Jefe de bodega","description":"Para el responsable de inventario y bodegas. Gestiona items, lotes y movimientos de inventario, incluidas entradas, salidas, ajustes y transferencias.","can_do":["Crear items y consultar bodegas y lotes","Registrar entradas, salidas y ajustes de inventario","Registrar transferencias entre almacenes y ver balances","Ver y reconocer alertas de stock y escribir notas en registros"],"modules":["Inventario","Alertas","Chatter"]},{"key":"warehouse_operator","name":"Operador de bodega","description":"Para el personal de piso de bodega. Consulta inventario y mayoriza movimientos, sin crear items ni hacer ajustes de fondo.","can_do":["Ver items, bodegas, lotes y movimientos de inventario","Registrar/mayorizar movimientos de inventario"],"modules":["Inventario"]},{"key":"sales_manager","name":"Gerente comercial","description":"Para la jefatura de ventas. Gestiona clientes, facturacion comercial y listas de precios especiales por cliente o segmento.","can_do":["Crear y actualizar clientes","Crear, emitir y anular facturas","Administrar listas de precios (tramos y asignaciones)"],"modules":["Facturacion","Clientes","Listas de precios","Reportes (lectura)"]},{"key":"sales_rep","name":"Vendedor","description":"Para el vendedor de campo o mostrador. Consulta clientes y crea facturas, sin poder emitirlas ni anularlas.","can_do":["Ver clientes","Ver y crear facturas (borrador)"],"modules":["Facturacion","Clientes (lectura)"]},{"key":"cashier","name":"Cajero","description":"Para el cajero del punto de venta. Factura y cobra en caja, opera la sesion de caja y el POS minorista; las acciones sensibles (reembolso, reapertura) las solicita pero no las aprueba (SoD).","can_do":["Crear, emitir e imprimir documentos de facturacion","Abrir y cerrar la sesion de caja y registrar movimientos de caja","Operar el POS minorista (tickets, checkout, anulacion de ticket)","Vender a credito en el comisariato","Solicitar reembolsos y reaperturas de caja (no los aprueba)"],"modules":["Facturacion","Caja y Pagos","Retail POS","Comisariato"]},{"key":"billing_manager","name":"Gerente de facturacion","description":"Para quien dirige facturacion y la parte contable asociada. Maneja documentos fiscales, contingencias y el ciclo contable de ventas y compras.","can_do":["Crear, emitir y anular documentos de facturacion y gestionar configuracion fiscal por sucursal","Registrar y resolver contingencias fiscales e imprimir documentos","Aprobar, postear y reversar asientos contables y manejar tasas FX y catalogo contable","Operar intercompany (registrar, conciliar, disputar, liquidar)","Crear, postear y anular documentos de compra"],"modules":["Facturacion","Contabilidad","Compras","CEC","Caja (lectura)","Integracion"]},{"key":"procurement_manager","name":"Gerente de compras","description":"Para el responsable de abastecimiento. Maneja el ciclo de compras completo: requisiciones, ordenes, recepciones, 3-way match, precios por proveedor y reorden.","can_do":["Crear, postear y anular documentos de compra","Crear, enviar, aprobar, enviar al proveedor, recibir y cerrar ordenes de compra","Aprobar requisiciones y registrar facturas fuera de tolerancia (match override)","Gestionar precios acordados por proveedor y ver sugerencias de reorden","Aprobar y postear asientos contables relacionados a compras"],"modules":["Compras","Contabilidad (compras)","CEC","Inventario (recepciones)"]},{"key":"payroll_manager","name":"Planillero (encargado de nomina)","description":"Para quien arma la planilla y la asistencia de campo (rol maker). Configura, calcula y arma la nomina y solicita su aprobacion, pero no la aprueba el mismo (SoD anti autoaprobacion).","can_do":["Configurar nomina (tasas, tabla IR) y crear periodos de planilla","Armar, calcular y enviar planillas y planillas de complemento","Capturar y consolidar la asistencia de campo y aplicarla a la planilla","Solicitar la aprobacion del periodo y de la asistencia (maker)","Gestionar el regimen INSS por periodo"],"modules":["Nomina","Asistencia de campo"]},{"key":"field_supervisor","name":"Supervisor de campo","description":"Para el jefe de campo que revisa y aprueba la asistencia de cuadrillas (rol checker). Aprueba lo que captura el planillero, sosteniendo la separacion de funciones.","can_do":["Ver la asistencia de campo y los periodos de planilla","Aprobar la asistencia de campo (checker)","Aprobar el periodo de ion (Fuel)","Retail POS"]},{"key":"fuel_auditor","name":"Auditor de Estacion","description":"Para auditar la estacion. Solo lectura de la operacion (turnos, ventas, precios, tanques, conciliaciones) y reportes.","can_do":["Ver turnos, despachos, ventas, precios y tanques","Ver conciliaciones y el outbox de la estacion","Ver reportes de la estacion"],"modules":["Estacion (Fuel) (lectura)","Reportes"]},{"key":"fleet_manager","name":"Gerente de flota","description":"Para quien dirige la flota de vehiculos. Configuracion y analisis completos: activos, conductores, documentos, planes de mantenimiento y costos.","can_do":["Crear y editar activos de flota y conductores","Registrar documentos y configurar tipos, planes y reglas de mantenimiento","Registrar lecturas de odometro/horometro","Registrar y ver costos (combustible, mantenimiento, gastos)"],"modules":["Flota / Mantenimiento"]},{"key":"fleet_supervisor","name":"Supervisor de flota","description":"Para el supervisor que recibe alertas y gestiona planes y documentos de la flota, sin crear los activos.","can_do":["Ver activos y gestionar conductores y documentos","Gestionar mantenimiento (planes, reglas) y registrar lecturas de medidor","Registrar y ver costos de la flota","Ver y reconocer alertas y escribir notas en registros"],"modules":["Flota / Mantenimiento","Alertas","Chatter"]},{"key":"fleet_mechanic","name":"Mecanico de flota","description":"Para el mecanico que ejecuta mantenimientos y atiende defectos.","can_do":["Ver activos y el catalogo/planes de mantenimiento","Ver documentos de la flota","Registrar y ver costos de mantenimiento"],"modules":["Flota / Mantenimiento"]},{"key":"fleet_driver","name":"Conductor","description":"Para el conductor que hace checklists y reportes de campo desde la app.","can_do":["Ver los activos asignados","Registrar lecturas de odometro/horometro","Registrar su dispositivo para notificaciones y ver costos del activo"],"modules":["Flota (app de campo)","Notificaciones"]},{"key":"f   for(const a of DATA.areas){
    const head=mk(a.icon||"📁",a.area_title,null,"area:"+a.area_id);
    const chev=el("span",{class:"chev"},"▶"); head.append(chev);
    const children=el("div",{class:"nav-children"});
    for(const m of (a.modules||[])){
      const c=el("div",{class:"nav-link","data-nav":"mod:"+a.area_id+":"+m.id,onclick:(e)=>{e.stopPropagation();go({view:"module",areaId:a.area_id,moduleId:m.id});}},el("span",{class:"em"},m.icon||a.icon||"•"),el("span",{},m.name));
      children.append(c);
    }
    head.addEventListener("click",()=>{
      const willOpen=!head.classList.contains("open");
      $$(".nav-children.show").forEach(x=>{if(x!==children){x.classList.remove("show");x.previousSibling&&x.previousSibling.classList.remove("open");}});
      head.classList.toggle("open",willOpen);children.classList.toggle("show",willOpen);
      go({view:"area",areaId:a.area_id});
    });
    gA.append(head);gA.append(children);
  }
  menu.append(gA);

  // Reference
  const gR=el("div",{class:"nav-group"});
  gR.append(el("div",{class:"grp-label"},"Referencia"));
  gR.append(mk("🧩","Conceptos clave",()=>go({view:"concepts"}),"concepts"));
  gR.append(mk("👥","Roles y permisos",()=>go({view:"roles"}),"roles"));
  gR.append(mk("🔎","Notas técnicas",()=>go({view:"notes"}),"notes"));menu.append(gR);
}

function setActiveNav(){
  $$(".nav-link").forEach(n=>n.classList.remove("active"));
  let key="";
  if(state.view==="home")key="home";
  else if(state.view==="start")key="start";
  else if(state.view==="map")key="map";
  else if(state.view==="concepts")key="concepts";
  else if(state.view==="roles")key="roles";
  else if(state.view==="notes")key="notes";
  else if(state.view==="area")key="area:"+state.areaId;
  else if(state.view==="module")key="mod:"+state.areaId+":"+state.moduleId;
  const node=$(`[data-nav="${CSS.escape(key)}"]`);
  if(node)node.classList.add("active");
  if(state.view==="module"||state.view==="area"){
    // open parent area group
    const head=$(`[data-nav="area:${CSS.escape(state.areaId)}"]`);
    if(head){head.classList.add("open");const ch=head.nextSibling;ch&&ch.classList&&ch.classList.add("show");}
  }
}

/* ---- Router ---- */
function go(s){
  Object.assign(state,{areaId:null,moduleId:null},s);
  closeSidebar();
  render();
  window.scrollTo({top:0,behavior:"instant"});
  const hash = s.view==="module"?`module/${s.areaId}/${s.moduleId}`:(s.view==="area"?`area/${s.areaId}`:s.view);
  history.replaceState(null,"","#"+hash);
}
function fromHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(!h)return {view:"home"};
  const p=h.split("/");
  if(p[0]==="module"&&p[1]&&p[2])return{view:"module",areaId:p[1],moduleId:p[2]};
  if(p[0]==="area"&&p[1])return{view:"area",areaId:p[1]};
  if(["home","start","map","concepts","roles","notes"].includes(p[0]))return{view:p[0]};
  return{view:"home"};
}

/* ---- Renderers ---- */
function setCrumbs(parts){ $("#crumbs").innerHTML = parts.map((p,i)=>i===parts.length-1?`<b>${esc(p)}</b>`:esc(p)).join(" › "); }

function render(){
  const main=$("#main");main.innerHTML="";
  let node;
  switch(state.view){
    case "start": node=viewStart();break;
    case "map": node=viewMap();break;
    case "concepts": node=viewConcepts();break;
    case "roles": node=viewRoles();break;
    case "notes": node=viewNotes();break;
    case "area": node=viewArea(state.areaId);break;
    case "module": node=viewModule(state.areaId,state.moduleId);break;
    default: node=viewHome();
  }
  main.append(node);
  setActiveNav();
}

/* interactive stepper */
function flowEl(f,openByDefault){
  const flow=el("div",{class:"flow"});
  const body=el("div",{class:"fl-body"});
  const steps=f.steps||[];
  let idx=0;
  const stepper=el("div",{class:"stepper"},steps.map(()=>el("div",{class:"dot"})));
  const numEl=el("div",{class:"num"},"1");
  const txtEl=el("div",{class:"txt"});
  const sv=el("div",{class:"step-view"},numEl,txtEl);
  const prev=el("button",{class:"btn",onclick:()=>{idx=Math.max(0,idx-1);paint();}},"‹ Anterior");
  const next=el("button",{class:"btn primary",onclick:()=>{idx=Math.min(steps.length-1,idx+1);paint();}},"Siguiente ›");
  const pos=el("div",{class:"pos"});
  const ctrls=el("div",{class:"step-ctrls"},prev,next,pos);
  function paint(){
    numEl.textContent=idx+1;
    txtEl.textContent=steps[idx]||"";
    pos.textContent=`Paso ${idx+1} de ${steps.length}`;
    prev.disabled=idx===0;next.disabled=idx===steps.length-1;
    $$(".dot",stepper).forEach((d,i)=>d.classList.toggle("done",i<=idx));
  }
  body.append(stepper,sv,ctrls);
  if(f.note)body.append(el("div",{class:"fl-note"},"📌 "+f.note));
  const head=el("div",{class:"fl-head",onclick:()=>{const o=body.style.display!=="none";body.style.display=o?"none":"";head.classList.toggle("collapsed",o);}},
    el("span",{class:"ic"},"▦"),el("h5",{},f.title),el("span",{class:"nsteps"},(steps.length)+" pasos"));
  flow.append(head,body);
  if(!openByDefault)body.style.display="none";
  paint();
  return flow;
}

/* ---- Search ---- */
function buildSearchIndex(){
  const idx=[];
  idx.push({label:"Primeros pasos",sub:"Guía de arranque",go:{view:"start"}});
  idx.push({label:"Mapa del sistema",sub:"Todos los módulos",go:{view:"map"}});
  idx.push({label:"Conceptos clave",sub:"Referencia",go:{view:"concepts"}});
  idx.push({label:"Roles y permisos",sub:"Referencia",go:{view:"roles"}});
  for(const a of DATA.areas){
    idx.push({label:a.area_title,sub:"Área",go:{view:"area",areaId:a.area_id},text:(a.area_summary||"")});
    for(const m of (a.modules||[])){
      const ftext=[m.one_liner,m.what_it_does,(m.key_features||[]).join(" "),(m.faqs||[]).map(q=>q.q+" "+q.a).join(" "),(m.flows||[]).map(f=>f.title).join(" "),(m.permissions||[]).join(" ")].join(" ");
      idx.push({label:m.name,sub:a.area_title,go:{view:"module",areaId:a.area_id,moduleId:m.id},text:ftext});
    }
  }
  for(const c of ((DATA.concepts&&DATA.concepts.concepts)||[]))idx.push({label:c.title,sub:"Concepto",go:{view:"concepts"},text:c.body});
  return idx;
}
let SEARCH_IDX=[];
function runSearch(q){
  q=q.trim().toLowerCase();
  const menu=$("#menu");
  if(!q){menu.dataset.search="";buildNav();setActiveNav();return;}
  const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nq=norm(q);
  const hits=SEARCH_IDX.map(it=>{
    const hayL=norm(it.label),hayS=norm(it.sub),hayT=norm(it.text||"");
    let score=0;
    if(hayL.includes(nq))score+=10;
    if(hayL.startsWith(nq))score+=6;
    if(hayS.includes(nq))score+=2;
    if(hayT.includes(nq))score+=1;
    return {it,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,40);
  menu.innerHTML="";
  const g=el("div",{class:"nav-group"});
  g.append(el("div",{class:"grp-label"},hits.length?`Resultados (${hits.length})`:"Sin resultados"));
  for(const {it} of hits){
    g.append(el("div",{class:"nav-link",onclick:()=>{ $("#search").value=""; runSearch(""); go(it.go); }},
      el("span",{class:"em"},"›"),el("span",{},el("div",{},it.label),el("div",{style:"font-size:11px;color:var(--muted)"},it.sub))));
  }
  menu.append(g);
}

/* ---- chrome ---- */
function closeSidebar(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show");}
function openSidebar(){$("#sidebar").classList.add("open");$("#scrim").classList.add("show");}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("#themeBtn").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("nk_theme",t)}catch(e){}}

function init(){
  buildNav();
  SEARCH_IDX=buildSearchIndex();
  $("#foot-meta").textContent = (DATA.areas.length? DATA.areas.reduce((n,a)=>n+(a.modules||[]).length,0)+" módulos" : "Manual del sistema");
  Object.assign(state,fromHash());
  render();
  $("#menuToggle").addEventListener("click",openSidebar);
  $("#scrim").addEventListener("click",closeSidebar);
  $("#printBtn").addEventListener("click",()=>window.print());
  const saved=(()=>{try{return localStorage.getItem("nk_theme")}catch(e){return null}})();
  applyTheme(saved|| (matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
  $("#themeBtn").addEventListener("click",()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
  let t;$("#search").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>runSearch(e.target.value),120);});
  document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#search")){e.preventDefault();$("#search").focus();}if(e.key==="Escape"){$("#search").value="";runSearch("");closeSidebar();}});
  window.addEventListener("hashchange",()=>{Object.assign(state,{areaId:null,moduleId:null},fromHash());render();});
}
init();
