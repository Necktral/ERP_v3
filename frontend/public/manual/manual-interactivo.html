 es solo informativo. No registra ni modifica nada."},{"q":"¿Por qué el VaR aparece en 0 si hay pérdida esperada?","a":"Cuando la mora es poco probable, en la mayoría de escenarios no hay pérdida; eso no es un error."},{"q":"¿Por qué me da el mismo resultado cada vez?","a":"La simulación usa una semilla fija para ser reproducible; cambiá la semilla para otro escenario."}]},{"id":"financiamiento-configuracion","name":"Configuración de acopio","icon":"⚙️","one_liner":"Define el artículo de café, las bodegas de custodia y liquidación y el tercero prestamista.","what_it_does":"Pantalla de parámetros del vertical, indispensable antes de poder acopiar y liquidar. Aquí el administrador define qué artículo de inventario representa el café acopiado, cuál es la bodega de custodia (café del productor sin liquidar), cuál es la bodega de liquidación (donde entra el café comprado) y qué tercero actúa como prestamista/acreedor de la empresa.","key_features":["Selección del artículo de café (en libras)","Selección de bodega de custodia y bodega de liquidación","Definición del tercero prestamista (acreedor interno)"],"flows":[{"title":"Configurar el acopio","steps":["Abrir Configuración de acopio","Elegir el artículo de café","Elegir la bodega de custodia y la bodega de liquidación","Elegir el tercero prestamista y hacer clic en «Guardar»"]}],"business_rules":["Sin el artículo de café y la bodega de custodia no se puede registrar acopio (FIN_SETTINGS_INCOMPLETE)","Sin la bodega de liquidación no se puede liquidar","Las bodegas y el artículo deben pertenecer a la empresa activa","Si no existe configuración, el sistema crea un tercero prestamista interno con el nombre de la empresa"],"permissions":["financing.settings.manage"],"routes":[{"path":"/financiamiento/configuracion","name":"Configuración de acopio","purpose":"Parámetros de café, bodegas y prestamista del vertical"}],"faqs":[{"q":"¿Qué debo configurar antes de acopiar café?","a":"El artículo de café y la bodega de custodia. Para liquidar, además la bodega de liquidación."},{"q":"¿Para qué sirve el tercero prestamista?","a":"Representa a la empresa como acreedora de los préstamos a productores."}]},{"id":"beneficio","name":"Beneficio de café","icon":"🏭","one_liner":"Transforma el café (pergamino → oro) con recetas de rendimiento y órdenes que controlan la merma y el costo.","what_it_does":"Maneja el beneficiado del café como una transformación de un insumo en un producto con merma. El usuario define recetas que indican el artículo de entrada, el de salida y el rendimiento esperado (porcentaje de libras que sobreviven al trillado/secado), con una tolerancia. Luego crea órdenes de beneficio: al iniciarlas se consume el insumo de bodega con su costo; al cerrarlas se indica el producto realmente obtenido y el sistema reparte todo el costo del insumo entre las libras de salida (costo absorbido: la merma encarece el oro). Si el rendimiento real se sale del rango esperado, se levanta una alerta crítica como control antifraude de báscula.","key_features":["Recetas de transformación con rendimiento esperado y tolerancia","Órdenes con estados: borrador → en proceso → cerrada (o anulada)","Consumo de insumo al iniciar y producción al cerrar, con costo absorbido","Cálculo automático de rendimiento real y merma","Alerta crítica de rendimiento anómalo (control antifraude)","Pantalla de resultado con costo del insumo y costo unitario del producto"],"flows":[{"title":"Crear una receta de transformación","steps":["En Beneficio, pestaña Recetas, clic en «Nueva receta»","Escribir código y nombre","Elegir el artículo insumo (entra) y el artículo producto (sale)","Indicar el rendimiento esperado % y la tolerancia %","Clic en «Crear»"],"note":"El insumo y el producto deben ser artículos distintos; el rendimiento esperado va entre 0 y 100%."},{"title":"Procesar una orden de beneficio","steps":["Pestaña Órdenes, clic en «Nueva orden»","Elegir receta, bodega de entrada, bodega de salida y cantidad de insumo; «Crear»","En la orden en borrador, clic en «Iniciar» (consume el insumo de bodega)","Cuando termina el proceso, clic en «Cerrar» e indicar el producto obtenido","Ver el resultado (rendimiento, merma, costos) con «Resultado»"],"note":"Iniciar y cerrar requieren sucursal activa."}],"business_rules":["La cantidad de insumo y la cantidad producida deben ser positivas (BEN_QTY_INVALID)","La salida no puede superar el insumo consumido (BEN_OUTPUT_EXCEEDS_INPUT)","Solo un borrador se inicia; solo una orden en proceso se cierra (BEN_ORDER_STATE)","Solo se puede anular un borrador: una orden iniciada ya consumió café y debe cerrarse con la salida real","El costo del producto se calcula como costo del insumo dividido entre las libras realmente producidas (costo absorbido)","Si el rendimiento real se desvía de lo esperado más que la tolerancia, se genera alerta crítica YIELD_ANOMALY","El código de la receta y la referencia de la orden son únicos por empresa"],"permissions":["beneficio.order.read","beneficio.order.create","beneficio.order.process","beneficio.recipe.manage"],"routes":[{"path":"/beneficio","name":"Beneficio de café","purpose":"Recetas y órdenes de transformación de café con control de merma y costo"}],"faqs":[{"q":"¿Cómo proceso un lote de café pergamino a oro?","a":"Creá la orden con la receta y la cantidad, hacé clic en «Iniciar» para consumir el insumo y, al terminar, en «Cerrar» indicando el oro obtenido."},{"q":"¿Por qué no puedo anular una orden ya iniciada?","a":"Porque ya consumió café de bodega; lo correcto es cerrarla con la cantidad real producida."},{"q":"¿Qué significa la alerta de rendimiento anómalo?","a":"El rendimiento real salió del rango esperado de la receta; el sistema lo marca como control antifraude para que lo revisen."},{"q":"¿Por qué el oro queda con un costo más alto que el pergamino?","a":"Todo el costo del insumo se reparte entre menos libras de salida; la merma encarece el producto, como en la realidad."}]},{"id":"finca-master","name":"Finca (fincas, lotes y labores)","icon":"🌱","one_liner":"Datos maestros del campo: fincas con su perfil agrícola, lotes de cultivo y catálogo de labores.","what_it_does":"Es la base del manejo de finca. Cada finca es una sucursal de la empresa con un perfil agrícola (departamento, municipio, zona, manzanas, GPS, sede). Dentro de cada finca se definen los lotes de cultivo (código, área en manzanas, variedad, año de siembra) y se administra el catálogo de labores (fertilización, poda, corte, etc.) con su categoría, unidad (jornal, manzana, lata, quintal, hora), si es al destajo y su tarifa. Hay labores globales que vienen del sistema y labores propias de la empresa.","key_features":["Listado de fincas (sucursales) con su perfil agrícola","Edición del perfil de finca: zona, municipio, manzanas, sede principal","Alta y edición de lotes por finca (variedad, área, año de siembra, activo/inactivo)","Catálogo de labores con categoría, unidad, destajo y tarifa; globales o de empresa"],"flows":[{"title":"Editar el perfil de una finca","steps":["En Finca, pestaña Fincas, clic en «Perfil» de la finca","Completar departamento, municipio, zona y manzanas","Marcar si es la sede principal y guardar"]},{"title":"Crear un lote","steps":["Pestaña Lotes, clic en «Nuevo lote»","Elegir la finca, escribir código del lote, nombre, área, variedad y año de siembra","Clic en «Crear lote»"],"note":"El código del lote es único dentro de la finca."},{"title":"Crear una labor","steps":["Pestaña Labores, clic en «Nueva labor»","Escribir código y nombre, elegir categoría y unidad","Indicar si es al destajo y la tarifa por unidad","Clic en «Crear labor»"]}],"business_rules":["Una finca debe ser una sucursal (OrgUnit BRANCH) de la empresa","El código del lote es único por finca","El código de labor es único por empresa; además existen labores globales (sin empresa) que todos pueden usar","Las pestañas Lotes y Labores solo aparecen si el usuario tiene el permiso de lectura correspondiente","Las acciones de crear/editar requieren los permisos de gestión (manage)"],"permissions":["finca.finca.read","finca.finca.manage","finca.plot.read","finca.plot.manage","finca.labor.read","finca.labor.manage"],"routes":[{"path":"/finca","name":"Finca","purpose":"Fincas, lotes y catálogo de labores"}],"faqs":[{"q":"¿Cómo agrego un lote a una finca?","a":"En Finca, pestaña Lotes, «Nuevo lote»: elegí la finca, ponele código, área y variedad y guardá."},{"q":"¿De dónde salen las fincas?","a":"Cada finca es una sucursal de la empresa; se crean en Organización y aquí se les agrega el perfil agrícola."},{"q":"¿Qué diferencia hay entre una labor global y una de empresa?","a":"Las globales vienen del sistema y las puede usar cualquier empresa; las de empresa las creás vos para tu compañía."}]},{"id":"finca-ordenes","name":"Órdenes de trabajo (bitácora)","icon":"🚜","one_liner":"Qué labor se hace en qué lote: planificada, en ejecución y terminada, con jornales e insumos.","what_it_does":"Es la bitácora de campo. Permite planificar y registrar el trabajo agrícola: una labor en un lote, con su temporada, fecha planificada y meta. La orden avanza de Planificada a En proceso y a Hecha, y se le registran los jornales y los insumos. Los insumos pueden ser manuales (se digita el costo) o tomados desde bodega real (descuenta inventario y toma el costo promedio del movimiento). Es la fuente del costo real de cada lote y finca.","key_features":["Alta de orden de trabajo (lote + labor + temporada + meta)","Estados: planificada → en proceso → hecha (o cancelada)","Cierre con cantidad real ejecutada y fecha de terminación","Aplicación de insumos manuales o descontados de bodega","Filtro por estado y listado con jornales por orden"],"flows":[{"title":"Crear una orden de trabajo","steps":["En Órdenes de trabajo, clic en «Nueva orden»","Elegir lote y labor, escribir temporada, fecha planificada y meta","Clic en «Crear orden»"]},{"title":"Avanzar y terminar la orden","steps":["En la orden planificada, clic en «Iniciar»","Cuando se completa el trabajo, clic en «Terminar»","Escribir la cantidad real ejecutada y confirmar"]},{"title":"Aplicar un insumo","steps":["En la orden, clic en «Insumos»","Elegir «Desde bodega» (descuenta stock) o «Manual» (sin inventario)","Completar bodega y artículo, o nombre, unidad y costo según el modo","Escribir la cantidad y clic en «Aplicar insumo»"]}],"business_rules":["La orden de trabajo se ata a un lote que pertenece a la misma finca","Insumo desde bodega: descuenta inventario real y toma el costo promedio del movimiento, sin duplicarlo","Insumo manual: se registra con el costo digitado, sin tocar inventario","El costo de mano de obra del lote se calcula como jornales × tarifa de la labor","Las acciones de crear/avanzar/insumos requieren el permiso de captura (finca.work.capture)","Solo se muestran botones de acción si el usuario tiene permiso"],"permissions":["finca.work.read","finca.work.capture","finca.plot.read","finca.labor.read"],"routes":[{"path":"/finca/ordenes","name":"Órdenes de trabajo","purpose":"Planificar y registrar labores por lote con jornales e insumos"}],"faqs":[{"q":"¿Cómo registro que se hizo una poda en un lote?","a":"Creá la orden con ese lote y la labor de poda, iniciala y, al terminar, registrá la cantidad real ejecutada."},{"q":"¿Cómo cargo los insumos que usé?","a":"Abrí «Insumos» en la orden y elegí desde bodega (descuenta stock) o manual (digitás el costo)."},{"q":"¿De dónde sale el costo de mano de obra del lote?","a":"De los jornales de las órdenes multiplicados por la tarifa de la labor."}]},{"id":"finca-costos","name":"Costos de finca","icon":"💰","one_liner":"Costo real por finca (jornales de planilla + insumos) y su reclasificación al libro contable.","what_it_does":"Muestra el costo real consolidado de una finca, combinando la mano de obra real tomada de la captura de campo/planilla con el costo de los insumos. Se filtra por finca y rango de fechas. Quien tenga permiso puede además contabilizar ese costo al libro mayor, generando un asiento de reclasificación (borrador en el diario) para el período elegido.","key_features":["Reporte de costo real por finca con filtros de finca y fechas","Combina mano de obra desde asistencia de campo más insumos","Contabilización (reclasificación) del costo real al libro mayor"],"flows":[{"title":"Ver el costo real de una finca","steps":["Abrir Costos de finca","Elegir la finca y el rango de fechas (desde / hasta)","Revisar el reporte consolidado"]},{"title":"Contabilizar el costo al libro mayor","steps":["Con una finca seleccionada, clic en «Contabilizar a GL»","Confirmar en el aviso","El sistema genera el asiento de reclasificación (borrador en el diario)"],"note":"El botón de contabilizar solo aparece con el permiso finca.cost.post."}],"business_rules":["El reporte requiere indicar la finca (es obligatoria)","El costeo real lee la mano de obra de la captura de campo (nómina) y la suma a los insumos","Contabilizar genera un asiento en borrador (best-effort), no afecta directamente saldos definitivos","Ver reportes requiere finca.field.read; contabilizar requiere finca.cost.post"],"permissions":["finca.field.read","finca.report.read","finca.cost.post"],"routes":[{"path":"/finca/costos","name":"Costos de finca","purpose":"Costo real consolidado por finca y su contabilización al GL"}],"faqs":[{"q":"¿Cómo veo cuánto me costó realmente una finca?","a":"En Costos de finca elegí la finca y el rango de fechas; el reporte suma mano de obra real e insumos."},{"q":"¿Qué hace «Contabilizar a GL»?","a":"Genera un asiento de reclasificación del costo real de la finca al libro mayor, como borrador en el diario."}]},{"id":"finca-presupuesto","name":"Presupuesto de finca","icon":"📋","one_liner":"Presupuesto agrícola por labor, lote y ciclo, comparable contra el gasto real.","what_it_does":"Permite planear el gasto agrícola de una finca para un ciclo/temporada. Cada presupuesto tiene líneas por labor y lote con jornales planificados, tarifa e insumos; el total esperado se calcula solo. El presupuesto pasa de borrador a aprobado (con separación de funciones) y luego se puede archivar. La pantalla «Presupuesto vs real» compara, línea por línea, lo presupuestado contra el gasto real del mismo ciclo (jornales × tarifa + insumos) y muestra la variación total.","key_features":["Presupuestos por finca y ciclo, con líneas por labor × lote","Cálculo automático del total planificado (jornales × tarifa + insumos)","Flujo borrador → aprobado → archivado, con separación de funciones al aprobar","Comparativo presupuesto vs real por línea con variación y variación %"],"flows":[{"title":"Crear un presupuesto y sus líneas","steps":["En Presupuesto de finca, clic en «Nuevo presupuesto»","Elegir finca, escribir el ciclo/temporada y un nombre; «Crear»","En el presupuesto en borrador, clic en «Líneas»","Agregar líneas (labor, lote, jornales, tarifa, insumos) y «Guardar líneas»"]},{"title":"Aprobar y comparar contra el real","steps":["En un presupuesto en borrador, clic en «Aprobar» (lo aprueba otra persona)","En cualquier presupuesto, clic en «Vs real»","Revisar la tabla de presupuesto, real y variación por labor/lote y el total"]}],"business_rules":["Solo se pueden editar líneas de un presupuesto en borrador (BUDGET_NOT_DRAFT)","Separación de funciones: quien creó el presupuesto no puede aprobarlo (SOD_SELF_APPROVAL)","Cada línea es única por presupuesto, labor y lote","El total planificado de la línea = jornales × tarifa + monto de insumos","El real se calcula con las órdenes de trabajo del mismo ciclo (season_label): jornales × tarifa + insumos","La labor y el lote de cada línea deben corresponder a la empresa/finca","Crear y editar/aprobar requiere finca.budget.manage; consultar requiere finca.budget.read"],"permissions":["finca.budget.read","finca.budget.manage"],"routes":[{"path":"/finca/presupuesto","name":"Presupuesto de finca","purpose":"Planeación de gasto agrícola por labor/lote/ciclo y comparativo vs real"}],"faqs":[{"q":"¿Cómo armo el presupuesto de una temporada?","a":"Creá el presupuesto con la finca y el ciclo, abrí «Líneas» y agregá cada labor y lote con sus jornales, tarifa e insumos."},{"q":"¿Puedo aprobar mi propio presupuesto?","a":"No. Por separación de funciones debe aprobarlo otra persona."},{"q":"¿Cómo comparo lo planeado contra lo gastado?","a":"Clic en «Vs real»: verás presupuesto, real y variación por labor y lote del mismo ciclo."}]}],"uncertainties":["El frontend de Productores muestra renglones de depósito 'liquidated_lb' y 'available_to_fix_lb' que no coinciden exactamente con las claves que devuelve el backend ('fixed_lb', 'available_lb', 'in_custody_lb'); esos renglones del diálogo de depósito podrían mostrarse vacíos (posible desajuste front/back).","La pantalla de Costos de finca muestra el reporte como JSON crudo (no como tabla formateada); el detalle exacto de campos del reporte real depende de finca_real_cost_summary en field_link.py, que no se leyó en profundidad.","No revisé en detalle accounting_link.py (post_finca_cost_to_accounting) ni inventory_link.py; la descripción de la contabilización como 'asiento borrador best-effort' se basa en los comentarios del código y la vista, no en el cuerpo completo de esas funciones.","El módulo de tasa de cambio (exchange-rates) existe en el backend con permiso financing.rate.manage y se usa en pagos/liquidaciones, pero no tiene una pantalla .vue propia dedicada en esta área; parece administrarse desde otra parte o vía API. No documenté una ruta de UI para tasas.","La gestión del catálogo de calidades de café (POST) usa el permiso financing.settings.manage y la lectura financing.reception.read; no existe una pantalla .vue dedicada a calidades, se asume administración junto con configuración o vía API.","No se leyeron a fondo los serializers.py de cada módulo, por lo que algunas validaciones de formato menores o campos opcionales podrían no estar reflejados."]},{"area_id":"operaciones-estacion-pos-comisariato-flota","area_title":"Operaciones: Estación, POS Retail, Comisariato y Flota","area_summary":"Cubre la operación diaria de campo de la empresa: la estación de servicio (turnos, despachos por bomba, ventas de combustible, tanques y cierres), el punto de venta retail de la estación, el comisariato que vende a crédito a empleados/productores/público con descuento por planilla, y la administración de la flota de vehículos y maquinaria (activos, conductores, costos y mantenimiento). Son los módulos donde se registra lo que pasa en piso: se despacha combustible, se cobra, se carga a cuenta y se controla el estado de los equipos.","icon":"⛽","modules":[{"id":"estacion-servicio","name":"Estación de servicio","icon":"⛽","one_liner":"Maneja el turno del día: despachos por surtidor y sus ventas (interna, empleado o público), con cierre y reporte.","what_it_does":"Es el tablero diario de la estación de combustible. El operador abre un turno, registra cada despacho de diésel o gasolina (volumen en litros o galones, precio, bomba, placa y conductor), y luego factura la venta de cada despacho indicando si es consumo interno, de empleado o al público, y el método de pago. Al terminar la jornada cierra el turno, que deja un reporte de cierre con los totales por producto, por tipo de venta y por método de pago.\n\nCada venta de combustible no es solo un registro: el sistema emite la factura, baja el inventario de combustible y deja todo enlazado. Si una venta se cancela, el sistema la revierte automáticamente (anula la factura y devuelve el inventario). Está pensado para el encargado de la estación y el cajero de pista.","key_features":["Abrir y cerrar el turno del día (solo un turno abierto a la vez por sucursal)","Registrar despachos por bomba con volumen en litros o galones y precio por litro o galón","Facturar la venta de cada despacho (consumo interno / empleado / público; efectivo, transferencia o crédito)","Cancelar una venta con motivo obligatorio y reintentar la reversión si quedó a medias","Preferencias de unidad (litros o galones) por producto, recordadas por usuario","Resumen en vivo del turno: cantidad de despachos, ventas y total facturado"],"flows":[{"title":"Abrir turno y registrar un despacho con su venta","steps":["Entrar a Estación de servicio (/estacion).","Si no hay turno abierto, presionar «Abrir turno».","En la tarjeta Despachos, presionar «Registrar despacho».","Elegir producto (Diésel o Gasolina); la unidad se llena según la preferencia guardada.","Capturar volumen, precio por litro/galón y, si aplica, placa, conductor y número de bomba.","Presionar «Registrar» para guardar el despacho.","En el despacho recién creado presionar «Facturar venta».","Elegir tipo de venta (interna/empleado/público) y método de pago; si es público se puede asociar un cliente de Terceros.","Presionar «Registrar venta». El despacho queda marcado como «Vendido»."],"note":"Un despacho solo puede tener una venta. No se puede despachar ni facturar si el turno está cerrado."},{"title":"Cerrar el turno y ver su reporte","steps":["En Estación de servicio, presionar «Cerrar turno».","Confirmar en el aviso que muestra cantidad de despachos y total de ventas.","Ir a «Turnos» (/estacion/turnos).","Ubicar el turno cerrado y presionar «Reporte» para ver los totales por producto, tipo de venta y método de pago."],"note":"El botón «Reporte» solo aparece para turnos cerrados y con el permiso fuel.reports.view."},{"title":"Cancelar una venta","steps":["En las Ventas del turno, ubicar la venta activa.","Presionar «Cancelar».","Escribir el motivo (mínimo 3 caracteres) y confirmar.","Si la reversión quedó pendiente (estado «Compensación fallida»), presionar «Reintentar»."],"note":"La cancelación anula la factura y devuelve el inventario; el sistema reintenta solo si algo falla."}],"business_rules":["Solo puede haber un turno abierto por sucursal a la vez; abrir de nuevo devuelve el turno ya abierto (idempotente).","No se pueden registrar despachos ni ventas con el turno cerrado.","Un despacho no puede facturarse dos veces (un solo registro de venta por despacho).","Los litros son la unidad canónica: aunque se capture en galones, el sistema convierte y guarda en litros para los cierres y reportes; conserva además lo ingresado tal cual para trazabilidad.","La venta de combustible emite factura y baja inventario en una sola operación; no se bloquea por falta de stock (permite inventario negativo para no detener la pista).","La cancelación dispara una compensación automática (anula factura + reversa inventario) con hasta 5 reintentos y espera creciente; si se agotan queda en «Compensación fallida» para reintento manual.","El motivo de cancelación es obligatorio (mínimo 3 caracteres).","Toda operación (abrir/cerrar turno, despacho, venta, cancelación) queda auditada con el usuario que la hizo.","Cada acción exige seleccionar la sucursal (X-Branch-Id); sin sucursal no se puede operar."],"permissions":["fuel.shift.read","fuel.shift.open","fuel.shift.close","fuel.dispense.read","fuel.dispense.create","fuel.sale.read","fuel.sale.create","fuel.sale.void","fuel.reports.view","fuel.uom_preferences.manage"],"routes":[{"path":"/estacion","name":"Estación de servicio","purpose":"Tablero del turno: abrir/cerrar, registrar despachos y facturar ventas"},{"path":"/estacion/turnos","name":"Turnos de la estación","purpose":"Historial de turnos y reporte de cierre de cada uno"}],"faqs":[{"q":"¿Cómo abro el turno del día?","a":"Entrá a Estación de servicio y presioná «Abrir turno». Solo puede haber un turno abierto por sucursal; si ya hay uno, el sistema te muestra ese."},{"q":"¿Cómo registro una venta de combustible?","a":"Primero registrá el despacho (producto, volumen, precio, bomba) y luego presioná «Facturar venta» sobre ese despacho, eligiendo tipo de venta y forma de pago."},{"q":"¿Puedo capturar en galones aunque el reporte sea en litros?","a":"Sí. Elegí galones en la unidad; el sistema convierte a litros para los totales y guarda lo que ingresaste tal cual."},{"q":"¿Qué pasa si cancelo una venta?","a":"El sistema anula la factura y devuelve el combustible al inventario automáticamente. Si la reversión falla, queda en «Compensación fallida» y podés presionar «Reintentar»."},{"q":"¿Dónde veo el cierre del turno?","a":"En «Turnos», sobre un turno cerrado presioná «Reporte» (necesitás el permiso de reportes)."}]},{"id":"tanques-combustible","name":"Tanques de combustible","icon":"🛢️","one_liner":"Controla el nivel de cada tanque: sube con recepciones, baja con despachos y se corrige con ajustes.","what_it_does":"Lleva el control de existencias de combustible por tanque. Cada tanque tiene un código, producto (diésel o gasolina), capacidad y un nivel de alerta. El nivel se calcula como la suma de movimientos: las recepciones (cuando llega la pipa) suman, los despachos restan automáticamente y los ajustes corrigen diferencias. Muestra el porcentaje de llenado y avisa cuando un tanque está en nivel bajo.\n\nEs un control básico de nivel (sin varillaje ni conciliación de mermas). Cuando se registra un despacho en la estación, si la sucursal tiene un tanque activo de ese producto, el sistema le descuenta los litros solo. Está dirigido al encargado de la estación y a quien recibe combustible.","key_features":["Tarjeta por tanque con nivel actual, porcentaje y alerta de nivel bajo","Crear tanques con código, producto, capacidad y umbral de alerta","Registrar recepciones (litros recibidos, costo opcional, proveedor/pipa y número de documento)","Ajustar el nivel con motivo obligatorio (suma con valor positivo, resta con negativo)","Ver el historial de movimientos de cada tanque","Descuento automático del tanque cuando se despacha combustible en la estación"],"flows":[{"title":"Recibir combustible (llegada de pipa)","steps":["Entrar a Tanques (/estacion/tanques).","En la tarjeta del tanque presionar «Recibir».","Capturar los litros recibidos y, si se tiene, costo por litro, proveedor/pipa y número de documento.","Presionar «Recibir». El nivel del tanque sube y queda el movimiento registrado."],"note":"La recepción no puede exceder la capacidad del tanque ni ser de cero o menos litros."},{"title":"Ajustar el nivel de un tanque","steps":["En la tarjeta del tanque presionar «Ajustar».","Escribir los litros: positivo para sumar, negativo para restar.","Escribir el motivo del ajuste (obligatorio).","Presionar «Aplicar»."],"note":"El ajuste no puede ser cero y siempre exige motivo, para dejar rastro de por qué cambió el nivel."}],"business_rules":["El nivel del tanque es la suma de sus movimientos: recepciones suman, despachos restan, ajustes corrigen.","La recepción debe ser mayor a cero y no puede superar la capacidad del tanque.","El ajuste no puede ser cero y exige motivo escrito.","El descuento por despacho es automático y aditivo: si la sucursal no tiene tanque activo del producto, el despacho no falla, simplemente no afecta tanques.","Un tanque se marca en «Nivel bajo» cuando tiene umbral definido y el nivel actual cae a ese umbral o menos.","Crear o editar un tanque requiere permiso de configuración de la estación (fuel.config.update)."],"permissions":["fuel.tank.read","fuel.tank.receive","fuel.tank.adjust","fuel.config.update"],"routes":[{"path":"/estacion/tanques","name":"Tanques de combustible","purpose":"Niveles, recepciones, ajustes e historial de movimientos por tanque"}],"faqs":[{"q":"¿Cómo registro la llegada de una pipa?","a":"En Tanques, presioná «Recibir» en el tanque correspondiente y capturá los litros recibidos (y opcionalmente costo, proveedor y documento)."},{"q":"¿Por qué no me deja recibir esos litros?","a":"Porque la recepción superaría la capacidad del tanque o los litros son cero o negativos. Verificá el nivel y la capacidad."},{"q":"¿Cómo corrijo una diferencia de nivel?","a":"Usá «Ajustar»: poné el número de litros (negativo para restar) y escribí el motivo. El motivo es obligatorio."},{"q":"¿El tanque baja solo cuando despacho?","a":"Sí, si la sucursal tiene un tanque activo de ese producto el despacho le resta los litros automáticamente."}]},{"id":"cierre-diario-estacion","name":"Cierre diario de la estación","icon":"📊","one_liner":"Consolidado del día de toda la estación: litros/galones despachados y ventas por tipo y por forma de pago.","what_it_does":"Muestra el consolidado de un día completo de la estación (no de un turno suelto). Eligiendo una fecha, presenta los totales por producto en litros y su equivalente en galones, las ventas activas agrupadas por tipo (interna, empleado, público) y por método de pago, los conteos de despachos y ventas, y alertas como ventas canceladas. Es la foto del día para el encargado o el dueño.","key_features":["Selección de fecha para consultar cualquier día","Totales por producto en litros y galones equivalentes","Ventas del día agrupadas por tipo y por método de pago","Conteo de despachos, ventas activas y ventas canceladas","Alertas del día (ventas canceladas y diferencias de monto)"],"flows":[{"title":"Consultar el cierre de un día","steps":["Entrar a Cierre diario (/estacion/reportes).","Elegir la fecha en el campo de fecha.","Revisar el consolidado que aparece (por producto, por tipo de venta y por forma de pago)."],"note":"Por defecto muestra el día actual; cambiar la fecha recarga el reporte."}],"business_rules":["El reporte solo cuenta ventas en estado activo para los totales por tipo y por método de pago.","Las ventas canceladas se reportan aparte como alerta del día.","Los litros son la base del cálculo; el galón equivalente se muestra como referencia.","Ver el cierre diario requiere el permiso fuel.reports.view."],"permissions":["fuel.reports.view"],"routes":[{"path":"/estacion/reportes","name":"Cierre diario de la estación","purpose":"Consolidado diario de despachos y ventas por tipo y método de pago"}],"faqs":[{"q":"¿En qué se diferencia del reporte de turno?","a":"El cierre diario junta todo el día de la sucursal; el reporte de turno es solo de un turno específico. El diario se consulta por fecha."},{"q":"¿Las ventas canceladas suman en los totales?","a":"No. Los totales solo incluyen ventas activas; las canceladas aparecen como alerta aparte."}]},{"id":"pos-retail","name":"Punto de venta (POS Retail)","icon":"🧾","one_liner":"TPV de la estación: abre sesión de caja, genera el ticket sobre el turno de combustible y lo cobra en un paso.","what_it_does":"Es el punto de venta rápido de la estación. El cajero abre una sesión de caja con un fondo inicial, y mientras haya un turno de combustible abierto puede hacer ventas rápidas: elige producto, tipo de venta, forma de pago, volumen y precio, y al presionar «Cobrar» el sistema crea el ticket, registra el despacho, emite la venta, captura el pago y, si es efectivo, lo asienta en la gaveta de caja. Al final del día cierra la sesión declarando el monto contado y el sistema calcula la diferencia contra el fondo.\n\nTambién maneja los tickets que quedaron a medias (por ejemplo si se cortó la conexión durante el cobro): aparecen como «Compensación pendiente» y se pueden reintentar. Está pensado para el cajero de la estación.","key_features":["Abrir sesión de caja (POS) con fondo inicial","Venta rápida en un solo paso: ticket + despacho + venta + cobro","Cobro en efectivo, transferencia o crédito enlazado al turno de combustible","Total estimado en vivo según volumen y precio","Cerrar sesión declarando el efectivo contado y ver la diferencia","Histórico de tickets con estado del cobro y reintento de compensaciones pendientes"],"flows":[{"title":"Abrir sesión y hacer una venta rápida","steps":["Entrar a Punto de venta (/pos).","Si no hay sesión abierta, escribir el fondo inicial y presionar «Abrir sesión POS».","Verificar que haya un turno de combustible abierto (si no, abrirlo en Estación de servicio).","En Venta rápida, elegir producto, tipo de venta y forma de pago.","Capturar volumen, unidad y precio; revisar el total estimado.","Presionar «Cobrar». El ticket se crea y cobra de una sola vez."],"note":"Sin un turno de combustible abierto no se puede vender en el POS."},{"title":"Cerrar la sesión de caja","steps":["En Punto de venta, presionar «Cerrar sesión».","Escribir el monto contado en la gaveta.","Confirmar. El sistema cierra la caja y muestra la diferencia respecto al fondo."],"note":"Si la diferencia no es cero, el sistema lo señala como advertencia."},{"title":"Reintentar un ticket pendiente","steps":["Entrar a Tickets (/pos/tickets).","Ubicar el ticket marcado como «Compensación pendiente».","Presionar «Reintentar compensación»."],"note":"Solo aparece para tickets que quedaron a medio cobrar; requiere el permiso de checkout."}],"business_rules":["Solo puede haber una sesión POS abierta por sucursal a la vez; reabrir devuelve la sesión existente (idempotente).","Para cobrar se necesita una sesión POS abierta y un turno de combustible abierto.","El checkout es una saga transaccional: registra despacho, emite venta de combustible, captura el pago y asienta en caja si es efectivo; si algún paso falla el ticket queda en «Cobro pendiente» para reintento.","Los reintentos usan claves de idempotencia por ticket para no duplicar despacho, venta, pago ni movimiento de caja.","Reintento automático hasta 8 veces (configurable) con espera creciente; lo que se agota o se traba queda marcado para atención del operador.","La diferencia de caja al cerrar = monto contado − fondo inicial.","Un ticket solo se puede anular cuando está cerrado; la anulación cancela la venta de combustible y, si fue efectivo, registra un reembolso en caja.","Abrir sesión, cerrar sesión, abrir ticket, cobrar y anular son permisos separados (quien cobra puede no poder anular)."],"permissions":["retail.pos.session.read","retail.pos.session.open","retail.pos.session.close","retail.pos.ticket.read","retail.pos.ticket.open","retail.pos.ticket.checkout","retail.pos.ticket.void","retail.pos.peripherals.read","retail.pos.peripherals.manage"],"routes":[{"path":"/pos","name":"Punto de venta","purpose":"Sesión de caja y venta rápida cobrada en un paso"},{"path":"/pos/tickets","name":"Tickets del POS","purpose":"Histórico de tickets y reintento de compensaciones pendientes"}],"faqs":[{"q":"¿Por qué no me deja cobrar en el POS?","a":"Necesitás tener una sesión POS abierta y un turno de combustible abierto. El turno se abre en Estación de servicio."},{"q":"¿Cómo cierro la caja al final del día?","a":"Presioná «Cerrar sesión», escribí el efectivo contado y confirmá. El sistema te muestra la diferencia contra el fondo inicial."},{"q":"¿Qué significa «Compensación pendiente» en un ticket?","a":"Que el cobro quedó a medias (por ejemplo por una falla momentánea). Entrá a Tickets y presioná «Reintentar compensación»."},{"q":"¿Cobrar dos veces el mismo ticket lo duplica?","a":"No. El sistema usa claves de idempotencia por ticket, así que reintentar no genera doble despacho, doble venta ni doble pago."}]},{"id":"comisariato","name":"Comisariato","icon":"🛒","one_liner":"Tienda de la empresa que vende a crédito a empleados, productores y público, con cobro vía planilla a los empleados.","what_it_does":"Administra las cuentas de crédito de la tienda de la empresa (comisariato). Cada cliente —empleado, productor o público— tiene una cuenta con un límite de crédito y un saldo que vive en la cartera por cobrar. Desde aquí se crean y editan esas cuentas, se hacen ventas a crédito (que facturan, bajan inventario de una bodega y cargan el saldo a la cuenta del cliente en una sola operación) y, para los empleados, se aplican los saldos como deducción en la planilla de nómina.\n\nLa pantalla principal lista las cuentas con su límite, saldo y crédito disponible. La venta a crédito tiene su propia pantalla con selección de cuenta, bodega y artículos. Está dirigido al encargado del comisariato y a quien administra la cobranza por planilla.","key_features":["Listado de cuentas de crédito con límite, saldo vivo y disponible, filtrable por nombre y segmento","Crear/editar cuentas: segmento, límite (o sin tope), empresa que descuenta en planilla, estado y notas","Venta a crédito multi-artículo contra la cuenta del cliente, con factura fiscal opcional","Validación del límite de crédito antes de emitir (rechaza si excede el disponible)","Aplicar los saldos de empleados como deducción en una planilla de nómina, con tope opcional por período","Tres segmentos de cliente: empleado, productor y público"],"flows":[{"title":"Crear una cuenta de crédito","steps":["Entrar a Comisariato (/comisariato).","Presionar «Nueva cuenta».","Elegir el tercero (cliente) y su segmento (empleado/productor/público).","Definir el límite de crédito, o activar «Sin tope de crédito».","Si es empleado, elegir la empresa que le descuenta en planilla.","Marcar la cuenta como activa y guardar."],"note":"El límite en 0 significa «sin crédito»; «Sin tope» significa crédito ilimitado y debe activarse a propósito."},{"title":"Vender a crédito","steps":["Entrar a Venta a crédito (/comisariato/venta).","Elegir la cuenta de crédito (se ve su saldo y disponible) y la bodega que despacha.","Marcar si la factura es fiscal.","Agregar los artículos con cantidad y precio.","Revisar el total; si supera el disponible aparece un aviso.","Presionar «Registrar venta a crédito»."],"note":"Si el total supera el crédito disponible, el backend rechaza la venta sin dejar factura, inventario ni saldo."},{"title":"Aplicar el crédito de empleados a la planilla","steps":["Entrar a Comisariato y presionar «Aplicar a planilla».","Indicar el ID de la planilla de nómina y la empresa del comisariato.","Opcionalmente fijar un tope de descuento por período.","Presionar «Aplicar»."],"note":"Se ejecuta desde la empresa de la planilla; toma los saldos de los empleados y los pone como deducción, abonando la cuenta por cobrar."}],"business_rules":["El saldo no se guarda en la cuenta: se calcula como límite menos la suma de cuentas por cobrar vivas del cliente en esa empresa (misma moneda).","Límite de crédito: NULO = sin tope (ilimitado, hay que activarlo a propósito); 0 = sin crédito; mayor a 0 = tope.","La venta a crédito valida el disponible ANTES de emitir; si lo excede hace rollback total (sin documento, sin inventario, sin saldo) y devuelve «Límite de crédito excedido».","La venta a crédito es idempotente por código de referencia: reentrar no re-cobra ni vuelve a despachar.","La venta exige al menos una línea y cada línea debe apuntar a un artículo de inventario y una bodega.","No se puede vender a una cuenta inactiva ni a una cuenta de otra empresa.","El cobro por planilla cruza al empleado entre empresas usando la cédula como clave (la planilla está en una empresa y la cuenta por cobrar en el comisariato, que tiene RUC propio).","Aplicar a planilla solo funciona sobre planillas editables (borrador o enviada) y es idempotente: omite las líneas que ya tienen descuento de comisariato.","El descuento por empleado se limita al menor entre su saldo, su neto disponible y el tope por período si se indicó.","Crear/editar cuentas, vender y aplicar a planilla son permisos separados (separación de funciones)."],"permissions":["comisariato.read","comisariato.account.manage","comisariato.sell","comisariato.payroll.apply"],"routes":[{"path":"/comisariato","name":"Comisariato","purpose":"Cuentas de crédito de la tienda y aplicación a planilla"},{"path":"/comisariato/venta","name":"Venta a crédito","purpose":"Venta multi-artículo cargada a la cuenta del cliente"}],"faqs":[{"q":"¿Cómo le doy crédito a un empleado?","a":"Creá una «Nueva cuenta», elegí el tercero, segmento Empleado, fijá el límite y la empresa que le descuenta en planilla, y guardá."},{"q":"¿Qué pasa si la venta supera el crédito disponible?","a":"El sistema la rechaza por completo: no se emite factura, no baja inventario ni se carga saldo. Verás el mensaje «Límite de crédito excedido»."},{"q":"¿Un límite de 0 significa crédito ilimitado?","a":"No. 0 = sin crédito. Para crédito ilimitado tenés que activar «Sin tope de crédito» a propósito."},{"q":"¿Cómo se cobra a los empleados lo que consumieron?","a":"Con «Aplicar a planilla»: indicás la planilla y la empresa del comisariato, y el sistema mete los saldos como deducción y abona la cuenta por cobrar."},{"q":"¿Si registro la misma venta dos veces se duplica?","a":"No, la venta es idempotente por su código de referencia; reentrar no vuelve a cobrar ni a despachar."}]},{"id":"flota-activos","name":"Flota (vehículos y activos)","icon":"🚚","one_liner":"Registro de vehículos y maquinaria con sus lecturas de medidor y documentos por vencer.","what_it_does":"Es el inventario de la flota: vehículos, maquinaria y equipos estacionarios, cada uno con código, nombre, placa, marca, modelo y año, su estado y su lectura de medidor (kilómetros u horas). Permite registrar lecturas del odómetro/horómetro y los documentos legales del activo (seguro, circulación, revisión técnica, etc.) con su fecha de vencimiento. Un panel lateral muestra los documentos por vencer o vencidos, y se pueden ejecutar las alertas que evalúan vencimientos de documentos y mantenimientos. Está dirigido al encargado de flota.","key_features":["Listado de activos con tipo, placa, lectura actual y estado","Crear activos (vehículo/maquinaria/estacionario) con datos básicos","Registrar lectura de odómetro (km) u horómetro (horas) según el activo","Registrar documentos por activo con fecha de vencimiento","Panel de documentos por vencer/vencidos con semáforo de estado","Ejecutar alertas de documentos y mantenimiento (horizonte 30 días)"],"flows":[{"title":"Crear un activo y tomarle lectura","steps":["Entrar a Flota (/flota).","Presionar «Nuevo activo».","Capturar código, nombre, tipo y, si aplica, placa/marca/modelo/año; crear.","En la fila del activo presionar «Lectura».","Escribir el valor del odómetro (km) u horómetro (horas) y registrar."],"note":"Una lectura que retrocede o salta demasiado no avanza el medidor oficial y se marca como no verificada (no dispara reglas de mantenimiento)."},{"title":"Registrar un documento y revisar vencimientos","steps":["En la fila del activo presionar «Documento».","Elegir tipo (seguro, circulación, licencia, revisión técnica, otro), capturar número/emisor y la fecha de vencimiento; registrar.","Revisar en el panel «Documentos por vencer» el estado de cada documento.","Presionar «Ejecutar alertas» para reevaluar documentos y mantenimientos."],"note":"El estado del documento (vigente/por vencer/vencido) se calcula contra la fecha de hoy y el horizonte de 30 días."}],"business_rules":["Una lectura de medidor decreciente o con un salto mayor al umbral (km u horas configurable) NO avanza el medidor oficial y queda como no verificada.","Cada documento pertenece a un activo O a un conductor, nunca a ambos a la vez.","Las alertas son idempotentes por transición de estado: solo notifican cuando un documento pasa a por-vencer/vencido o un mantenimiento pasa a vencido; volver a correrlas no re-notifica.","Cuando un mantenimiento vence, el activo pasa a estado «Mantenimiento vencido» (salvo que ya esté ocupado en mantenimiento o fuera de servicio).","Crear/editar activos, registrar lecturas y gestionar documentos son permisos distintos.","Ejecutar las alertas requiere el permiso de gestión de mantenimiento (fleet.maintenance.manage)."],"permissions":["fleet.asset.read","fleet.asset.manage","fleet.meter.record","fleet.document.read","fleet.document.manage","fleet.maintenance.manage"],"routes":[{"path":"/flota","name":"Flota","purpose":"Activos de la flota, lecturas de medidor y documentos por vencer"}],"faqs":[{"q":"¿Cómo registro los kilómetros de un vehículo?","a":"En la fila del activo presioná «Lectura» y escribí el valor del odómetro (o del horómetro si es maquinaria)."},{"q":"¿Por qué mi lectura quedó como no verificada?","a":"Porque retrocedió o saltó más del umbral permitido. Esas lecturas no avanzan el medidor oficial ni disparan mantenimientos."},{"q":"¿Dónde veo qué documentos están por vencer?","a":"En el panel «Documentos por vencer» de Flota. Presioná «Ejecutar alertas» para reevaluar."}]},{"id":"conductores","name":"Conductores","icon":"🪪","one_liner":"Conductores de la flota con su licencia y vencimiento, asignables a un activo.","what_it_does":"Registra a los conductores de la flota con su nombre, cédula, número y categoría de licencia y la fecha de vencimiento de la misma. Permite asignar un conductor a un activo (vehículo o maquinaria). Es el padrón de quién maneja qué. Está dirigido al encargado de flota.","key_features":["Listado de conductores con cédula, licencia, categoría, vencimiento y estado","Crear conductores con datos de licencia","Asignar un conductor a un activo de la flota"],"flows":[{"title":"Crear un conductor y asignarlo","steps":["Entrar a Conductores (/flota/conductores).","Presionar «Nuevo conductor».","Capturar nombre completo y, si se tiene, cédula, número/categoría de licencia y vencimiento; crear.","En la fila del conductor presionar «Asignar a activo».","Elegir el activo y presionar «Asignar»."],"note":"Al asignar un conductor a un activo se libera la asignación activa anterior de ese activo."}],"business_rules":["Si se captura número de licencia, el conductor se identifica por ese número dentro de la empresa (evita duplicados).","Asignar un conductor a un activo desactiva la asignación previa de ese activo (un conductor activo por activo).","Crear conductores y asignarlos requiere el permiso de gestión de conductores (fleet.driver.manage); ver el listado solo requiere lectura."],"permissions":["fleet.driver.read","fleet.driver.manage"],"routes":[{"path":"/flota/conductores","name":"Conductores","purpose":"Padrón de conductores y asignación a activos"}],"faqs":[{"q":"¿Cómo asigno un conductor a un vehículo?","a":"En Conductores, sobre la fila del conductor presioná «Asignar a activo», elegí el activo y confirmá."},{"q":"¿Puede un activo tener dos conductores activos?","a":"No. Al asignar uno nuevo se desactiva la asignación anterior de ese activo."}]},{"id":"costos-flota","name":"Costos de flota","icon":"💸","one_liner":"Combustible, mantenimiento y otros gastos por vehículo, con costo por km/hora y rendimiento.","what_it_does":"Concentra los costos reales de cada activo de la flota, capturados a mano. Por vehículo se registran cargas de combustible (litros, costo y lectura del medidor), órdenes de mantenimiento (mano de obra + repuestos) y otros gastos (llantas, seguro, peaje, lavado, permisos, etc.). Arriba se muestra un resumen: costo total, desglose por categoría, costo por kilómetro u hora y el rendimiento (km/L o h/L). Tres pestañas separan combustible, mantenimiento y gastos. No se enlaza automáticamente con la estación: es registro manual por decisión del dueño. Está dirigido al encargado de flota y a control de costos.","key_features":["Selector de vehículo/activo con resumen de costos en tarjetas","Costo total y desglose: combustible, mantenimiento y otros gastos","Costo por km u hora y rendimiento (km/L o h/L) calculados solos","Registrar cargas de combustible con lectura del medidor y consumo desde la carga anterior","Registrar órdenes de mantenimiento (mano de obra + repuestos)","Registrar otros gastos por categoría","Tablas históricas por pestaña (combustible / mantenimiento / gastos)"],"flows":[{"title":"Registrar una carga de combustible","steps":["Entrar a Costos de flota (/flota/costos).","Elegir el vehículo/activo en el selector.","En la pestaña Combustible, presionar «Registrar carga».","Capturar litros, costo por litro y, si se tiene, lectura del odómetro/horómetro y referencia de estación; guardar."],"note":"Si se captura la lectura, el sistema calcula el recorrido desde la carga anterior y avanza el medidor del activo."},{"title":"Registrar mantenimiento o un gasto","steps":["Elegir el activo y entrar a la pestaña Mantenimiento o Otros gastos.","Para mantenimiento: presionar «Registrar mantenimiento», capturar descripción, mano de obra, repuestos y taller; guardar.","Para gasto: presionar «Registrar gasto», elegir categoría, monto y proveedor; guardar."],"note":"El total de la orden de mantenimiento = mano de obra + repuestos."}],"business_rules":["Los costos se capturan manualmente; no hay enlace automático con la estación de servicio.","La carga de combustible exige litros mayores a cero y costo no negativo; el total = litros × costo por litro.","Si la carga trae lectura del medidor, se calcula el recorrido desde la carga anterior y se avanza el medidor solo si la lectura es mayor a la actual.","El total de una orden de mantenimiento es mano de obra + repuestos; la descripción es obligatoria.","Un gasto exige monto mayor a cero y una categoría válida (llantas, seguro, peaje, lavado, permisos, otro).","El resumen excluye las órdenes de mantenimiento canceladas.","Costo por unidad y rendimiento solo se calculan si hay distancia/litros acumulados; si no, se muestran como «—».","Registrar costos requiere el permiso fleet.cost.manage; ver el resumen requiere fleet.cost.read."],"permissions":["fleet.cost.read","fleet.cost.manage"],"routes":[{"path":"/flota/costos","name":"Costos de flota","purpose":"Combustible, mantenimiento y gastos por activo con costo por km/hora"}],"faqs":[{"q":"¿Cómo registro cuánto gasté de combustible en un camión?","a":"En Costos de flota elegí el camión, pestaña Combustible, «Registrar carga», y poné litros, costo y la lectura del medidor."},{"q":"¿De dónde sale el costo por kilómetro?","a":"El sistema lo calcula con el costo total y la distancia recorrida acumulada; si no hay distancia registrada aparece «—»."},{"q":"¿Los costos se traen solos de la estación?","a":"No. En flota la captura es manual, por decisión del dueño; no hay enlace automático con la estación."}]},{"id":"mantenimiento-flota","name":"Mantenimiento de flota","icon":"🔧","one_liner":"Tipos de mantenimiento y planes con reglas (cada X km/horas/días) que se aplican a los activos.","what_it_does":"Define la taxonomía de mantenimiento preventivo: los tipos de mantenimiento (por ejemplo cambio de aceite) y los planes que agrupan reglas. Cada regla dice cada cuánto toca un mantenimiento (cada X kilómetros, cada X horas o cada X días). Un plan se aplica a un activo y eso materializa, por cada regla, el próximo vencimiento según el medidor o la fecha actual del activo. Desde aquí también se ejecutan las alertas que marcan los mantenimientos vencidos. Está dirigido al encargado de flota.","key_features":["Crear tipos de mantenimiento (código + nombre)","Crear planes de mantenimiento (con clase de activo opcional)","Agregar reglas a un plan por kilómetros, horas o días","Aplicar un plan a un activo (calcula el próximo vencimiento por regla)","Ejecutar alertas que marcan mantenimientos vencidos"],"flows":[{"title":"Armar un plan de mantenimiento y aplicarlo","steps":["Entrar a Mantenimiento (/flota/mantenimiento).","En Tipos, presionar «Nuevo» y crear el tipo (ej. código ACEITE, nombre Cambio de aceite).","En Planes, presionar «Nuevo» y crear el plan (ej. Plan camiones).","En el plan presionar «Regla», elegir el tipo, el disparador (km/horas/días) y el intervalo; agregar.","En el plan presionar «Aplicar», elegir el activo y aplicar el plan."],"note":"Al aplicar el plan se calcula el próximo vencimiento de cada regla a partir del medidor/fecha actual del activo."},{"title":"Ejecutar alertas de mantenimiento","steps":["En Mantenimiento, presionar «Ejecutar alertas».","El sistema reevalúa las reglas y marca como vencidos los mantenimientos que ya cumplieron su intervalo."],"note":"Solo marca como vencido lo que pasó el umbral; no re-notifica lo que ya estaba marcado."}],"business_rules":["Una regla se basa en un disparador: kilómetros, horas o días, con su intervalo.","Aplicar un plan a un activo materializa el próximo vencimiento por regla según el medidor/fecha actual y el factor de severidad.","Re-aplicar un plan solo refresca los umbrales de vencimiento; NO borra un mantenimiento ya marcado como vencido.","Las alertas son idempotentes por transición: solo marcan «vencido» cuando la regla recién pasa a vencida.","Las lecturas no verificadas (decrecientes o con salto sospechoso) no disparan reglas de mantenimiento.","Crear tipos/planes/reglas, aplicar planes y ejecutar alertas requieren el permiso fleet.maintenance.manage; ver requiere fleet.maintenance.read."],"permissions":["fleet.maintenance.read","fleet.maintenance.manage"],"routes":[{"path":"/flota/mantenimiento","name":"Mantenimiento de flota","purpose":"Tipos, planes con reglas por km/horas/días y aplicación a activos"}],"faqs":[{"q":"¿Cómo programo el cambio de aceite cada X km?","a":"Creá el tipo (Cambio de aceite), creá un plan, agregale una regla con disparador «km» y el intervalo, y aplicá el plan al vehículo."},{"q":"¿Cómo sé qué activos tienen mantenimiento vencido?","a":"Presioná «Ejecutar alertas»: el sistema marca como vencidos los que ya cumplieron su intervalo y pone el activo en «Mantenimiento vencido»."},{"q":"¿Si vuelvo a aplicar el plan se borra lo que estaba vencido?","a":"No. Re-aplicar solo refresca los próximos vencimientos; lo que ya estaba marcado como vencido se conserva."}]}],"uncertainties":["El POS maneja periféricos (impresoras, etc.) vía un conector edge con handshake firmado (permisos retail.pos.peripherals.read/manage), pero ninguna de las dos pantallas .vue revisadas (PosPage y TicketsPage) expone esa funcionalidad al usuario; parece administrarse por API/otro componente no incluido en esta área.","La anulación de tickets POS (retail.pos.ticket.void) existe en el backend, pero no se encontró un botón de anular en las pantallas .vue revisadas; podría estar en otra vista o no expuesto aún en la UI.","La pantalla de Cierre diario y el reporte de turno muestran el resultado como JSON crudo (texto), no como tablas formateadas; es funcional pero la presentación es técnica.","El campo 'days de crédito' (credit_days, vencimiento de cada CxC) existe en el modelo del comisariato pero no se edita desde el formulario de cuenta en la pantalla revisada.","No se confirmó en el código revisado el catálogo exacto de roles que agrupa estos permisos (se documentaron los códigos de permiso reales de rutas y vistas, no su asignación a roles)."]},{"area_id":"tablero-analitica-herramientas","area_title":"Tablero, Analítica y Herramientas","area_summary":"Reúne el tablero en vivo del holding, la analítica de tableros, las alertas operativas, la bandeja de documentos escaneados, el asistente/base de conocimiento, el diagnóstico técnico y los dispositivos enrolados. Es el centro desde donde se ve \"cómo va el negocio hoy\", se actúa sobre lo que el sistema detecta y se administran las herramientas transversales (notificaciones, notas sobre registros, sincronización offline).","icon":"📊","modules":[{"id":"tablero","name":"Tablero del holding","icon":"🏢","one_liner":"La pantalla de inicio en la PC: un resumen en vivo del día, empresa por empresa.","what_it_does":"El Tablero es lo primero que se abre al entrar al sistema desde una computadora (en el celular el inicio es Asistencia). Muestra, para cada empresa del holding a la que el usuario pertenece, un resumen del día con tarjetas como ventas de hoy, caja/POS, arqueo, cuentas por cobrar y por pagar, stock bajo y lo que necesita atención. La empresa activa aparece de primera y marcada como 'Activa'. Si para alguna empresa no hay permiso de ver el resumen, esa empresa se muestra con la etiqueta 'Sin acceso' en lugar de romper la pantalla. Sirve a gerentes, dueños y personal administrativo que quieren una foto rápida del negocio al empezar el día.","key_features":["Resumen en vivo que se actualiza solo cada 60 segundos, más un botón de refrescar manual","Una sección por empresa del holding (la activa va primero)","Tarjetas por área: ventas, caja, cobros/pagos, inventario, stock bajo, etc.","Cada tarjeta aparece solo si el usuario tiene permiso de ver esa información","Degrada con elegancia: si una empresa no autoriza el resumen se marca 'Sin acceso' y el resto se sigue mostrando","Reutiliza el 'resumen del día' del asistente (mismas cifras, una sola fuente)"],"flows":[{"title":"Revisar cómo va el día","steps":["Iniciar sesión en una computadora; el sistema abre el Tablero automáticamente","Ver la sección de la empresa activa (aparece de primera, marcada 'Activa')","Leer las tarjetas de cada área (ventas de hoy, caja, por cobrar, stock bajo, etc.)","Si hay más empresas del holding, bajar para ver el resumen de cada una","Tocar el botón de refrescar del encabezado si se quiere actualizar de inmediato (igual se actualiza solo cada minuto)"],"note":"Las cifras las calcula el sistema de forma determinista; el tablero solo las muestra."}],"business_rules":["El Tablero no exige un permiso específico: es la pantalla de inicio. Cada sección/tarjeta sí se filtra por el permiso correspondiente (read-only) y por la empresa.","El resumen está acotado a la EMPRESA: para ver otra empresa del holding el tablero consulta cambiando el contexto de empresa (X-Company-Id), sin sucursal.","Las empresas a las que el usuario no tiene acceso al resumen se marcan 'Sin acceso' (no bloquean la carga del resto).","Refresco automático cada 60 segundos mientras la pantalla está abierta."],"permissions":["(sin permiso propio para entrar; es el inicio)","knowledge.docs.read (base del resumen del día)","cada sección re-valida su propio permiso de lectura (p. ej. ventas, caja, cartera, inventario)"],"routes":[{"path":"/tablero","name":"Tablero del holding","purpose":"Inicio en PC: resumen en vivo del día por empresa"}],"faqs":[{"q":"¿Por qué en el celular no me sale el Tablero?","a":"En el celular la experiencia es limitada y el inicio es la pantalla de Asistencia. El Tablero del holding es la pantalla de inicio en la computadora."},{"q":"¿Cada cuánto se actualiza el resumen?","a":"Solo, cada 60 segundos mientras la pantalla está abierta. También podés refrescar al instante con el botón del encabezado."},{"q":"¿Por qué una empresa me dice 'Sin acceso'?","a":"Porque no tenés permiso de ver su resumen del día. Las demás empresas se siguen mostrando con normalidad."},{"q":"¿Por qué una tarjeta de área no aparece?","a":"Porque no tenés el permiso de lectura de esa área. Cada tarjeta se muestra solo si la podés ver."}]},{"id":"analitica","name":"Analítica (tableros e informes)","icon":"📈","one_liner":"Espacios de tableros del holding y un acceso temporal seguro para abrirlos.","what_it_does":"Analítica lista los 'workspaces' (espacios de tableros) disponibles según los permisos del usuario: por ahora un workspace Ejecutivo (ingresos, margen y posición financiera) y uno de Operaciones (combustible y conciliación operativa). Desde cada workspace se genera un 'acceso al tablero': un token temporal de embed que permite abrir el tablero sin volver a iniciar sesión. Detrás, el kernel de reporting expone catálogos de datasets, ejecuciones (runs), instantáneas (snapshots) y vistas guardadas, cada uno con su control de calidad y su permiso. Lo usan dirección y analistas que consumen tableros de negocio del holding.","key_features":["Catálogo de workspaces filtrado por permisos (Ejecutivo, Operaciones)","Botón 'Generar acceso' que crea un token de embed de un solo uso y muy corto (90 segundos)","Ese token se canjea (redeem) por un token de reporting de 15 minutos para abrir el tablero","Cada workspace declara qué datasets usa y qué permisos requiere","Kernel de reporting: datasets con calidad (quality), runs, snapshots y vistas guardadas (saved views)","Las vistas guardadas se pueden compartir; crearlas exige permiso de composición"],"flows":[{"title":"Generar el acceso a un tablero","steps":["Abrir Analítica desde el menú","Ubicar el workspace deseado (Ejecutivo u Operaciones)","Tocar 'Generar acceso'","El sistema muestra los datos del acceso (token y vencimiento) en una ventana","Usar ese acceso para abrir el tablero antes de que venza"],"note":"El token de embed vive 90 segundos y es de un solo uso; al canjearlo se obtiene un acceso de 15 minutos al tablero."}],"business_rules":["Entrar a Analítica exige el permiso report.dashboard.read.","Cada workspace solo aparece si el usuario tiene TODOS sus permisos requeridos (p. ej. Ejecutivo pide report.dataset.read y accounting.report.read; Operaciones pide además fuel.reports.view).","Para generar el acceso se requiere sucursal activa (X-Branch-Id) en esta fase; el token queda acotado a empresa + sucursal + workspace.","El token de embed dura 90 segundos y es de un solo uso: se registra como 'emitido' y al canjearlo pasa a 'canjeado'. Si ya fue canjeado, vuelve a intentarlo da conflicto; si venció, queda 'expirado'.","Al canjear se entrega un token de reporting de 15 minutos con los permisos congelados al momento de emitir.","Toda emisión y canje de token queda en la bitácora de auditoría.","Los datasets de reporting traen un estado de calidad (quality) y dejan rastro (lineage) de su ejecución.","Crear una vista guardada exige report.dashboard.compose; exportar exige report.dataset.export."],"permissions":["report.dashboard.read","report.dataset.read","report.catalog.read","report.run.read","report.dataset.export","report.snapshot.generate","report.dashboard.compose","accounting.report.read","fuel.reports.view"],"routes":[{"path":"/analitica","name":"Analítica","purpose":"Listar workspaces de tableros y generar el acceso temporal de embed"}],"faqs":[{"q":"¿Por qué no veo ningún workspace?","a":"Porque todavía no tenés todos los permisos que pide cada workspace, o no hay workspaces configurados para tu empresa. El Ejecutivo y el de Operaciones aparecen solo si cumplís sus permisos."},{"q":"¿Para qué sirve 'Generar acceso'?","a":"Crea un token temporal (de un solo uso, dura 90 segundos) que se canjea por un acceso de 15 minutos para abrir el tablero sin volver a loguearte."},{"q":"¿Por qué me pide sucursal para generar el acceso?","a":"En esta fase el acceso a la analítica se acota a empresa y sucursal; debés tener una sucursal activa seleccionada."},{"q":"¿Quién puede crear o compartir una vista guardada?","a":"Quien tenga el permiso de composición de tableros (report.dashboard.compose). Para solo verlas basta report.dashboard.read."}]},{"id":"alertas","name":"Alertas operativas","icon":"🚨","one_liner":"Lo que el sistema detecta solo (cartera vencida, stock bajo, documentos por vencer, préstamos en mora) y las acciones para atenderlo.","what_it_does":"Alertas muestra las condiciones operativas que el sistema detecta automáticamente: cuentas por cobrar vencidas o por vencer, préstamos de financiamiento en mora, stock por debajo del mínimo o del punto de reorden, y documentos de flota (circulación, seguro, licencias) vencidos o por vencer. Cada alerta es el estado vigente de una condición: si la condición desaparece, el escáner la resuelve sola; si reaparece, la reabre. El usuario puede filtrar por estado y severidad, marcar una alerta como 'Vista' o 'Resolver'-la, y disparar un escaneo manual con 'Escanear ahora'. La usan administradores de empresa, cobranza, bodega, oficiales de financiamiento y supervisores de flota.","key_features":["Detección automática y determinista (sin IA): cartera vencida/por vencer, préstamos en mora, stock bajo, documentos de flota por vencer","Severidades: Crítica, Advertencia, Informativa","Estados: Abierta, Vista (reconocida), Resuelta","Acciones: 'Vista' (reconocer) y 'Resolver'","Botón 'Escanear ahora' para volver a evaluar la empresa al instante","Filtros por estado y severidad; tabla con detalle y última vez vista","Aviso a los roles correctos (in-app/push) solo cuando una alerta se abre o reabre"],"flows":[{"title":"Atender una alerta","steps":["Abrir Alertas desde el menú (o desde el Tablero)","Filtrar por Estado (p. ej. Abiertas) y Severidad si se desea","Leer la alerta y su detalle (cliente, saldo, vencimiento, etc.)","Tocar 'Vista' para reconocer que ya la viste, o 'Resolver' si ya no aplica","La lista se recarga con el nuevo estado"],"note":"Si resolvés a mano una alerta cuya condición sigue activa, el próximo escaneo la vuelve a abrir: honestidad por diseño."},{"title":"Forzar un escaneo","steps":["En Alertas, tocar 'Escanear ahora'","Esperar el aviso con cuántas alertas nuevas se abrieron","Revisar la lista actualizada"],"note":"El escaneo también corre periódicamente por su cuenta; el botón es para verlo de inmediato."}],"business_rules":["Ver alertas exige alerts.read; reconocer (Vista) y resolver exigen alerts.ack; escanear a mano exige alerts.scan.","Las alertas están acotadas a la empresa activa (X-Company-Id requerido).","Cada alerta es única por empresa + tipo + sujeto: re-escanear actualiza 'última vez vista', no duplica.","El escáner resuelve solo las alertas cuya condición ya no existe, y reabre las que reaparecen tras estar resueltas.","Reglas de severidad: CxC vencida hace más de 30 días es Crítica, hasta 30 días Advertencia; por vencer es Informativa. Stock por debajo del mínimo es Crítico, bajo el punto de reorden es Advertencia. Documento de flota vencido es Crítico, por vencer (hasta 30 días) es Advertencia.","La notificación a los roles (administrador de empresa + el rol dueño del tema) se emite solo al abrir o reabrir, no en cada escaneo.","Resolver una alerta ya resuelta no hace nada; reconocer una resuelta tampoco la cambia."],"permissions":["alerts.read","alerts.ack","alerts.scan"],"routes":[{"path":"/alertas","name":"Alertas","purpose":"Ver, filtrar y atender (reconocer/resolver) las condiciones detectadas; escaneo manual"}],"faqs":[{"q":"¿Cuál es la diferencia entre 'Vista' y 'Resolver'?","a":"'Vista' solo reconoce que ya la viste (queda como Reconocida). 'Resolver' la cierra. Ambas exigen el permiso alerts.ack."},{"q":"Resolví una alerta pero volvió a aparecer, ¿por qué?","a":"Porque la condición sigue activa (la deuda sigue vencida, el stock sigue bajo). El escáner la reabre para no ocultar problemas reales."},{"q":"¿Tengo que escanear yo las alertas?","a":"No es obligatorio: el escaneo corre periódicamente solo. El botón 'Escanear ahora' es por si querés verlas al instante."},{"q":"¿Qué cosas detecta el sistema?","a":"Cuentas por cobrar vencidas y por vencer, préstamos de financiamiento en mora, stock bajo el mínimo/reorden y documentos de flota vencidos o por vencer."}]},{"id":"documentos","name":"Documentos escaneados (IDP)","icon":"📄","one_liner":"Bandeja para subir un documento, pasarle OCR, extraerle campos y revisarlos a mano.","what_it_does":"Documentos es la bandeja de procesamiento inteligente de documentos: subís una imagen o PDF (factura/recibo, ticket de combustible, planilla, remisión o general), el sistema le aplica OCR (lectura del texto), luego extrae campos en borrador (RUC, cédula, fecha, montos, número de documento, placa, galones, etc.) y finalmente una persona revisa y aprueba. El estado del documento avanza por etapas y nunca integra nada solo: extraer produce solo un borrador; recién después de la revisión humana podría usarse en un proceso de negocio. La usa el personal administrativo y de operaciones que digitaliza comprobantes en papel.","key_features":["Subir imagen o PDF eligiendo el tipo de documento","Pipeline por etapas: Pendiente de OCR → Procesado (OCR) → Extraído (por revisar) → Revisado (o Falló)","Extracción determinista de campos nicaragüenses (RUC, cédula, fecha, montos, número, placa, galones/litros, remisiones)","Cada campo sale con su nivel de confianza y el texto OCR queda visible","Revisión humana obligatoria antes de cualquier uso","Filtro por estado y detalle con los campos extraídos y el texto OCR"],"flows":[{"title":"Subir y procesar un documento","steps":["Abrir Documentos y tocar 'Subir documento'","Elegir el tipo (General, Factura, Ticket de combustible, Planilla, Remisión)","Adjuntar la imagen o el PDF y tocar 'Subir'","El documento queda en cola de OCR (estado Pendiente de OCR)","Cuando el OCR termina pasa a Procesado, y normalmente el sistema extrae campos solo (Extraído)"],"note":"Si un documento quedó en Procesado y no se extrajo solo, podés tocar 'Extraer' para hacerlo a mano."},{"title":"Revisar y aprobar","steps":["Filtrar por estado 'Extraído (por revisar)'","Abrir el documento con 'Ver' / 'Revisar'","Verificar los campos extraídos y el texto OCR","Tocar 'Aprobar revisión' para marcarlo como Revisado"],"note":"Aprobar la revisión NO integra el documento a ningún proceso; solo confirma los campos."}],"business_rules":["Ver y listar documentos exige documents.scan.read; subir exige documents.scan.create; extraer y revisar exigen documents.scan.review.","Todo está acotado a la empresa activa (X-Company-Id requerido).","La extracción solo corre sobre documentos en estado Procesado (con OCR ya hecho); intentarla en otro estado da conflicto.","La extracción produce SOLO un borrador: jamás crea objetos de negocio ni enlaza el documento a una factura/ticket/planilla (eso es una etapa posterior, siempre tras la revisión humana).","Si el OCR falla, el documento queda en estado 'Falló' con el motivo, sin perder lo demás.","Cada campo extraído lleva su nivel de confianza (alta si había etiqueta explícita, media/baja si fue heurística)."],"permissions":["documents.scan.read","documents.scan.create","documents.scan.review"],"routes":[{"path":"/documentos","name":"Documentos escaneados","purpose":"Bandeja IDP: subir, ver OCR, extraer campos y revisar/aprobar"}],"faqs":[{"q":"¿Subir un documento ya lo registra como factura/gasto?","a":"No. El sistema solo lee el texto y extrae campos en borrador. Nada se integra automáticamente; siempre hay revisión humana primero."},{"q":"¿Por qué el botón 'Extraer' solo aparece a veces?","a":"Porque la extracción solo aplica a documentos en estado Procesado (con OCR ya hecho). En otros estados no se muestra."},{"q":"Mi documento quedó en 'Falló', ¿qué hago?","a":"El OCR no pudo leer la imagen. Probá con una foto más nítida o un PDF más limpio y subilo de nuevo."},{"q":"¿Qué campos extrae?","a":"RUC, cédula, fecha, montos, número de documento, placa, galones/litros y datos de remisión, según el tipo. Cada uno con su nivel de confianza."}]},{"id":"conocimiento","name":"Asistente / Base de conocimiento","icon":"💬","one_liner":"Un chat que responde con datos reales de tu sistema o explica cómo se usa, leyendo el manual.","what_it_does":"El Asistente es un chat en español donde podés preguntar datos de tu negocio ('¿cuánto vendí hoy?', '¿cuánto me deben?'), cómo se usa el sistema ('¿cómo registro un empleado?') o pedir ideas para mejorar un flujo. Al entrar muestra un menú de sugerencias agrupadas por tema ('¿con qué te puedo ayudar?'). Las cifras las calculan consultas internas (skills) acotadas a tu empresa y a tus permisos; cuando la IA está habilitada, redacta la respuesta de forma natural y aconseja, pero nunca inventa números. Si la IA está apagada, igual responde con la cifra o el extracto del manual. Lo puede usar cualquier usuario del sistema.","key_features":["Chat conversacional con memoria del hilo (el frontend manda el historial)","Menú inicial de sugerencias por tema (caja y ventas, inventario, RRHH, nómina, cartera, café, flota, supervisión, etc.)","Responde con datos reales (read-only, por empresa y por permiso) o con el manual (búsqueda)","Búsqueda determinista en la documentación en español; siempre funciona aunque la IA esté apagada","Cuando detecta problemas (alertas, cajas sin cerrar, cuentas vencidas) los resume y sugiere el siguiente paso","Detrás del 'kill switch' de IA: si está apagada, degrada a respuesta determinista sin romper"],"flows":[{"title":"Preguntar algo al asistente","steps":["Abrir Conocimiento/Asistente desde el menú","Elegir una pregunta sugerida del menú inicial, o escribir la tuya","Enviar (Enter o el botón)","Leer la respuesta; seguir conversando en el mismo hilo si hace falta"],"note":"Las cifras vienen de consultas reales acotadas a tu empresa y permisos; el asistente no inventa números."}],"business_rules":["El permiso base para usar el asistente, el chat, la búsqueda y las sugerencias es knowledge.docs.read.","Cada consulta de datos (skill) re-valida su propio permiso y queda acotada a la empresa: solo ves lo que tu permiso permite.","El LLM solo elige qué consulta usar y redacta; nunca escribe consultas ni inventa cifras (usa solo la evidencia de las skills).","Toda la IA va detrás del kill switch (apagada por defecto / opt-in por entorno + interruptor en caliente): si está apagada o falla, el asistente degrada a la respuesta determinista (la cifra de la skill o el extracto del manual).","El asistente es read-only: informa y aconseja, no ejecuta acciones.","La búsqueda en el manual es determinista (índice en español): misma consulta, mismos resultados, con cita de la fuente."],"permissions":["knowledge.docs.read","(cada consulta de datos exige además su propio permiso de lectura)"],"routes":[{"path":"/conocimiento","name":"Asistente","purpose":"Chat que responde con datos del sistema o con el manual"}],"faqs":[{"q":"¿De dónde saca los números el asistente?","a":"De consultas internas reales (skills) acotadas a tu empresa y a tus permisos. Nunca inventa cifras."},{"q":"¿Funciona si la IA está apagada?","a":"Sí. La búsqueda y las cifras son deterministas; con la IA apagada igual te da la respuesta, solo que sin la redacción natural del modelo."},{"q":"¿Puede ver datos de otra empresa o de algo que no tengo permitido?","a":"No. Cada consulta valida tu permiso y se acota a tu empresa; solo ves lo que podés ver."},{"q":"¿El asistente puede hacer cosas por mí (registrar, pagar)?","a":"No. Solo informa y aconseja; no ejecuta acciones."}]},{"id":"diagnostico","name":"Diagnóstico técnico","icon":"🛠️","one_liner":"Supervisión técnica del sistema: errores por riesgo, hallazgos de seguridad, gate de release y apagado de la IA.","what_it_does":"Diagnóstico es el panel de supervisión técnica. Muestra los errores de ejecución agrupados por clase de riesgo (C1 crítico, C2 alto, C3 normal), los hallazgos de seguridad, los diagnósticos de causa raíz (deterministas, con análisis de IA opcional) y la evidencia de cobertura de código. En el encabezado avisa si el sistema está 'Listo para release' o 'Bloqueado' (un error C1 abierto bloquea) y trae el interruptor de apagado de la IA (kill switch). Sobre cada error o hallazgo se puede hacer triage (confirmar, corregir, riesgo aceptado, falso positivo). Está pensado para el equipo técnico y de plataforma, no para el usuario operativo común.","key_features":["Pestañas: Errores, Seguridad, Diagnósticos y Cobertura","Errores clasificados por riesgo Necktral (C1/C2/C3) y por dominio, con conteo de ocurrencias","Banner de release: 'Listo' si no hay C1 abiertos, 'Bloqueado' si los hay","Diagnóstico de causa raíz determinista por error, con opción de 'Analizar con IA'","Triage humano de errores y hallazgos con decisión registrada (queda el dueño)","Kill switch de IA en caliente, con tooltip de advertencia","Evidencia de cobertura por archivo/línea (cubierta, parcial, sin cobertura)"],"flows":[{"title":"Diagnosticar un error y analizarlo con IA","steps":["Abrir Diagnóstico y quedarse en la pestaña Errores","Filtrar por riesgo o estado si se desea","En un error, tocar 'Diagnosticar' para correr el diagnóstico determinista","Ir a la pestaña Diagnósticos y abrir el diagnóstico con 'Ver'","Si la IA está encendida, tocar 'Analizar con IA' para que rellene la hipótesis de causa"],"note":"Si la IA está apagada, 'Analizar con IA' no actúa (devuelve conflicto): el diagnóstico determinista igual existe."},{"title":"Hacer triage de un error","steps":["En la pestaña Errores, ubicar un error abierto","Tocar 'Triage'","Elegir la decisión: Confirmado, Corregido, Riesgo aceptado o Falso positivo","Aplicar; queda registrado quién decidió"],"note":"Un error marcado 'Corregido' que reaparece vuelve a 'Regresó' automáticamente."}],"business_rules":["Entrar y ver errores/cobertura/release exige diagnostics.error.read; los hallazgos de seguridad exigen diagnostics.finding.read; ver diagnósticos exige diagnostics.diagnose.read.","Correr el diagnóstico determinista exige diagnostics.diagnose.run; el análisis IA exige diagnostics.ai_diagnose.run.","El triage de errores exige diagnostics.error.triage; el de hallazgos diagnostics.finding.triage.","Leer el estado de la IA exige diagnostics.ai_control.read; encenderla/apagarla exige diagnostics.ai_control.manage.","Gate de release determinista: un error C1 abierto (o un hallazgo de seguridad C1 abierto) BLOQUEA; las regresiones se reportan.","Kill switch de IA: toda función de IA solo corre si el entorno la habilita Y el interruptor en caliente está encendido; con la IA apagada, 'Analizar con IA' devuelve conflicto (409) y no toca nada.","El backend no expone el mensaje del error en claro (solo huella); el error se identifica por tipo + archivo:línea. Los errores se deduplican por la huella del stack (mismo stack = misma fila, suma ocurrencias).","El 'riesgo aceptado' de un hallazgo de seguridad NO se decide acá: va por el contrato de excepciones con vencimiento."],"permissions":["diagnostics.error.read","diagnostics.finding.read","diagnostics.diagnose.read","diagnostics.diagnose.run","diagnostics.ai_diagnose.run","diagnostics.error.triage","diagnostics.finding.triage","diagnostics.ai_control.read","diagnostics.ai_control.manage"],"routes":[{"path":"/diagnostico","name":"Diagnóstico","purpose":"Errores por riesgo, seguridad, diagnósticos de causa raíz, cobertura, gate de release y kill switch de IA"}],"faqs":[{"q":"¿Qué significa que el release esté 'Bloqueado'?","a":"Que hay al menos un error de clase C1 (crítico) abierto. Un C1 abierto, sea error de runtime o hallazgo de seguridad, bloquea el release."},{"q":"¿Para qué sirve el interruptor 'IA'?","a":"Es el kill switch: apaga toda síntesis y análisis con IA del sistema, en caliente, sin reinstalar nada. Con él apagado, los análisis de IA quedan deshabilitados."},{"q":"Marqué un error como 'Corregido' pero volvió a aparecer.","a":"El sistema lo detecta y lo pasa a 'Regresó' automáticamente: al ledger no se le puede mentir."},{"q":"¿Por qué no veo el mensaje exacto del error?","a":"Por seguridad el sistema no guarda el mensaje en claro; identifica el error por su tipo y la ubicación (archivo:línea)."}]},{"id":"dispositivos","name":"Dispositivos (enrolamiento y sync offline)","icon":"📱","one_liner":"Enrolá celulares y aparatos con un código de un solo uso; cada acción queda identificada y se sincroniza aunque no haya internet.","what_it_does":"Dispositivos administra los celulares y aparatos enrolados. Desde la web, un usuario autorizado genera un 'código de enrolamiento' de un solo uso (con su QR) que vence en minutos; en el aparato se canjea ese código (escaneando el QR o escribiéndolo) y el aparato queda enrolado con su propia identidad criptográfica. La clave privada nunca sale del aparato y sirve para firmar los lotes de datos que el aparato sube cuando vuelve a tener conexión (sincronización offline-first). La lista muestra el estado de cada aparato (Activo, Revocado, En cuarentena) y permite revocarlos. La usan administradores que entregan celulares al personal de campo y la operación que trabaja sin internet.","key_features":["Generar código de enrolamiento de un solo uso, con QR y vencimiento configurable (por defecto 15 min)","Enrolar desde el aparato: escanear el QR (en la app nativa) o pegar el código a mano","Cada aparato genera su par de llaves Ed25519; la privada nunca sale del aparato","Lista de dispositivos con estado (Activo / Revocado / En cuarentena), última conexión y fecha de enrolamiento","Revocar un dispositivo (deja de poder operar y su identidad queda inválida)","Sincronización offline por lotes (batch) con idempotencia y firma por comando"],"flows":[{"title":"Enrolar un aparato nuevo","steps":["En la web, abrir Dispositivos y tocar 'Generar código de enrolamiento'","Poner una etiqueta (p. ej. 'Cel del mandador') y los minutos de vencimiento","Tocar
