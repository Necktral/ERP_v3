<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Necktral ERP/CRM — Manual interactivo</title>
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f0f2f8; --text:#1d2433; --muted:#5b6577;
    --border:#e3e7ef; --primary:#2f6df6; --primary-soft:#e7f0ff; --accent:#0fae8e; --accent-soft:#e2f7f1;
    --warn:#d9822b; --warn-soft:#fcefdc; --danger:#d64545; --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
    --radius:14px; --radius-sm:9px; --sidebar-w:300px; --maxw:1080px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0f1420; --surface:#161c2b; --surface-2:#1d2538; --text:#e7ecf6; --muted:#9aa6bd;
    --border:#27304a; --primary:#5b8cff; --primary-soft:#16233f; --accent:#28c6a3; --accent-soft:#11302a;
    --warn:#e0a35a; --warn-soft:#3a2c16; --danger:#f0726f; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:16px}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  code,kbd{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:.12em .42em;border-radius:6px;border:1px solid var(--border)}

  /* ===== Layout ===== */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:0;display:flex;flex-direction:column;z-index:30}
  .brand{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-size:20px;flex:0 0 auto;box-shadow:var(--shadow)}
  .brand h1{font-size:15px;margin:0;line-height:1.2}
  .brand span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .search-wrap{padding:12px 14px 8px}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 11px}
  .search input{border:0;background:transparent;outline:none;color:var(--text);width:100%;font-size:14px}
  .search .ic{color:var(--muted);font-size:14px}
  .search kbd{font-size:10px;color:var(--muted)}
  nav.menu{padding:6px 10px 24px;overflow-y:auto;flex:1}
  .nav-group{margin-top:8px}
  .nav-group>.grp-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 12px 5px;font-weight:700}
  .nav-link{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--text);cursor:pointer;font-size:14px;user-select:none;transition:background .12s}
  .nav-link:hover{background:var(--surface-2);text-decoration:none}
  .nav-link.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav-link .em{font-size:16px;width:20px;text-align:center;flex:0 0 auto}
  .nav-link .chev{margin-left:auto;color:var(--muted);transition:transform .15s;font-size:11px}
  .nav-link.open .chev{transform:rotate(90deg)}
  .nav-children{margin:2px 0 4px 16px;padding-left:8px;border-left:1px solid var(--border);display:none}
  .nav-children.show{display:block}
  .nav-children .nav-link{font-size:13px;padding:6px 11px;color:var(--muted)}
  .nav-children .nav-link.active{color:var(--primary);background:var(--primary-soft)}
  .sb-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}

  /* ===== Content ===== */
  .content{min-width:0}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar .crumbs{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .crumbs b{color:var(--text)}
  .iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);width:38px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}
  .iconbtn:hover{background:var(--surface-2)}
  .menu-toggle{display:none}
  main{max-width:var(--maxw);margin:0 auto;padding:30px 26px 90px}

  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* hero / home */
  .hero{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:20px;padding:34px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;background:rgba(255,255,255,.12);border-radius:50%}
  .hero h2{margin:0 0 8px;font-size:27px}
  .hero p{margin:0;max-width:60ch;opacity:.95;font-size:15.5px}
  .hero .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative;z-index:1}
  .hero .pills span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:999px;font-size:12.5px}

  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:34px 2px 12px}
  .grid{display:grid;gap:14px}
  .grid.cards{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
  .grid.cards-2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;gap:7px}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--primary) 45%,var(--border))}
  .tile .em{font-size:26px}
  .tile h3{margin:0;font-size:15.5px}
  .tile p{margin:0;font-size:13px;color:var(--muted)}
  .tile .count{margin-top:auto;font-size:11.5px;color:var(--primary);font-weight:600}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .module-card{margin-bottom:16px}
  .module-card>.mc-head{display:flex;align-items:flex-start;gap:13px}
  .module-card .em{font-size:25px;flex:0 0 auto}
  .module-card h3{margin:0;font-size:18px}
  .module-card .one{color:var(--muted);font-size:14px;margin:3px 0 0}
  .module-card .body{margin-top:14px}

  .lead{font-size:15px;color:var(--text)}
  .muted{color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .chip.perm{font-family:var(--mono);font-size:11px;background:var(--primary-soft);color:var(--primary);border-color:transparent}
  .chip.route{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-family:var(--mono);font-size:11px}

  .block{margin-top:18px}
  .block>h4{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:7px}
  ul.feat{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  ul.feat li{position:relative;padding-left:24px;font-size:14.5px}
  ul.feat li:before{content:"✓";position:absolute;left:0;top:0;color:var(--accent);font-weight:700}
  ul.rules{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  ul.rules li{position:relative;padding-left:24px;font-size:14px;color:var(--text)}
  ul.rules li:before{content:"⚖";position:absolute;left:0;top:1px;color:var(--warn)}

  /* flow stepper */
  .flow{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
  .flow+.flow{margin-top:12px}
  .flow .fl-head{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--surface-2);cursor:pointer}
  .flow .fl-head .ic{color:var(--primary)}
  .flow .fl-head h5{margin:0;font-size:14.5px;flex:1}
  .flow .fl-head .nsteps{font-size:11.5px;color:var(--muted)}
  .flow .fl-body{padding:6px 4px 14px}
  .stepper{display:flex;gap:6px;padding:12px 15px 6px;flex-wrap:wrap}
  .stepper .dot{flex:1;min-width:24px;height:5px;border-radius:3px;background:var(--border);transition:background .2s}
  .stepper .dot.done{background:var(--primary)}
  .step-view{padding:6px 16px 4px;min-height:64px;display:flex;gap:13px;align-items:flex-start}
  .step-view .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .step-view .txt{font-size:14.5px;padding-top:3px}
  .step-ctrls{display:flex;align-items:center;gap:10px;padding:8px 16px 4px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--primary);color:#fff;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.45;cursor:default}
  .step-ctrls .pos{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .fl-note{margin:10px 16px 2px;padding:9px 12px;background:var(--warn-soft);border-radius:8px;font-size:13px;color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

  /* faq accordion */
  .faq{border-bottom:1px solid var(--border)}
  .faq .q{display:flex;gap:10px;align-items:center;padding:13px 4px;cursor:pointer;font-weight:600;font-size:14.5px}
  .faq .q .tg{margin-left:auto;color:var(--muted);transition:transform .15s}
  .faq.open .q .tg{transform:rotate(45deg)}
  .faq .a{display:none;padding:0 4px 14px 30px;color:var(--muted);font-size:14px}
  .faq.open .a{display:block}

  /* roles */
  .role-pick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
  .role-pick button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px}
  .role-pick button.active{background:var(--primary);color:#fff;border-color:transparent}

  .callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);font-size:14px}
  .callout .em{font-size:20px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .em{font-size:40px;display:block;margin-bottom:10px}

  .anchor-list{columns:2;column-gap:26px}
  @media(max-width:900px){.anchor-list{columns:1}}

  /* responsive */
  .scrim{display:none}
  @media(max-width:880px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:86%;max-width:330px;transform:translateX(-103%);transition:transform .22s ease;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .menu-toggle{display:grid}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(8,12,22,.45);z-index:25}
    main{padding:22px 16px 80px}
    .grid.cards{grid-template-columns:1fr 1fr}
  }
  @media(max-width:520px){.grid.cards{grid-template-columns:1fr}.hero{padding:24px 20px}}

  @media print{
    .sidebar,.topbar,.scrim,.menu-toggle{display:none!important}
    .app{display:block}
    main{max-width:none;padding:0}
    .flow .fl-body{display:block!important}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>Necktral ERP/CRM</h1>
        <span>Manual interactivo</span>
      </div>
    </div>
    <div class="search-wrap">
      <label class="search">
        <span class="ic">🔍</span>
        <input id="search" type="search" placeholder="Buscar módulo, acción, concepto…" autocomplete="off" />
        <kbd>/</kbd>
      </label>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sb-foot">
      <span id="foot-meta">Manual del sistema</span>
      <span>v1.0</span>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="content">
    <div class="topbar">
      <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Menú">☰</button>
      <div class="crumbs" id="crumbs">Inicio</div>
      <button class="iconbtn" id="printBtn" title="Imprimir / PDF">🖨️</button>
      <button class="iconbtn" id="themeBtn" title="Tema claro/oscuro">🌙</button>
    </div>
    <main id="main"></main>
  </div>
</div>

<script>
/*DATA_START*/
const DATA = {"meta":{"title":"Necktral ERP/CRM","subtitle":"Manual interactivo del sistema","intro":"Sistema integral para administrar varias empresas (un holding) y todas sus operaciones diarias: ventas, inventario, compras, recursos humanos, nómina, cartera, contabilidad y verticales especializadas (café, estación de servicios, retail y flota).","pills":["Multiempresa","Permisos por rol","Auditoría total","Funciona sin internet","Nicaragua (INSS/IR/INATEC)"]},"gettingStarted":[{"title":"Arranque del sistema","steps":["La primera vez que se abre sin datos aparece el asistente de arranque (onboarding).","Se crea el usuario administrador (contraseña de al menos 10 caracteres y 3 tipos).","Se crea el holding, la empresa con su RUC y la primera sucursal.","El administrador queda con todos los permisos y ya puede configurar el resto."]},{"title":"Iniciar sesión","steps":["Ingresá usuario y contraseña en la pantalla de inicio.","Si está activo, completá el segundo factor (2FA).","Elegí la empresa y sucursal con la que vas a trabajar (selector de contexto).","Tras varios intentos fallidos la cuenta se bloquea temporalmente."]},{"title":"Dar de alta usuarios","steps":["Entrá a Usuarios (un administrador).","Creá el usuario con sus datos.","Asignale uno o varios roles según lo que deba hacer.","Si alguien ve “no autorizado”, revisá su rol."]}],"areas":[{"area_id":"org-usuarios-seguridad","area_title":"Organizacion, Usuarios y Seguridad","area_summary":"Cubre el arranque del sistema (creacion del primer administrador y de la organizacion), el inicio de sesion con verificacion en dos pasos (2FA) y bloqueo por intentos, la estructura Holding -> Empresa -> Sucursal con su selector de contexto, el alta de usuarios y asignacion de roles por empresa o sucursal, la bitacora de auditoria inmutable y el tablero de controles anti-fraude (segregacion de funciones). Es el cimiento sobre el que operan todos los demas modulos: define quien entra, a que empresa y con que permisos, y deja constancia firmada de todo lo que pasa.","icon":"🔐","modules":[{"id":"bootstrap","name":"Arranque del sistema (asistente de configuracion inicial)","icon":"🚀","one_liner":"Asistente de dos pasos que crea el primer administrador y la organizacion cuando el sistema esta recien instalado.","what_it_does":"Es la primera pantalla que se ve cuando el sistema esta vacio (sin ningun usuario todavia). Guia a la persona que instala para crear, en dos pasos, la cuenta de administrador con la que va a gobernar todo, y luego la estructura inicial de la organizacion: un grupo (holding), su primera empresa (con RUC) y una sucursal principal. Al terminar, esa persona queda como administrador de la empresa con todos los permisos y puede entrar al sistema. Esta dirigido al responsable tecnico o al dueno que pone en marcha Necktral por primera vez.","key_features":["Paso 1 - Administrador: nombres, apellidos, usuario, correo (opcional) y contrasena con confirmacion.","Medidor de fortaleza de contrasena que respeta la politica real del backend (minimo 10 caracteres y al menos 3 de: minusculas, mayusculas, numeros, simbolos).","Paso 2 - Organizacion: nombre del holding, nombre y RUC de la primera empresa, y nombre/direccion de la sucursal principal.","Solo funciona si NO existen usuarios todavia; si el sistema ya tiene usuarios, redirige a Login.","Al crear el administrador, inicia sesion automaticamente para poder seguir al paso 2.","Al completar, deja al usuario como administrador de la empresa (rol company_admin) con acceso inmediato.","Pantalla final de confirmacion con resumen de holding, empresa y sucursal creados."],"flows":[{"title":"Crear el administrador inicial y la organizacion","steps":["Abrir la aplicacion por primera vez: aparece el asistente en /bootstrap (o entrar a /login y tocar 'Crear usuario inicial').","Paso 1: llenar nombres, apellidos, usuario y contrasena (con su confirmacion) hasta que el medidor indique que cumple la politica.","Tocar 'Crear administrador y continuar' (el sistema crea la cuenta e inicia sesion solo).","Paso 2: escribir el nombre del holding, el nombre y RUC de la empresa, y el nombre/direccion de la sucursal principal.","Tocar 'Completar configuracion'.","Ver la pantalla de 'Configuracion completa' con el resumen y tocar 'Entrar al sistema'."],"note":"Este asistente solo se puede usar una vez, mientras el sistema este vacio."}],"business_rules":["El paso 1 (crear administrador) solo se permite cuando NO existe ningun usuario en el sistema; si ya existe alguno, responde 'Sistema ya inicializado'.","El usuario no puede repetirse y el correo, si se ingresa, tampoco; ambas contrasenas deben coincidir.","La contrasena debe pasar la politica de seguridad (longitud y clases de caracteres); el medidor del frontend se alimenta de la misma politica del backend para no desincronizarse.","El administrador inicial queda como is_staff y is_superuser, y NO se le obliga a cambiar la contrasena.","El paso 2 (crear organizacion) exige estar autenticado y solo se permite si todavia no existe ningun holding activo; si ya existe, responde 'Bootstrap ya realizado'.","Al crear la organizacion se siembra el catalogo de roles y permisos (idempotente), se crea holding -> empresa -> sucursal, se da membresia del usuario a la empresa, se le asigna el rol company_admin y se le otorgan todas las capacidades de administracion sobre esa empresa.","La jerarquia es estricta: el holding no tiene padre, la empresa cuelga del holding y la sucursal cuelga de la empresa."],"permissions":["Sin permiso: el arranque es publico (requiresAuth: false) pero solo opera cuando el sistema esta vacio.","El paso 2 exige sesion iniciada (la cuenta recien creada)."],"routes":[{"path":"/bootstrap","name":"Asistente de arranque","purpose":"Crear el primer administrador y la organizacion inicial (holding, empresa, sucursal)."}],"faqs":[{"q":"Como arranco el sistema desde cero?","a":"Entra a /bootstrap (o a /login y toca 'Crear usuario inicial'), crea el administrador en el paso 1 y la organizacion en el paso 2."},{"q":"Por que ya no me sale el asistente de arranque?","a":"Porque el sistema ya tiene al menos un usuario. El asistente solo aparece cuando esta completamente vacio; el resto del tiempo te manda a iniciar sesion."},{"q":"Mi contrasena no es aceptada, que falta?","a":"Debe tener al menos 10 caracteres e incluir al menos 3 de estos cuatro tipos: minusculas, mayusculas, numeros y simbolos. El medidor te muestra que requisitos faltan."}]},{"id":"login-2fa","name":"Inicio de sesion, verificacion en dos pasos (2FA) y bloqueo por intentos","icon":"🔑","one_liner":"Pantalla de ingreso con usuario y contrasena, segundo factor TOTP para administradores y bloqueo automatico tras varios intentos fallidos.","what_it_does":"Es la puerta de entrada al sistema. El usuario escribe su usuario y contrasena; puede pedir que se recuerde su nombre de usuario (nunca la contrasena) en ese navegador. Si la cuenta es de administrador y tiene activada la verificacion en dos pasos, despues de la contrasena se pide un codigo de 6 digitos de su aplicacion de autenticacion (TOTP). Tras varios intentos fallidos seguidos, el sistema bloquea temporalmente el acceso para frenar ataques de fuerza bruta. Cada intento (exitoso o fallido) y cada bloqueo quedan registrados en la bitacora de auditoria.","key_features":["Ingreso con usuario (o correo) y contrasena; opcion 'Recordar usuario' que guarda solo el nombre en el navegador.","Boton para mostrar/ocultar la contrasena.","Si el sistema esta recien instalado, muestra un aviso y un boton para ir al asistente de arranque.","Verificacion en dos pasos (2FA / TOTP) obligatoria para cuentas de administrador que la tengan activada.","El reto 2FA es de un solo uso, vence en minutos y se ata a la IP y al navegador que inicio sesion (anti-reenvio).","Bloqueo automatico por intentos fallidos (django-axes): tras superar el limite, el acceso se bloquea temporalmente.","Tras entrar, el sistema decide a donde llevarte: cambio de contrasena obligatorio, asistente de configuracion, selector de empresa o el inicio."],"flows":[{"title":"Iniciar sesion (con 2FA si aplica)","steps":["Abrir /login.","Escribir usuario y contrasena (opcional: marcar 'Recordar usuario').","Tocar 'Ingresar'.","Si la cuenta es admin con 2FA activado: abrir la app de autenticacion, leer el codigo de 6 digitos e ingresarlo en /login/2fa, luego 'Verificar'.","El sistema te lleva al inicio, al selector de empresa o a cambiar contrasena segun corresponda."],"note":"Solo las cuentas de administrador pueden usar 2FA; un usuario comun entra solo con contrasena."}],"business_rules":["Credenciales invalidas o usuario inactivo se rechazan con codigo de auditoria INVALID_CREDENTIALS o USER_DISABLED respectivamente.","El 2FA solo se exige a cuentas administradoras (is_staff o is_superuser) que tengan totp_enabled activado.","El reto 2FA se firma con marca de tiempo, vence segun TOTP_CHALLENGE_TTL, es de un solo uso (se borra al consumirlo) y se rechaza si cambia la IP o el navegador respecto al login.","El codigo TOTP se valida con una ventana de tolerancia configurada (TOTP_VALID_WINDOW).","Bloqueo por intentos: tras varios fallos seguidos el sistema responde 429 y registra AUTH_LOCKOUT_TRIGGERED con motivo RATE_LIMITED.","El login ignora cualquier token/cookie entrante para evitar que una sesion vieja expirada deje al usuario trabado sin poder reingresar.","Se registran en bitacora: AUTH_LOGIN_SUCCESS, AUTH_LOGIN_FAILURE, AUTH_2FA_CHALLENGE, AUTH_2FA_VERIFIED, AUTH_2FA_FAILED y AUTH_LOCKOUT_TRIGGERED.","La opcion 'Recordar usuario' guarda unicamente el nombre de usuario en el navegador, jamas la contrasena."],"permissions":["Sin permiso: pantallas publicas (requiresAuth: false). El control real es la autenticacion misma.","Activar/confirmar/desactivar el 2FA esta reservado a cuentas de administrador."],"routes":[{"path":"/login","name":"Inicio de sesion","purpose":"Ingresar con usuario y contrasena."},{"path":"/login/2fa","name":"Verificacion 2FA","purpose":"Ingresar el codigo de 6 digitos de la app de autenticacion (solo administradores con 2FA)."}],"faqs":[{"q":"Como inicio sesion?","a":"Entra a /login, escribe tu usuario y contrasena y toca 'Ingresar'. Si eres admin con 2FA, despues ingresa el codigo de tu app de autenticacion."},{"q":"Que hago si el sistema me bloqueo por intentos fallidos?","a":"Espera el tiempo de enfriamiento del bloqueo e intenta de nuevo con la contrasena correcta. El bloqueo es automatico tras varios intentos seguidos y queda registrado en la bitacora."},{"q":"Por que me pide un codigo despues de la contrasena?","a":"Porque tu cuenta es de administrador y tiene activada la verificacion en dos pasos. El codigo lo genera tu aplicacion de autenticacion (TOTP) y cambia cada pocos segundos."},{"q":"Si marco 'Recordar usuario', guarda mi contrasena?","a":"No. Solo guarda tu nombre de usuario en ese navegador para no tener que escribirlo; la contrasena nunca se guarda."}]},{"id":"password-change","name":"Cambio de contrasena obligatorio","icon":"🔁","one_liner":"Pantalla que obliga a un usuario a cambiar su contrasena provisional antes de seguir usando el sistema.","what_it_does":"Cuando un administrador da de alta a un empleado con una contrasena provisional, el sistema obliga a ese usuario a cambiarla la primera vez que entra. La pantalla pide la contrasena actual, la nueva (con medidor de fortaleza) y su confirmacion. Hasta que no la cambie, el sistema lo mantiene en esta pantalla.","key_features":["Solicita contrasena actual, nueva contrasena y confirmacion.","Medidor de fortaleza alineado a la politica real del backend.","Boton para mostrar/ocultar las contrasenas.","Al cambiarla con exito, levanta la marca 'debe cambiar contrasena' y deja entrar al sistema."],"flows":[{"title":"Cambiar la contrasena provisional","steps":["Tras iniciar sesion, el sistema redirige a /password-change si la cuenta lo requiere.","Escribir la contrasena actual (la provisional que dio el administrador).","Escribir la nueva contrasena hasta que cumpla la politica (medidor en verde).","Confirmar la nueva contrasena.","Tocar 'Actualizar contrasena'.","El sistema confirma y lleva al inicio."],"note":"Aplica a empleados creados por un administrador con contrasena provisional."}],"business_rules":["Se valida que la contrasena actual sea correcta; si no, responde 'Incorrecta' (auditado como INVALID_OLD_PASSWORD).","La nueva contrasena debe pasar la politica de seguridad; si se ingresa confirmacion, debe coincidir.","Al cambiarla, se baja la marca must_change_password y el cambio queda auditado como AUTH_PASSWORD_CHANGED.","Requiere estar autenticado."],"permissions":["requiresAuth: true (cualquier usuario autenticado que tenga pendiente el cambio)."],"routes":[{"path":"/password-change","name":"Cambiar contrasena","purpose":"Cambiar la contrasena provisional por una definitiva."}],"faqs":[{"q":"Por que el sistema me obliga a cambiar la contrasena al entrar?","a":"Porque tu cuenta fue creada con una contrasena provisional. Por seguridad debes definir una propia antes de continuar."},{"q":"Que pongo en 'contrasena actual'?","a":"La contrasena provisional que te dio el administrador al crear tu usuario."}]},{"id":"select-context","name":"Selector de contexto (empresa y sucursal)","icon":"🏢","one_liner":"Pantalla para elegir en que empresa y sucursal vas a trabajar cuando tu usuario tiene acceso a mas de una.","what_it_does":"Como Necktral es multi-empresa, un mismo usuario puede tener acceso a varias empresas del grupo y a sus sucursales. Esta pantalla aparece cuando hay mas de una empresa disponible y aun no se eligio contexto: lista las empresas y, dentro de cada una, sus sucursales (o la opcion 'Toda la empresa'). Lo que el usuario elija fija el contexto activo, y a partir de ahi todo lo que haga (ver, crear, registrar) queda dentro de esa empresa/sucursal. Tambien hay un selector de contexto en la barra superior del sistema para cambiar sobre la marcha.","key_features":["Lista expandible de empresas; dentro de cada empresa, sus sucursales.","Opcion 'Toda la empresa (sin sucursal)' para trabajar a nivel empresa.","Si solo hay una empresa, se abre automaticamente.","Aviso 'Sin empresas disponibles' cuando el usuario no tiene membresias activas (lo manda a contactar al administrador).","Boton para salir y entrar con otro usuario.","El contexto elegido se recuerda en el navegador para las siguientes operaciones."],"flows":[{"title":"Elegir empresa y sucursal de trabajo","steps":["Tras iniciar sesion, si tienes mas de una empresa el sistema te lleva a /select-context.","Tocar la empresa para desplegar sus sucursales.","Elegir una sucursal, o 'Toda la empresa (sin sucursal)'.","El sistema fija ese contexto y te lleva al inicio.","Para cambiar luego, usar el selector de contexto en la barra superior."],"note":"Todo lo que registres queda en la empresa/sucursal activa que elijas."}],"business_rules":["El selector solo se exige cuando el usuario tiene acceso a mas de una empresa y todavia no hay una empresa activa elegida.","El backend resuelve el contexto efectivo a partir de las cabeceras X-Company-Id / X-Branch-Id, validando que la empresa/sucursal este entre las accesibles del usuario.","Si el contexto pedido no es valido, se cae a la empresa recomendada o a la primera accesible.","El acceso a las empresas se basa en membresias activas (UserMembership); sin membresia activa, no aparece ninguna empresa.","El contexto se guarda localmente y viaja en cada peticion para aislar los datos por empresa/sucursal."],"permissions":["requiresAuth: true (cualquier usuario autenticado).","La lista de empresas/sucursales depende de las membresias del usuario, no de un permiso especifico."],"routes":[{"path":"/select-context","name":"Elegir empresa","purpose":"Seleccionar la empresa y sucursal activa de trabajo."}],"faqs":[{"q":"Como cambio de empresa o sucursal?","a":"Si tienes acceso a varias, al entrar el sistema te muestra el selector. Para cambiar despues, usa el selector de contexto en la barra de arriba."},{"q":"Me sale 'Sin empresas disponibles', que hago?","a":"Tu usuario no tiene membresias activas en ninguna empresa. Contacta al administrador para que te de acceso a una empresa."},{"q":"Que significa 'Toda la empresa (sin sucursal)'?","a":"Que trabajaras a nivel de toda la empresa y no de una sucursal especifica. Es util para roles que aplican a la empresa completa."}]},{"id":"enrolar-dispositivo","name":"Enrolamiento de dispositivo","icon":"📱","one_liner":"Pantalla para registrar (enrolar) este aparato con un codigo de un solo uso, de modo que sus acciones queden identificadas.","what_it_does":"Permite que un aparato (celular o tableta, sobre todo en la app movil) quede registrado en el sistema usando un codigo de enrolamiento que genera el administrador desde la web (modulo Dispositivos -> 'Generar codigo'). El codigo es de un solo uso y vence en minutos; puede escribirse a mano o, en la app nativa, escanearse por QR con la camara. Una vez enrolado, las acciones realizadas desde ese aparato quedan identificadas con su ID en la bitacora de auditoria. Tambien permite 'olvidar' el enrolamiento local en ese aparato.","key_features":["Enrolamiento con codigo de un solo uso provisto por el administrador.","Escaner de QR de la camara en la app nativa; ingreso manual del codigo en navegador.","Campo para ponerle un nombre al aparato (ej. 'Cel del mandador').","Reconoce si el aparato ya esta enrolado y muestra su ID y fecha de enrolamiento.","Opcion para 'olvidar' el enrolamiento local (la revocacion del lado del servidor se hace en la web, modulo Dispositivos).","El QR puede venir como deep link, enlace web o codigo pelado; el sistema extrae el codigo de cualquiera de los tres."],"flows":[{"title":"Enrolar este aparato","steps":["Pedir al administrador que genere un codigo de enrolamiento (web -> Dispositivos -> 'Generar codigo').","Abrir /enrolar en el aparato.","En la app nativa, tocar 'Escanear codigo QR'; en navegador, escribir el codigo a mano.","Ponerle un nombre al aparato.","Tocar 'Enrolar dispositivo'.","Ver la confirmacion de que el aparato quedo enrolado."],"note":"El codigo es de un solo uso y vence en minutos; si caduca, pedir uno nuevo."}],"business_rules":["El codigo de enrolamiento es de un solo uso y vence en minutos; si es invalido, vencido o ya usado, el enrolamiento falla y hay que pedir uno nuevo.","La revocacion de un dispositivo del lado del servidor se hace desde la web (modulo Dispositivos), no desde esta pantalla; aqui solo se 'olvida' la identidad localmente.","En la bitacora, el ID de dispositivo enviado por el cliente (X-Device-Id) solo se acepta si corresponde a un dispositivo ACTIVO de la misma empresa; si no, se ignora.","El escaner de camara solo esta disponible en la app nativa (APK); en navegador se usa el codigo manual."],"permissions":["requiresAuth: false (la pantalla de enrolar es publica; la autorizacion la da el codigo de un solo uso).","Generar el codigo y administrar/revocar dispositivos exige el permiso sync.device.enroll (modulo Dispositivos en la web)."],"routes":[{"path":"/enrolar","name":"Enrolar dispositivo","purpose":"Registrar este aparato con un codigo de un solo uso."}],"faqs":[{"q":"Como enrolo un celular?","a":"Pedi al administrador un codigo de enrolamiento (web -> Dispositivos -> Generar codigo), abri /enrolar en el celular, escanea el QR o escribi el codigo, ponele un nombre al aparato y toca 'Enrolar dispositivo'."},{"q":"El codigo me dice que es invalido o vencido.","a":"Es de un solo uso y vence en minutos. Pedi al administrador que genere uno nuevo."},{"q":"Como dejo de usar un aparato enrolado?","a":"En el aparato puedes tocar 'Olvidar enrolamiento'. Para revocarlo de verdad en el servidor, el administrador lo hace desde la web, en el modulo Dispositivos."}]},{"id":"organizacion","name":"Organizacion (empresas, sucursales, modulos y relaciones)","icon":"🗂️","one_liner":"Centro para administrar las empresas del grupo, sus sucursales, que modulos usa cada empresa y las relaciones entre empresas.","what_it_does":"Es donde el administrador gestiona la estructura del grupo. Tiene varias pestanas: Empresas (lista de las empresas accesibles, con su RUC y estado, y boton para crear una nueva), Perfil de la empresa (datos legales de la empresa activa que aparecen en planillas, facturas y reportes), Sucursales (crear y editar sucursales de la empresa activa), Modulos (encender o apagar que modulos usa cada empresa, lo que muestra u oculta opciones del menu) y Relaciones (declarar vinculos entre empresas, ej. la finca con el beneficio, solo el vinculo sin montos ni cuentas). Todo opera sobre la empresa activa del selector superior.","key_features":["Empresas: lista de empresas accesibles con nombre, codigo, razon social, RUC y estado (activa/inactiva); crear nueva empresa.","Al crear una empresa, el creador queda con acceso inmediato y se le clonan sus roles y capacidades de la empresa actual.","Perfil de la empresa activa: razon social, RUC, direccion, telefono y correo (editable solo con permiso).","Sucursales: crear y editar sucursales (nombre, codigo, direccion, telefono, correo, activa/inactiva).","Modulos por empresa agrupados en Nucleo (siempre encendidos), Operacion, Finanzas y Verticales; se encienden/apagan con un interruptor.","Los modulos del nucleo (CORE) no se pueden apagar; apagar un modulo lo quita del menu para todos los usuarios de esa empresa.","Relaciones entre empresas: declarar el vinculo (tipo: Contabilidad, Inventario, CxC, CxP u Otro) con una nota, sin montos ni cuentas.","Cada cambio recarga la sesion para que el menu y el selector reaccionen al instante."],"flows":[{"title":"Crear una empresa nueva en el grupo","steps":["Entrar a /organizacion, pestana 'Empresas'.","Tocar 'Nueva empresa'.","Llenar al menos el nombre (y opcionalmente codigo, razon social, RUC, direccion, telefono, correo).","Tocar 'Crear empresa'.","La empresa aparece en la lista y queda accesible para tu usuario con tus mismos roles."],"note":"Requiere el permiso org.company.create. Cada empresa tiene su propio RUC y sus propios modulos."},{"title":"Encender o apagar un modulo de la empresa","steps":["Entrar a /organizacion, pestana 'Modulos'.","Ubicar el modulo en su categoria (Operacion, Finanzas, Verticales).","Mover el interruptor para encenderlo o apagarlo.","El sistema confirma y actualiza el menu al instante."],"note":"Los modulos del Nucleo no se pueden apagar. Si un modulo depende de otro que esta apagado, el sistema avisa (error 409) cual falta."},{"title":"Declarar una relacion entre dos empresas","steps":["Entrar a /organizacion, pestana 'Relaciones'.","Tocar 'Nueva relacion'.","Elegir Empresa A y Empresa B (deben ser distintas) y el tipo de relacion.","Opcionalmente escribir una nota.","Tocar 'Crear relacion'."],"note":"Solo declara el vinculo: los montos y la contabilidad NO se configuran aqui."}],"business_rules":["Todo lo que se ve y edita aplica a la empresa activa del selector superior.","La lista de empresas solo muestra las accesibles para el usuario (segun membresias); no se ven empresas ajenas.","No se permiten dos empresas con el mismo nombre dentro del mismo holding (responde 409 conflicto).","Al crear una empresa, al creador se le da membresia inmediata y se le clonan sus roles y capacidades de administracion desde su empresa actual.","Editar el perfil de la empresa exige org.company.update; verlo exige org.company.read; sin permiso, queda en solo lectura.","Encender/apagar modulos exige org.module.manage; el catalogo distingue modulos CORE (no apagables) del resto, y valida dependencias entre modulos (409 si falta una).","La habilitacion de modulos es la decision de negocio 'que usa esta empresa' y es independiente del acceso por permisos (que sigue gobernado por RBAC).","Las relaciones entre empresas solo pueden declararse entre empresas accesibles del usuario; la empresa A y la B deben ser distintas; la unicidad del par la valida la base (409 si ya existe).","Las relaciones solo declaran el vinculo (sin montos ni cuentas); la contabilidad va aparte.","Cada accion (crear empresa, crear/editar sucursal, editar perfil, cambiar modulos, crear/editar/quitar relacion) queda auditada (ORG_COMPANY_CREATED, ORG_BRANCH_CREATED, ORG_BRANCH_UPDATED, ORG_COMPANY_PROFILE_UPDATED, ORG_INTERCOMPANY_RELATIONSHIP_*)."],"permissions":["org.company.read (entrar a la pantalla y ver empresas/perfil)","org.company.create (crear empresa)","org.company.update (editar perfil de la empresa y branding)","org.branch.read (ver sucursales)","org.branch.create (crear sucursal)","org.branch.update (editar sucursal)","org.module.read (ver modulos y relaciones)","org.module.manage (encender/apagar modulos y administrar relaciones)"],"routes":[{"path":"/organizacion","name":"Organizacion","purpose":"Administrar empresas, perfil, sucursales, modulos y relaciones entre empresas (entra con ?tab=relaciones para esa pestana)."}],"faqs":[{"q":"Como agrego una empresa nueva al grupo?","a":"En /organizacion, pestana Empresas, toca 'Nueva empresa', llena al menos el nombre y crea. Necesitas el permiso de crear empresas."},{"q":"Como cambio el RUC o los datos legales de mi empresa?","a":"En /organizacion, pestana 'Perfil de la empresa', edita los campos y toca 'Guardar perfil'. Necesitas permiso de editar empresa; si no, lo ves en solo lectura."},{"q":"Apague un modulo y ya no aparece en el menu, esta bien?","a":"Si. Apagar un modulo lo quita del menu para todos los usuarios de esa empresa. Los modulos del Nucleo no se pueden apagar."},{"q":"Para que sirven las 'Relaciones entre empresas'?","a":"Para declarar que dos empresas del grupo se relacionan (por ejemplo la finca con el beneficio). Solo registra el vinculo y su tipo; no maneja montos ni cuentas."}]},{"id":"usuarios-rbac","name":"Usuarios y acceso (roles y permisos)","icon":"👥","one_liner":"Administra quien entra a la empresa y con que roles, asignando o quitando roles por empresa o por sucursal.","what_it_does":"Muestra los usuarios que tienen acceso a la empresa activa (y a sus sucursales), con su estado, sus roles y un boton para ver sus permisos efectivos. Permite asignar un rol a un usuario eligiendo el alcance (toda la empresa o una sucursal especifica) y revocar roles. Los roles agrupan permisos (catalogo sembrado: company_admin, branch_manager, hr_manager, auditor, controls_officer, etc.). Ver los permisos efectivos de un usuario muestra exactamente que puede hacer hoy en esa empresa, sumando todos sus roles.","key_features":["Lista de usuarios con acceso a la empresa activa: usuario, correo, estado (activo/inactivo) y sus roles.","Buscador por usuario o correo.","Asignar rol a un usuario eligiendo el alcance: toda la empresa o una sucursal concreta.","Revocar un rol (deja de tener esos permisos al instante).","Ver permisos efectivos: la suma de todos los permisos que el usuario tiene en esa empresa hoy.","Cada rol muestra en un tooltip si aplica a Empresa o a Sucursal y a cual.","El catalogo de roles trae descripciones (ej. 'Auditor: lectura de auditoria y reportes')."],"flows":[{"title":"Asignar un rol a un usuario","steps":["Entrar a /usuarios.","Buscar al usuario y tocar 'Asignar rol' en su fila.","Elegir el rol del catalogo.","Elegir el alcance: 'Toda la empresa' o una sucursal especifica.","Tocar 'Asignar'.","El rol aparece como una etiqueta en la fila del usuario."],"note":"Requiere el permiso rbac.assignments.update."},{"title":"Quitar (revocar) un rol","steps":["Entrar a /usuarios.","En la fila del usuario, tocar la X de la etiqueta del rol a quitar.","Confirmar en el dialogo.","El usuario deja de tener esos permisos al instante."],"note":"La revocacion no borra el historial: desactiva la asignacion y queda auditada."},{"title":"Ver los permisos efectivos de un usuario","steps":["Entrar a /usuarios.","En la fila del usuario, tocar 'Permisos'.","Revisar la lista de codigos de permiso que el usuario tiene hoy en esa empresa."],"note":"Muestra la suma de todos los roles del usuario en el contexto activo."}],"business_rules":["Solo se listan usuarios con membresia activa en la empresa (o sus sucursales) del contexto activo.","Ver la pantalla exige rbac.assignments.read; asignar/revocar exige rbac.assignments.update.","El alcance de un rol solo puede ser la propia empresa o una sucursal hija de esa empresa (no se permite fuera del scope activo).","Un rol solo puede asignarse a un org_unit de tipo COMPANY o BRANCH.","La asignacion es idempotente: si ya existia inactiva, se reactiva; queda registrada con su origen (MANUAL/POSITION/SYSTEM).","Revocar un rol lo desactiva (no lo borra) y el usuario pierde esos permisos de inmediato.","Cada asignacion y revocacion queda auditada (RBAC_ROLE_ASSIGNED / RBAC_ROLE_REVOKED) con la empresa y el usuario objetivo.","Un superusuario tiene permiso total ('*'); el resto suma los permisos de sus roles activos.","El catalogo de roles y permisos se siembra de forma idempotente al arrancar la organizacion (seed_rbac_v01)."],"permissions":["rbac.assignments.read (ver usuarios y sus roles, ver permisos efectivos)","rbac.assignments.update (asignar y revocar roles)","org.branch.read (para ofrecer sucursales como alcance al asignar)","rbac.roles.read / rbac.permissions.read (catalogos de roles y permisos)"],"routes":[{"path":"/usuarios","name":"Usuarios y acceso","purpose":"Ver usuarios de la empresa, asignar/revocar roles por empresa o sucursal y consultar permisos efectivos."}],"faqs":[{"q":"Como le doy acceso a un empleado a un modulo?","a":"En /usuarios, busca al usuario, toca 'Asignar rol', elige el rol que agrupa esos permisos y el alcance (empresa o sucursal) y toca 'Asignar'."},{"q":"Como limito un rol a una sola sucursal?","a":"Al asignar el rol, en 'Alcance' elige la sucursal en lugar de 'Toda la empresa'. El rol solo aplicara ahi."},{"q":"Como veo exactamente que puede hacer un usuario?","a":"En su fila toca 'Permisos': el sistema muestra la lista de permisos efectivos (la suma de todos sus roles en esa empresa)."},{"q":"Si le quito un rol a alguien, cuando deja de tener acceso?","a":"Al instante. La revocacion desactiva la asignacion de inmediato y queda registrada en la bitacora."}]},{"id":"auditoria","name":"Bitacora de auditoria","icon":"📜","one_liner":"Registro inmutable y encadenado criptograficamente de todo lo que pasa en el sistema; solo lectura.","what_it_does":"Es el libro de eventos del sistema: cada accion relevante (inicios de sesion, bloqueos, cambios de contrasena, asignacion de roles, creacion de empresas/sucursales, hallazgos de control, etc.) queda registrada con su fecha, modulo, tipo de evento, resultado, usuario, ruta y datos de contexto. Los registros no se pueden editar ni borrar: cada evento lleva un hash y una firma (HMAC) y se encadena con el evento anterior de su particion (por empresa), de modo que cualquier alteracion se detecta. La pantalla permite filtrar y ver el detalle completo de cada evento en formato tecnico.","key_features":["Tabla de eventos con fecha, modulo, evento, resultado, usuario y ruta.","Filtros por tipo de evento, modulo, ID de usuario, tipo de sujeto, ruta contiene, y rango de fechas (desde/hasta).","Paginacion 'Cargar mas' (cursor) para recorrer grandes volumenes.","Detalle completo de cada evento al hacer clic (JSON con todos los campos, incluida la integridad).","Cadena de integridad: cada evento tiene hash propio, firma HMAC y referencia al hash del evento anterior.","Las cadenas se particionan por empresa (COMPANY:\u003cid>) para aislar la bitacora de cada tenant.","Datos sensibles se sanitizan antes de guardarse (redaccion) en metadatos y snapshots."],"flows":[{"title":"Buscar y revisar un evento de auditoria","steps":["Entrar a /auditoria.","Abrir 'Filtros' y acotar por tipo de evento, modulo, usuario, ruta o rango de fechas.","Tocar 'Buscar'.","Tocar una fila para abrir el detalle completo del evento.","Usar 'Cargar mas' si se necesita ver eventos mas antiguos."],"note":"Es solo lectura: la bitacora no se puede editar ni borrar."}],"business_rules":["La bitacora es inmutable: los eventos no se editan ni se borran.","Cada evento se firma: event_hash = SHA256 del payload canonico, signature = HMAC del hash; se guarda tambien el id de la clave usada.","Los eventos se encadenan por particion (prev_event_hash apunta al evento anterior) para detectar alteraciones u omisiones.","La particion se deriva del contexto: COMPANY:\u003cid> por empresa, o SYSTEM para eventos globales; el usuario solo ve la particion de su empresa activa.","La verificacion de integridad recalcula hashes y firmas y valida la cadena (un unico genesis, un unico tail, sin ciclos ni desconexiones).","La pantalla exige el permiso audit.read; el detalle puede incluir los campos de integridad.","La IP registrada se toma del ultimo valor de X-Forwarded-For (la que escribe el proxy) para evitar falsificacion.","El ID de dispositivo solo se registra si corresponde a un dispositivo ACTIVO de la misma empresa."],"permissions":["audit.read (ver la bitacora y el detalle de eventos)","audit.export (exportar auditoria; permiso del catalogo)"],"routes":[{"path":"/auditoria","name":"Bitacora de auditoria","purpose":"Consultar el registro inmutable de eventos del sistema, con filtros y detalle."}],"faqs":[{"q":"Como busco quien hizo cierta accion?","a":"Entra a /auditoria, abre Filtros, pon el ID del usuario o el tipo de evento y el rango de fechas, y toca Buscar. Toca una fila para ver el detalle."},{"q":"Se puede editar o borrar un registro de la bitacora?","a":"No. La bitacora es inmutable: cada evento esta firmado y encadenado con el anterior, asi que cualquier cambio se detectaria."},{"q":"Por que solo veo eventos de mi empresa?","a":"Porque la bitacora se particiona por empresa. Cada empresa ve solo su propia cadena de eventos."},{"q":"Que es el encadenamiento por hashes?","a":"Cada evento guarda el hash del evento anterior, formando una cadena. Si alguien alterara un registro, la cadena dejaria de cuadrar y se detectaria la manipulacion."}]},{"id":"controles-sod","name":"Controles anti-fraude (segregacion de funciones / SoD)","icon":"🛡️","one_liner":"Tablero que detecta combinaciones peligrosas de permisos y acciones (segregacion de funciones) y gestiona los hallazgos con su triage.","what_it_does":"Es el panel de control interno contra el fraude. Trabaja sobre una matriz de reglas de segregacion de funciones (SoD): pares de permisos o acciones que NO deberia tener/realizar la misma persona (por ejemplo, crear empleados y aprobar la planilla, o emitir y anular facturas). Tiene tres pestanas: Violaciones vivas (usuarios que HOY tienen pares de permisos incompatibles), Hallazgos (violaciones detectadas, con su estado y su triage) y Reglas SoD (el catalogo de reglas con su severidad). Un boton 'Escanear' corre los detectores y materializa hallazgos nuevos. Esta dirigido al oficial de control interno o al administrador.","key_features":["Pestana Violaciones vivas: usuarios que actualmente poseen ambos permisos de un par incompatible, con su severidad.","Pestana Hallazgos: violaciones materializadas, con control, severidad, estado y boton de triage.","Pestana Reglas SoD: catalogo de reglas (codigo, permiso A, permiso B, severidad).","Boton 'Escanear' que corre dos detectores: por concesion (posee ambos permisos) y por ejercicio (realizo ambas acciones en la bitacora dentro de una ventana de dias).","Triage de un hallazgo: Reconocido (se investiga), Resuelto (se corrigio) o Descartado (falso positivo).","Reglas estandar sembradas: empleado fantasma, emitir/anular facturas, crear pagos/aprobar reembolsos, crear/mayorizar compras, capturar/aprobar asistencia, autoconcederse poderes.","Severidades: Baja, Media, Alta, Critica.","Si un usuario tiene super-permiso ('*'), se reporta como violacion de todas las reglas activas (concentra todo el poder)."],"flows":[{"title":"Detectar y revisar violaciones de segregacion de funciones","steps":["Entrar a /controles.","Revisar la pestana 'Violaciones vivas' para ver quien tiene hoy permisos incompatibles.","Tocar 'Escanear' para correr los detectores y materializar hallazgos nuevos.","Ir a la pestana 'Hallazgos' y revisar los detectados.","En un hallazgo abierto, tocar 'Triage' y elegir Reconocido, Resuelto o Descartado.","El sistema aplica la decision y la deja registrada."],"note":"Escanear y hacer triage exige el permiso controls.findings.manage."}],"business_rules":["Una regla SoD requiere dos permisos distintos; puede ser global (aplica a todas las empresas) o propia de una empresa.","Detector por concesion: marca al usuario que posee ambos permisos del par incompatible en cualquier alcance de la empresa.","Detector por ejercicio: cruza la bitacora (particion de la empresa) y marca al usuario que realizo ambas acciones incompatibles dentro de la ventana (por defecto 90 dias).","Quien tiene super-permiso ('*') se reporta como violacion de todas las reglas activas.","Los hallazgos son idempotentes por clave de deduplicacion: no se duplican; cada hallazgo nuevo se audita (CONTROL_FINDING_RAISED).","El triage solo admite Reconocido, Resuelto o Descartado; Resuelto/Descartado registran quien resolvio y cuando, y se audita (CONTROL_FINDING_RESOLVED).","Ver el tablero exige controls.sod.read; ver hallazgos exige controls.findings.read; escanear y resolver exige controls.findings.manage; gestionar reglas exige controls.sod.manage.","Las reglas refuerzan principios maker-checker: quien crea no aprueba, quien captura no aprueba, etc.","Reglas estandar sembradas incluyen: ghost_employee (crear empleado vs aprobar planilla - Critica), invoice_create_void (Alta), payment_create_refund (Alta), procurement_create_post (Alta), field_capture_approve (Media), self_grant_power (administrar roles vs crear empresas - Critica)."],"permissions":["controls.sod.read (entrar al tablero, ver reglas y violaciones vivas)","controls.findings.read (ver hallazgos)","controls.findings.manage (escanear y hacer triage de hallazgos)","controls.sod.manage (gestionar las reglas de segregacion)"],"routes":[{"path":"/controles","name":"Controles anti-fraude","purpose":"Ver reglas SoD, violaciones vivas y hallazgos, correr escaneos y hacer triage."}],"faqs":[{"q":"Que es la segregacion de funciones (SoD)?","a":"Es el principio de que una sola persona no debe concentrar funciones incompatibles, como crear empleados y aprobar la planilla, o emitir y anular facturas. El tablero detecta cuando alguien rompe esa regla."},{"q":"Como detecto si alguien tiene permisos peligrosos?","a":"En /controles, mira 'Violaciones vivas' para ver quien tiene hoy pares de permisos incompatibles, o toca 'Escanear' para generar hallazgos formales."},{"q":"Que hago con un hallazgo?","a":"Toca 'Triage' y eligi: Reconocido (lo vas a investigar), Resuelto (ya se corrigio) o Descartado (es falso positivo)."},{"q":"Por que aparece el administrador violando todas las reglas?","a":"Porque un usuario con super-permiso concentra todo el poder; por diseno se reporta como violacion de todas las reglas activas. Es el caso limite que el control quiere visibilizar."}]}],"uncertainties":["Los valores exactos de configuracion de seguridad (limite de intentos de bloqueo de django-axes, tiempo de enfriamiento, TOTP_CHALLENGE_TTL, TOTP_VALID_WINDOW, niveles de la politica de contrasenas) viven en config/settings, que NO esta incluido en el snapshot del repositorio analizado; se documentan los comportamientos pero no los numeros precisos (el default del medidor de contrasena es 10 caracteres / 3 clases).","La activacion/confirmacion del 2FA tiene endpoints en el backend (/auth/2fa/enable/, /auth/2fa/confirm/, /auth/2fa/disable/) reservados a administradores, pero no encontre una pantalla .vue dedicada para configurar el 2FA dentro de las carpetas del area; podria estar en otro modulo (ej. perfil) fuera del alcance leido.","La generacion del codigo de enrolamiento y la revocacion de dispositivos del lado del servidor ocurren en el modulo Dispositivos (/dispositivos, permiso sync.device.enroll), que no fue leido en detalle en esta area; se documenta solo lo que la pantalla /enrolar indica.","El branding por empresa/holding (OrgBrandingView, logo en topbar) existe en el backend y en la sesion, pero no observe una pestana o pantalla dedicada de branding dentro de OrganizacionPage.vue; podria editarse desde otra pantalla no incluida en el area."]},{"area_id":"ventas-caja-facturacion","area_title":"Ventas, Caja y Facturación","area_summary":"Cubre todo el ciclo de venta del negocio: el punto de venta de mostrador (escanear, cobrar de contado o al crédito, devoluciones y reimpresiones), el autoservicio en tableta/kiosko, la facturación con configuración fiscal, el control de la caja (apertura, arqueo y cierre con diferencias), los intentos de pago, la conciliación bancaria y el directorio de terceros (clientes y proveedores). Es donde entra el dinero, se baja inventario y se generan las cuentas por cobrar.","icon":"🧾","modules":[{"id":"caja-venta-pos","name":"Caja de Venta (Punto de venta)","icon":"🛒","one_liner":"Vendé de mostrador escaneando productos y cobrás de contado o al crédito; cada venta es una factura real que baja inventario y entra a la sesión de caja.","what_it_does":"Es la pantalla del cajero para vender mercadería de mostrador. Escaneás el código de barras o tocás el producto en el grid por categoría, el sistema pone el precio del catálogo (con mayoreo automático según la cantidad), y cobrás de contado (efectivo, transferencia, tarjeta, cheque o pago mixto) o al crédito si el cliente tiene cuenta. Cada venta confirmada genera una factura, baja el inventario y registra el dinero en la sesión de caja abierta.\n\nEstá pensada para ir rápido: el cursor vuelve solo al campo del escáner, hay atajos de teclado (F2 cobrar, F4 cliente, F6 auto-factura), tickets en espera para atender a varios clientes a la vez, e impresión de un ticket de 80mm. También permite hacer el corte de ventas del día, devoluciones (notas de crédito) y traer una auto-factura que el cliente armó en la tableta.","key_features":["Escaneo por código de barras o búsqueda por nombre, más grid táctil de productos por categoría con aviso de stock bajo o agotado","Precio resuelto por el catálogo con mayoreo automático cuando se alcanza la cantidad mínima","Cobro de contado (efectivo con cálculo de vuelto, transferencia, tarjeta, cheque) o pago mixto, o al crédito contra la cuenta del cliente","Autorización de supervisor para cambiar precio o aplicar descuento cuando el cajero no tiene ese permiso","Tickets en espera, corte de ventas del día, devolución por nota de crédito y traer auto-factura por código","Venta idempotente: un reintento de red con la misma operación no duplica la factura, el despacho ni el cobro"],"flows":[{"title":"Vender de contado en efectivo","steps":["Verificá arriba que diga 'Caja abierta'; si no, abrí la sesión de caja primero","Elegí la bodega de despacho en el selector","Escaneá el código de barras del producto o tocá su tarjeta en el grid (se agrega al carrito)","Ajustá la cantidad de cada línea si hace falta","Opcional: elegí el cliente (F4); para crédito es obligatorio","Tocá 'Cobrar' (F2)","Dejá el método en 'Efectivo', escribí el efectivo recibido y mirá el vuelto","Confirmá el monto; se imprime/queda el ticket y aparece 'Venta realizada'"],"note":"El total debe cuadrar con lo cobrado: si el efectivo recibido es menor al total, el botón Confirmar queda bloqueado."},{"title":"Vender al crédito","steps":["Elegí el cliente con el selector (F4); si tiene cuenta de crédito aparece su disponible y los días de plazo","Agregá los productos al carrito","Tocá 'Cobrar' y elegí el método 'Crédito' (solo se habilita si el cliente tiene cuenta)","Confirmá; la venta se carga a la cuenta por cobrar del cliente y muestra el disponible restante"],"note":"Sin cliente o sin cuenta de crédito el método Crédito no se puede usar; se avisa si la venta supera el crédito disponible."},{"title":"Autorizar un descuento o cambio de precio (supervisor)","steps":["Si el cajero no tiene permiso de override, tocá 'Autorizar precio/descuento (supervisor)'","El supervisor escribe su usuario, su contraseña y el motivo (mínimo 3 caracteres)","Al autorizar, el carrito habilita editar precio y descuento por línea, y queda un chip indicando quién autorizó","Hacés la venta normal; la autorización queda registrada (auditada) atada a esa factura"],"note":"El supervisor debe ser una persona distinta al cajero (separación de funciones). La autorización vence a los 5 minutos."}],"business_rules":["El precio lo resuelve el servidor desde el catálogo (anti-fraude); mandar un precio distinto al de catálogo o aplicar un descuento exige el permiso sales.pos.price_override, o bien una autorización firmada de un supervisor","La autorización de supervisor no la puede dar el mismo cajero (separación de funciones) y caduca a los 5 minutos; va atada solo a esa caja, sucursal y cajero","Para cobrar en efectivo debe haber una sesión de caja ABIERTA; si no, la venta se rechaza con 'No hay sesión de caja abierta'","El crédito no se mezcla con otros métodos en la misma venta (v1) y exige cliente con cuenta de crédito activa","Los pagos deben cuadrar exactamente con el total de la venta; si no cuadran, se cancela todo (no queda factura a medias)","La venta es idempotente por una clave única: un reintento devuelve la misma factura sin volver a cobrar ni descontar inventario","Un producto sin precio de venta no se puede agregar (salvo override habilitado para fijarlo a mano)"],"permissions":["sales.pos.sell","sales.pos.price_override","sales.pos.report","billing.credit_note.issue","billing.doc.read","billing.doc.print","payments.cash_movement.create","procurement.payable.pay"],"routes":[{"path":"/ventas","name":"ventas","purpose":"Caja de venta (POS de mostrador): escanear, cobrar de contado o crédito, corte, devolución y auto-factura"}],"faqs":[{"q":"¿Cómo cobro en efectivo y calculo el vuelto?","a":"Tocá Cobrar (F2), dejá el método en Efectivo, escribí el efectivo recibido y el sistema muestra el vuelto automáticamente."},{"q":"¿Cómo hago un descuento si no tengo permiso?","a":"Tocá 'Autorizar precio/descuento (supervisor)'; un supervisor con permiso se identifica con su usuario, contraseña y motivo, y queda habilitado por 5 minutos."},{"q":"¿Por qué no me deja cobrar al crédito?","a":"El cliente debe estar seleccionado y tener una cuenta de crédito activa; sin eso el método Crédito queda deshabilitado."},{"q":"¿Qué pasa si se me cae el internet al confirmar?","a":"La venta es idempotente: al reintentar con la misma operación no se duplica la factura ni el cobro."},{"q":"¿Cómo atiendo a otro cliente sin perder el carrito actual?","a":"Tocá 'Dejar en espera'; el ticket queda guardado y lo retomás desde el botón 'En espera' de arriba."}]},{"id":"devoluciones-nota-credito","name":"Devoluciones (Nota de crédito)","icon":"↩️","one_liner":"Emití una nota de crédito por una factura para devolver dinero o mercadería, con opción de reingresar el producto al inventario.","what_it_does":"Permite procesar la devolución de una factura emitida mediante una nota de crédito. Se hace desde el botón 'Devolución' de la Caja de venta, desde el Historial de ventas o desde el detalle de la factura. Buscás la factura, ponés el motivo y decidís si la mercadería vuelve al inventario. La nota de crédito acredita el total del documento y deja registrado en la factura original cuánto se le ha acreditado.","key_features":["Búsqueda de la factura por número para devolver","Motivo obligatorio (mínimo 3 caracteres)","Opción de reingresar la mercadería al inventario (mismo costo y lote)","Muestra cuánto ya se acreditó previamente de esa factura"],"flows":[{"title":"Emitir nota de crédito (devolución) desde la caja","steps":["En la Caja de venta tocá 'Devolución'","Escribí el número de factura y tocá 'Buscar'","Verificá los datos de la factura (cliente, total, y si ya tenía algo acreditado)","Escribí el motivo de la devolución","Dejá activado 'Reingresar la mercadería al inventario' si el producto vuelve a existencias","Tocá 'Emitir nota de crédito'"],"note":"También se puede hacer desde el Historial de ventas (acción del renglón) o desde el detalle de la factura."}],"business_rules":["Solo se puede acreditar una FACTURA que esté EMITIDA (no borradores, no notas de crédito, no anuladas)","La nota de crédito desde estas pantallas acredita el TOTAL del documento; las devoluciones parciales por línea van por API (próxima fase)","Si se marca reingresar mercadería, el inventario se repone con el mismo costo y lote del despacho original","La factura original guarda el acumulado acreditado (credited_total), visible en el historial y el detalle","Emitir notas de crédito exige el permiso billing.credit_note.issue"],"permissions":["billing.credit_note.issue"],"routes":[],"faqs":[{"q":"¿Cómo devuelvo un producto y lo regreso al inventario?","a":"Abrí la devolución, buscá la factura, poné el motivo y dejá activado 'Reingresar la mercadería al inventario' antes de emitir la nota de crédito."},{"q":"¿Puedo devolver solo una parte de la factura?","a":"Desde la pantalla se acredita el total; las devoluciones parciales por línea se hacen por API (función prevista para más adelante)."}]},{"id":"auto-factura-kiosko","name":"Auto-factura / Kiosko","icon":"📱","one_liner":"El cliente arma su propia compra en una tableta y recibe un código corto para pagar en la caja; los precios se confirman al cobrar.","what_it_does":"Es la pantalla de autoservicio donde el propio cliente escanea o toca productos para armar su compra, sin precios manuales ni descuentos. Al terminar genera un código corto (un pre-ticket) que presenta en la caja. El cajero trae ese código, el carrito se llena con los precios de catálogo del momento y cobra normal (contado o crédito). El precio que ve el cliente es solo estimado: el definitivo lo pone la caja al cobrar.\n\nTiene dos formas: /auto-factura dentro del sistema, y /kiosko que es pantalla completa para una tableta dedicada (con bienvenida, auto-reinicio tras mostrar el código, vaciado por inactividad y salida del modo kiosko con pulsación larga).","key_features":["Armado de la compra por el propio cliente con grid táctil y escaneo","Código corto sin caracteres ambiguos para dictar o teclear fácil","Modo kiosko a pantalla completa: bienvenida, auto-reinicio (40s) y vaciado por inactividad (90s)","Impresión de un pre-ticket de 80mm con el código y el total estimado","El cliente puede cancelar su propio ticket antes de pasar a caja"],"flows":[{"title":"El cliente arma su compra y genera el código","steps":["En la tableta, tocá la pantalla para empezar (en modo kiosko)","Escaneá o tocá los productos; ajustá cantidades con + y −","Revisá el total estimado en 'Mi compra'","Tocá 'Generar mi ticket'","Anotá o llevá impreso el código grande que aparece y presentalo en la caja"],"note":"Los precios son estimados; el código vence (8 horas) y los precios definitivos los confirma la caja al cobrar."},{"title":"La caja cobra una auto-factura por código","steps":["En la Caja de venta tocá 'Auto-factura (F6)'","Escribí el código del ticket del cliente y tocá 'Traer'","El carrito se llena con los precios de catálogo de HOY (se avisan los artículos sin precio o inactivos que se omiten)","Cobrás normalmente (contado o crédito) y al confirmar el ticket queda marcado como cobrado"],"note":"Si la auto-factura ya fue cobrada, cancelada o venció, el sistema lo avisa y el cliente debe armarla de nuevo."}],"business_rules":["El pre-ticket NO reserva stock ni fija precios: solo guarda artículo y cantidad; el precio se recalcula al traerlo a la caja","Al crear el ticket todos los artículos deben tener precio público; el kiosko no inventa precios","El código vence a las 8 horas (expiración automática); un ticket vencido, cobrado o cancelado ya no se puede usar","El cobro del ticket se marca dentro de la misma transacción de la venta: si el cobro falla, el ticket sigue abierto","El kiosko corre con una cuenta de autoservicio (permiso sales.pos.self_service) fijada a una sola sucursal"],"permissions":["sales.pos.self_service"],"routes":[{"path":"/auto-factura","name":"auto-factura","purpose":"Pantalla de autoservicio dentro del sistema para que el cliente arme su compra"},{"path":"/kiosko","name":"kiosko-autofactura","purpose":"Modo kiosko a pantalla completa para una tableta dedicada de autoservicio (sin menú)"}],"faqs":[{"q":"¿Cómo cobro el código que trae un cliente del kiosko?","a":"En la caja tocá 'Auto-factura (F6)', escribí el código y tocá Traer; el carrito se llena con los precios de hoy y cobrás normal."},{"q":"¿Por qué el total del kiosko no coincide con la caja?","a":"El precio del kiosko es estimado; el definitivo lo resuelve la caja al cobrar (puede aplicar listas de precio o mayoreo según el cliente)."},{"q":"¿Cuánto dura el código?","a":"Vence a las 8 horas; pasado ese tiempo el cliente debe volver a armar su compra."},{"q":"¿Cómo salgo del modo kiosko en la tableta?","a":"Mantené presionada la marca/logo del encabezado unos segundos y confirmá salir."}]},{"id":"historial-ventas","name":"Historial de ventas","icon":"📜","one_liner":"Buscá facturas por fecha, cliente o número para verlas, reimprimirlas (marcadas como COPIA), devolverlas o anularlas.","what_it_does":"Es el listado de facturas para consultar y actuar sobre ventas ya hechas. Filtrás por rango de fechas, estado (emitidas, anuladas, borrador) y por cliente o número. De cada factura podés ver el detalle completo con sus líneas y totales, reimprimir el ticket (siempre marcado como COPIA sin valor fiscal), iniciar una devolución (nota de crédito) o anularla con motivo. Cada acción queda auditada.","key_features":["Filtros por fecha desde/hasta, estado y búsqueda por cliente o número","Detalle de la factura con líneas, subtotal, IVA, total, método de pago y estado fiscal","Reimpresión marcada como COPIA — REIMPRESIÓN (documento sin valor fiscal)","Devolución (nota de crédito) y anulación con motivo desde el mismo listado","Marca de notas de crédito ya acreditadas sobre cada factura"],"flows":[{"title":"Buscar y reimprimir una factura","steps":["Ajustá los filtros de fecha y/o escribí el cliente o número en la búsqueda","Ubicá la factura en la tabla","Tocá el ícono de imprimir del renglón (solo en facturas emitidas)","Se abre la copia marcada como COPIA — REIMPRESIÓN para imprimir"],"note":"La copia en pantalla es sin valor fiscal; si tenés permiso billing.doc.print, además se encola la reimpresión fiscal."},{"title":"Anular una factura","steps":["Encontrá la factura emitida en el listado","Tocá el ícono de anular (bloqueo) del renglón","Escribí el motivo de la anulación (mínimo 3 caracteres)","Confirmá 'Anular factura'"],"note":"La anulación es definitiva y queda auditada. Requiere el permiso billing.doc.void."}],"business_rules":["Reimprimir, devolver y anular solo aparecen en facturas EMITIDAS","La reimpresión sale rotulada como COPIA — REIMPRESIÓN con la fecha de reimpresión y la leyenda 'Documento sin valor fiscal'","La devolución solo se ofrece sobre documentos tipo factura (INVOICE)","La anulación exige motivo de al menos 3 caracteres y queda registrada","Cada factura muestra su estado de pago (pendiente, parcial, pagada) y si tiene notas de crédito aplicadas"],"permissions":["billing.doc.read","billing.doc.print","billing.credit_note.issue","billing.doc.void"],"routes":[{"path":"/ventas/historial","name":"ventas-historial","purpose":"Listado y búsqueda de facturas con ver detalle, reimprimir, devolver y anular"}],"faqs":[{"q":"¿Cómo reimprimo un ticket de una venta de ayer?","a":"Filtrá por la fecha o buscá el número, abrí la factura y tocá Reimprimir; sale marcada como COPIA."},{"q":"¿Cómo anulo una factura mal hecha?","a":"En el renglón de la factura emitida tocá el ícono de anular, escribí el motivo y confirmá; queda auditada."},{"q":"¿Por qué la reimpresión dice que no tiene valor fiscal?","a":"Es una copia para referencia; la factura fiscal original ya fue emitida una sola vez."}]},{"id":"facturacion","name":"Facturación","icon":"🧾","one_liner":"Creá y gestioná facturas, notas de crédito y cotizaciones: emitir asigna el número fiscal, puede bajar inventario y registrar abonos.","what_it_does":"Es el módulo formal de documentos de venta (más allá del mostrador). Permite crear un documento borrador (factura, nota de crédito o cotización) con sus líneas tomadas o no del catálogo, marcarlo como fiscal, y luego emitirlo. Al emitir, el documento toma su número (fiscal si corresponde), queda en firme y opcionalmente baja inventario de una bodega e imprime. Desde el detalle se registran abonos (pagos parciales) con su estado (pendiente/parcial/pagada), se reversan abonos, se convierten cotizaciones en factura, se emiten notas de crédito y se maneja la contingencia fiscal (impresora caída).","key_features":["Crear documentos borrador con líneas manuales o tomadas del catálogo (autocompleta precio e IVA)","Emitir el documento: asigna número, queda en firme, opción de bajar inventario e imprimir","Abonos por documento con recálculo automático de estado de pago y reversa de abonos","Convertir cotización en factura y emitir nota de crédito (devolución)","Gestión de contingencia fiscal: marcar contingencia, reintentar impresión o anular por contingencia","Filtros por estado, tipo y búsqueda por cliente o número"],"flows":[{"title":"Crear y emitir una factura","steps":["Tocá 'Nuevo documento'","Elegí el tipo (Factura), el método de pago y el cliente (de Terceros o texto libre)","Activá 'Documento fiscal' si debe numerarse e imprimirse","Agregá líneas: buscá el artículo del inventario (autocompleta precio e IVA) o escribilas a mano","Tocá 'Crear borrador' (se abre el detalle del documento)","En el detalle tocá 'Emitir', decidí si bajar inventario (elegí bodega) e imprimir, y confirmá"],"note":"Al emitir, el documento toma su número y queda en firme; ya no es un borrador editable."},{"title":"Registrar un abono a una factura","steps":["Abrí el detalle de la factura emitida","En el bloque Pagos tocá 'Registrar abono'","Elegí el método, escribí el monto (se sugiere el saldo pendiente) y una referencia","Tocá 'Registrar'; el estado de pago se recalcula (pendiente/parcial/pagada)"],"note":"Un abono confirmado se puede revertir con motivo si tenés el permiso correspondiente."},{"title":"Resolver una contingencia fiscal","steps":["En el detalle de una factura fiscal emitida tocá 'Marcar contingencia' e indicá el motivo (ej. impresora sin papel)","Cuando se resuelva el problema, tocá 'Reintentar impresión' para reencolar la impresión","Si no se puede imprimir, usá 'Anular por contingencia' para dejarla anulada"],"note":"La contingencia aplica a documentos fiscales en modo B; cada acción exige su permiso (contingency / contingency.resolve)."}],"business_rules":["Un borrador no se puede anular como tal: solo se anula un documento ya emitido; las cotizaciones anuladas no se convierten","Solo se puede acreditar (nota de crédito) una factura EMITIDA; una nota de crédito acredita el total y suma al credited_total de la original","Emitir baja inventario solo si se marca 'Bajar inventario' y se elige la bodega de despacho","El estado de pago se recalcula automáticamente al registrar/reversar abonos (pendiente, parcial, pagada, sobrepagada)","No se puede pagar ni abonar un documento anulado; no se reversa un pago pendiente de confirmación","Las tasas de IVA y descuento se manejan como fracción decimal en el backend (0.15 = 15%)","El estado fiscal sigue una máquina de estados: número reservado → emitido → impreso, con desvíos a contingencia o anulado","Cada acción (crear, emitir, anular, abonar, contingencia) exige su propio permiso"],"permissions":["billing.doc.read","billing.doc.create","billing.doc.issue","billing.doc.print","billing.doc.void","billing.doc.contingency","billing.doc.contingency.resolve","billing.credit_note.issue","billing.payment.read","billing.payment.create","billing.payment.reverse"],"routes":[{"path":"/facturacion","name":"facturacion","purpose":"Listado de facturas, notas de crédito y cotizaciones, con crear nuevo documento"},{"path":"/facturacion/:id","name":"factura-detalle","purpose":"Detalle del documento: emitir, imprimir, abonar, nota de crédito, convertir, anular y contingencia"}],"faqs":[{"q":"¿Cómo paso una factura de borrador a definitiva?","a":"Abrí su detalle y tocá 'Emitir'; ahí decidís si bajar inventario e imprimir. Al emitir toma su número y queda en firme."},{"q":"¿Cómo registro un pago parcial de una factura?","a":"En el detalle de la factura, bloque Pagos, tocá 'Registrar abono', poné el monto y el método; el estado de pago se actualiza solo."},{"q":"¿Qué hago si la impresora fiscal falla?","a":"Marcá la factura en contingencia con el motivo; cuando se resuelva reintentás la impresión o la anulás por contingencia."},{"q":"¿Puedo convertir una cotización en factura?","a":"Sí, desde el detalle de la cotización tocá 'Convertir a factura' (si no está anulada)."}]},{"id":"config-fiscal","name":"Configuración fiscal","icon":"⚙️","one_liner":"Definí cómo numera e imprime los documentos fiscales la sucursal: modo fiscal, impresora, impresión obligatoria e integridad estricta.","what_it_does":"Es la configuración fiscal de la sucursal activa. Define el modo fiscal (NOOP = sin integración con numeración interna, o modos A/B con impresora fiscal), el adaptador de impresora, si la impresión es obligatoria para cerrar la venta, si se aplica integridad estricta (rechazar si la impresora no confirma), cuántos reintentos hay antes de pasar a contingencia y si la configuración está activa. La pantalla es de solo lectura para quien no tenga permiso de edición.","key_features":["Selección del modo fiscal: Sin integración (NOOP), Modo A o Modo B","Adaptador de impresora fiscal","Impresión obligatoria para cerrar la venta","Integridad estricta (rechaza si la impresora no confirma)","Máximo de reintentos antes de pasar a contingencia"],"flows":[{"title":"Cambiar el modo fiscal de la sucursal","steps":["Entrá a Facturación y tocá 'Config fiscal'","Elegí el modo fiscal (NOOP / A / B)","Ajustá el adaptador, la impresión obligatoria, la integridad estricta y los reintentos","Tocá 'Guardar configuración'"],"note":"Si no tenés permiso de edición la pantalla queda en solo lectura."}],"business_rules":["La configuración es por sucursal activa","Ver la configuración exige billing.fiscal.config.read; cambiarla exige billing.fiscal.config.update","NOOP significa sin integración fiscal (numeración interna)","El máximo de reintentos antes de contingencia se limita entre 1 y 20"],"permissions":["billing.fiscal.config.read","billing.fiscal.config.update"],"routes":[{"path":"/facturacion/config-fiscal","name":"facturacion-config-fiscal","purpose":"Configurar el modo fiscal, la impresora y las reglas de impresión de la sucursal"}],"faqs":[{"q":"¿Qué significa el modo NOOP?","a":"Que la sucursal trabaja sin integración fiscal, con numeración interna del sistema."},{"q":"¿Por qué la pantalla está en solo lectura?","a":"No tenés el permiso billing.fiscal.config.update; podés ver pero no cambiar la configuración."}]},{"id":"caja","name":"Caja (sesión, arqueo y cierre)","icon":"💵","one_liner":"Abrí la caja con un fondo, registrá movimientos y cobros, contá la gaveta por denominación y cerrá comparando contra lo esperado.","what_it_does":"Maneja la sesión de caja de la sucursal: abrir con un fondo inicial (lo que hay en la gaveta al empezar), registrar movimientos (ingresos, egresos, ajustes, devoluciones), cobrar cuentas por cobrar de clientes en efectivo/transferencia/tarjeta/cheque y registrar pagos a proveedores. Para cerrar se hace el arqueo: se cuenta la gaveta por denominación (billetes y monedas de córdoba) y el total contado se compara contra lo esperado, mostrando la diferencia. El cierre queda con esa diferencia registrada.","key_features":["Apertura de caja con fondo inicial y nota opcional","Movimientos de caja (ingreso, egreso, ajuste, devolución) con referencia y motivo","Cobro de cuentas por cobrar de clientes y pago a proveedores desde la caja","Arqueo por denominación (billetes 1000–10, monedas 5–0.25 córdobas) con cálculo del total contado","Cierre con comparación contado vs esperado y la diferencia resaltada","Acceso al historial de sesiones y a los intentos de pago"],"flows":[{"title":"Abrir la caja al inicio del día","steps":["Entrá a Caja","Escribí el fondo inicial (lo que hay en la gaveta) y una nota si querés","Tocá 'Abrir caja'"],"note":"Requiere el permiso payments.cash_session.open. Con la caja abierta ya se pueden cobrar ventas en efectivo."},{"title":"Hacer el arqueo y cerrar la caja","steps":["Con la sesión abierta, en 'Arqueo y cierre' contá la gaveta poniendo la cantidad de cada billete y moneda","Mirá el total contado, lo esperado y la diferencia","Tocá 'Guardar arqueo' para dejar registrada la cuenta","Tocá 'Cerrar caja' y confirmá; el cierre guarda la diferencia"],"note":"Cerrar exige payments.cash_session.close. La diferencia se muestra en verde si es cero y en rojo si hay faltante o sobrante."},{"title":"Cobrar una cuenta por cobrar de un cliente","steps":["En Movimientos tocá 'Cobro de cliente'","Elegí el cliente y luego su cuenta por cobrar abierta","Ajustá el monto (se sugiere el saldo) y el método de cobro","Tocá 'Cobrar'; el cobro se aplica a la cartera, se refleja en la factura de origen y entra a la sesión"],"note":"El monto no puede superar el saldo pendiente de la cuenta por cobrar."}],"business_rules":["La diferencia de cierre se valida como contado − esperado (consistencia obligatoria en el modelo)","El cobro de una CxC no puede exceder el saldo pendiente, y no se cobra sobre cuentas pagadas, canceladas o castigadas","El cobro en efectivo y el ingreso de la venta req
